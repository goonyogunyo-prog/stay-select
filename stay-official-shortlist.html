<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式掲載38施設の比較メモ｜STAY SELECT</title><meta name="description" content="公式観光団体掲載の宿泊候補を比較・保存するローカルメモ。予約や空室の保証はしません。"><link rel="stylesheet" href="assets/stay-official-shortlist.css"></head><body><header><a href="index.html">STAY SELECT</a><nav><a href="new-arrivals.html">新着施設</a><a href="stay-total-cost-check.html">総額試算</a></nav></header><main><p class="eyebrow">SOURCE-VERIFIED SHORTLIST</p><h1>宿泊候補の比較・確認メモ</h1><p>新着38施設の公式観光団体掲載を確認しながら候補を保存。チェック状態はこの端末内のみ。宿への送信・予約・GitHub更新は行いません。</p><aside>掲載元は宿泊施設の存在・県の確認用です。料金・営業・空室・設備・楽天個別予約URLはすべて未検証です。</aside><section class="controls"><label>施設名検索<input id="q" type="search" placeholder="宿名で絞り込み"></label><label>県<select id="pref"><option value="">全県</option><option>長野県</option><option>福井県</option></select></label><label>候補状態<select id="state"><option value="">すべて</option><option value="saved">候補に保存</option><option value="unsaved">未保存</option></select></label></section><div class="actions"><button id="export" type="button">比較メモCSVを保存</button><button id="clear" type="button">候補保存を解除</button><span id="count" role="status"></span></div><section id="results" class="grid" aria-live="polite"></section><p class="small">予約CTAは未照合施設には表示しません。公式観光団体掲載ページから宿の公式情報を確認してください。</p></main><script src="assets/stay-official-shortlist.js" defer></script></body></html>
