<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECT全国10,808施設から宿を探し、SNS掲載画像の権利元・利用許諾・掲載範囲を手動管理。権利確認を自動判定しません。"><title>SNS画像の利用許諾台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-media-rights-tracker.css"></head>
<body><header><a href="index.html">STAY SELECT トップ</a><h1>SNS画像の利用許諾台帳</h1><p>写真・画像の出所、許諾の有無、掲載先を記録するための個人用メモです。権利や許諾の有無を自動判定しません。</p></header><main>
<section><h2>宿泊施設を選択</h2><label for="search">施設名検索（全国10,808施設）</label><input id="search" type="search" autocomplete="off" placeholder="宿の名前を入力"><div id="results" aria-live="polite"></div></section>
<section><h2>画像素材の記録</h2><p>実際の画像ファイルは保存しません。公式サイトに掲載された画像も、転載可能とは限りません。許諾未確認・不可の素材を投稿しないでください。</p><p id="selected-hotel">施設を検索して選択してください。</p><div class="fields"><label>素材の識別名<input id="asset-name" maxlength="120" placeholder="例：外観写真01"></label><label>画像の権利元・提供元<input id="owner" maxlength="120" placeholder="例：宿泊施設の広報担当"></label><label>画像の出所URL（任意）<input id="source-url" type="url" placeholder="https://"></label><label>利用許諾の状態<select id="permission"><option value="未確認">未確認</option><option value="許諾済み">許諾済み（根拠は手動確認）</option><option value="使用不可">使用不可</option></select></label><label>許諾を確認した日<input id="confirmed-date" type="date"></label><label>掲載可能な媒体<input id="scope" maxlength="160" placeholder="例：Instagramのみ／TikTokも可"></label><label>許諾根拠・条件のメモ<textarea id="proof" rows="3" maxlength="500" placeholder="例：メールで確認した範囲、クレジット要否"></textarea></label></div><button id="add" type="button">台帳に追加</button><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>保存した台帳 <span id="count">0件</span></h2><label for="filter">許諾状態で絞り込み</label><select id="filter"><option value="">すべて</option><option value="未確認">未確認</option><option value="許諾済み">許諾済み</option><option value="使用不可">使用不可</option></select><div id="entries"></div><div class="actions"><button type="button" id="export-csv">CSV出力</button><button type="button" id="export-json">JSONバックアップ</button><label class="filelabel">JSONを復元<input type="file" id="import-json" accept="application/json,.json"></label></div><p>最大500件。この端末のlocalStorageに記録します。共有端末での使用に注意してください。CSV/JSONはご自身で安全に保管してください。</p></section>
</main><script src="assets/stay-media-rights-tracker.js" defer></script></body></html>
