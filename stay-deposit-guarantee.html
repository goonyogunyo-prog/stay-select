<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊の前払金・保証金・デポジット・返金期日を最大4施設で比較する手入力チェックシート。"><title>前払金・デポジット条件チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-deposit-guarantee.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>前払金・デポジット条件チェック</h1><p>予約前に、前払金・保証金・返金条件・支払期限を比較できます。</p></div></header><main class="wrap"><section class="panel"><h2>全国8,607施設から検索</h2><label for="search">宿名・都道府県</label><input id="search" type="search" placeholder="例：旅館、岐阜県"><p id="status" aria-live="polite">読み込み中</p><div id="results" class="results"></div></section><section class="panel"><h2>前払金・保証金の確認メモ（最大4施設）</h2><p class="notice">金額・期日・返金条件は<strong>利用者が公式案内や宿に直接確認して入力</strong>します。自動取得、決済、予約変更、返金保証は行いません。金額は円建ての参考入力です。カード番号・銀行口座・個人情報は入力しないでください。端末内保存のみです。</p><div id="selected" class="cards"></div><div class="actions"><button id="save" type="button">ブラウザ保存</button><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="light">全解除</button></div><p id="message" role="status"></p></section></main><script src="assets/stay-deposit-guarantee.js" defer></script></body></html>
