<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長期滞在の洗濯・衣類枚数プラン｜STAY SELECT</title><meta name="description" content="旅行日数・洗濯間隔・乾燥日数から必要な衣類枚数と洗濯費用の概算を端末内で計算。CSV保存対応。"><link rel="stylesheet" href="stay-laundry-packing-planner.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>長期滞在の洗濯・衣類枚数プラン</h1><p>連泊中の洗濯間隔と乾燥待ちを考慮して、持参する衣類の枚数と洗濯費用を比較します。2つのプランを入力できます。</p><p class="notice">すべて仮定値による目安です。宿の洗濯機・乾燥機の有無、料金、利用時間、洗剤、衣類の乾燥条件は宿に確認してください。予約・決済・外部送信はありません。</p><div class="fields"><label>旅行日数（日）<input id="days" type="number" min="1" max="90" value="7"></label><label>1日あたり必要な衣類セット数<input id="perDay" type="number" min="1" max="5" value="1"></label><label>予備セット数<input id="spares" type="number" min="0" max="20" value="1"></label></div><div class="plans"><section><h2>プランA：洗濯しない</h2><p>必要な衣類セット数を旅行日数から試算します。</p></section><section><h2>プランB：滞在中に洗濯する</h2><div class="fields"><label>洗濯間隔（日）<input id="interval" type="number" min="1" max="90" value="3"></label><label>洗濯後の乾燥待ち（日）<input id="dry" type="number" min="0" max="7" value="1"></label><label>1回の洗濯＋乾燥費（円）<input id="cost" type="number" min="0" max="10000" value="600"></label></div></section></div><div class="actions"><button id="calc">プランを計算</button><button id="csv" class="secondary">CSVを保存</button></div><p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="試算結果"></section><p class="footnote">洗濯後の乾燥待ちの間も着替えを確保する簡易モデルです。乾燥に時間がかかる素材や複数人での共有は別途調整してください。</p></main><script src="stay-laundry-packing-planner.js"></script></body></html>
