<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊キャンセル期限確認メモ｜STAY SELECT</title><link rel="stylesheet" href="stay-reservation-policy-transcription.css"><main><h1>宿泊キャンセル期限確認メモ</h1><p>予約条件を転記し、キャンセル期限の確認用メモを作成します。施設の実際の規約を必ず確認してください。</p><label>宿泊施設名<input id="hotel" placeholder="施設名"></label><label>チェックイン日時<input id="checkin" type="datetime-local"></label><label>無料キャンセル期限（予約条件に記載の日時）<input id="deadline" type="datetime-local"></label><label>期限後のキャンセル料金・注意事項<textarea id="terms" rows="3" placeholder="例：前日から宿泊料金の50%"></textarea></label><button id="make">確認メモを作成</button><button id="copy">コピー</button><pre id="result" aria-live="polite"></pre><small>自動的に料金や期限を推定しません。入力は端末内だけで処理し、送信・保存しません。</small></main><script src="stay-reservation-policy-transcription.js"></script></html>
