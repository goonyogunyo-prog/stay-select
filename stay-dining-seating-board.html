<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿の会食・宴会席次ボード｜STAY SELECT</title><meta name="description" content="旅館の会食・宴会・家族旅行で席番号と参加者、配慮事項を利用者が記録する席次ボード。"><link rel="stylesheet" href="assets/stay-dining-seating-board.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿の会食・宴会席次ボード</h1><p>最大24席の座席と参加者、食事の配慮事項をまとめて確認。</p></header><main><section class="panel"><p class="warning"><strong>ご注意：</strong>座席配置、会場の定員、アレルギー対応、料理の提供条件は施設へ直接確認してください。入力内容は端末内のメモであり、宿や参加者へ送信されません。氏名などの個人情報を共有端末に保存しないでください。</p><div class="fields"><label>施設名・都道府県で検索<input id="query" placeholder="宿名を入力" autocomplete="off"></label><label>検索結果（最大50件）<select id="stay"><option value="">検索してください</option></select></label><label>会食・グループ名<input id="group" maxlength="60" placeholder="例：家族旅行の夕食"></label><label>席番号（1〜24）<select id="seat"></select></label><label>参加者（ニックネーム可）<input id="guest" maxlength="60" placeholder="例：Aさん"></label><label>食事・移動等の配慮メモ<input id="needs" maxlength="200" placeholder="例：アレルギーは施設に確認済み"></label></div><div class="actions"><button id="add" type="button">席を登録</button><button id="csv" type="button" class="secondary">CSV出力</button><button id="json" type="button" class="secondary">JSONバックアップ</button><label class="file-label">JSON復元<input id="import" type="file" accept=".json,application/json" hidden></label><button id="print" type="button" class="secondary">印刷</button><button id="clear" type="button" class="danger">全席を消去</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>席次表</h2><p id="summary" class="muted">まだ登録されていません。</p><div id="board" class="board" aria-label="会食席次表"></div></section><p><a href="new-arrivals.html">新着施設一覧</a> ／ <a href="index.html">トップに戻る</a></p></main><script src="assets/stay-dining-seating-board.js" defer></script></body></html>
