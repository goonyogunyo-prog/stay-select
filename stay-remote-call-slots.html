<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先でのオンライン会議・通話時間を調整。場所の重複を確認し、CSV・JSONに保存できます。"><title>オンライン会議・静かな場所の時間割｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-remote-call-slots.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>オンライン会議・静かな場所の時間割</h1><p>宿泊先での通話・会議が重ならないよう、場所ごとの利用予定を整理</p></header><main><section class="panel"><label>宿泊先を検索 <input id="staySearch" type="search" placeholder="施設名・都道府県"></label><select id="staySelect" aria-label="宿泊先を選択"><option value="">施設を選択してください</option></select><p id="stayCount">宿泊先を読み込み中…</p><p class="hint">実際の個室・共用部の利用可否、Wi-Fi、通話ルール、静音時間は施設に直接確認してください。自動判定ではありません。</p></section><section class="panel"><h2>会議・通話予定を登録</h2><div class="form"><label>担当者（任意）<input id="person" maxlength="60" placeholder="例：Aさん"></label><label>場所（同名は同じ場所として重複判定）<input id="room" maxlength="70" placeholder="例：客室A / 共用ラウンジ"></label><label>開始日時<input id="start" type="datetime-local"></label><label>終了日時<input id="end" type="datetime-local"></label><label>内容（任意）<input id="memo" maxlength="120" placeholder="例：面接・オンライン授業"></label></div><button id="add">予定を追加</button><p id="message" role="status"></p></section><section class="panel"><h2>時間帯の重複チェック</h2><p id="summary"></p><div id="alerts" aria-live="polite"></div><div class="tablewrap"><table><thead><tr><th>担当者</th><th>場所</th><th>開始</th><th>終了</th><th>内容</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="import">JSON復元<input id="restore" type="file" accept=".json,application/json"></label><button id="clear" class="warn">全削除</button></div></section><section class="panel"><h2>事前に施設へ確認すること</h2><p>①通話できる場所と時間帯 ②Wi-Fi品質 ③イヤホン・音量 ④共有スペースの予約要否 ⑤深夜・早朝の静音ルール。ここで入力した予定は施設への予約ではありません。</p></section></main><script src="assets/stay-remote-call-slots.js" defer></script></body></html>
