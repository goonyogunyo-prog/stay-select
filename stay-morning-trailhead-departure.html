<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>早朝出発・登山口到着逆算ボード｜STAY SELECT</title><meta name="description" content="宿泊先から早朝の登山口や観光集合場所への到着時刻を逆算し、起床・出発時刻を計画する利用者メモ"><link rel="stylesheet" href="assets/stay-morning-trailhead-departure.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>早朝出発・登山口到着逆算ボード</h1><p>登山口・朝日撮影・集合場所への到着を目指す出発時刻を逆算</p></header><main><section class="panel"><p class="notice"><strong>重要：</strong>交通所要時間、道路規制、登山道、日の出時刻、送迎、営業時間、安全性は自動取得しません。公式案内と天候・交通情報を事前確認し、余裕をもって行動してください。予約・通知・現在地追跡は行いません。</p><div class="fields"><label>宿泊施設名・都道府県で検索<input id="q" placeholder="施設名・都道府県" autocomplete="off"></label><label>検索結果（最大50件）<select id="stay"><option value="">施設を検索してください</option></select></label><label>到着予定日<input id="date" type="date"></label><label>現地到着目標時刻<input id="target" type="time" value="06:00"></label><label>宿から現地への移動（分）<input id="travel" type="number" min="0" max="1440" value="45"></label><label>駐車・乗換・安全余裕（分）<input id="buffer" type="number" min="0" max="720" value="30"></label><label>起床後の準備（分）<input id="prep" type="number" min="0" max="720" value="60"></label><label>行き先・交通確認メモ<input id="note" maxlength="220" placeholder="登山口名・送迎可否・道路情報の確認日"></label></div><div class="actions"><button id="add">計画を追加</button><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSON保存</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json" hidden></label><button id="clear" class="danger">全件削除</button></div><p id="message" role="status" aria-live="polite"></p><p id="summary" class="muted"></p><div id="list"></div></section><p><a href="new-arrivals.html">新着38施設を見る</a> ／ <a href="index.html">トップへ戻る</a></p></main><script src="assets/stay-morning-trailhead-departure.js" defer></script></body></html>
