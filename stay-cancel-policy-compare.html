<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="最大4施設のキャンセル無料期限と確認済み規定、概算キャンセル料を自分で記録して比較。公式情報の自動取得や予約変更はしません。"><title>キャンセル期限・返金条件 比較メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-cancel-policy-compare.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>キャンセル期限・返金条件 比較メモ</h1><p>予約前に公式規定を確認し、最大4宿の期限・費用を並べて管理</p></header><main><p class="notice">宿のキャンセル規定、返金率、料金、空室、予約状況は自動取得しません。入力内容は利用者の確認メモです。必ず実際の予約先の規定とタイムゾーン・締切時刻を確認してください。予約・キャンセルの送信機能はありません。</p><section class="panel"><h2>比較対象を登録</h2><div class="fields"><label>宿名検索<input id="query" placeholder="施設名を入力" autocomplete="off"></label><label>対象施設<select id="stay"><option value="">宿名を入力</option></select></label><label>チェックイン日<input id="checkin" type="date" required></label><label>無料キャンセル期限（日付）<input id="deadline" type="date"></label><label>予約予定総額（税込・円、任意）<input id="total" type="number" min="0" max="99999999" step="1" placeholder="例：25000"></label><label>確認済みキャンセル料（円、任意）<input id="fee" type="number" min="0" max="99999999" step="1" placeholder="例：5000"></label><label>確認元URL（任意）<input id="policy" type="url" maxlength="500" placeholder="公式規定または予約条件URL"></label><label>確認日時・注意事項メモ<input id="memo" maxlength="240" placeholder="例：締切は前日18時／人数変更に別条件"></label></div><div class="actions"><button id="add" type="button">比較に追加（最大4件）</button><button id="csv" type="button" class="secondary">CSV出力</button><button id="json" type="button" class="secondary">JSON出力</button><label class="file">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">全件削除</button></div><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>比較一覧 <span id="count">0/4</span></h2><div id="list" class="cards"></div></section><p class="back"><a href="new-arrivals.html">新着38施設を見る</a> ／ <a href="index.html">トップへ戻る</a></p></main><script src="assets/stay-cancel-policy-compare.js" defer></script></body></html>
