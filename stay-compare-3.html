<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>3施設を比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-compare-3.css"><script defer src="assets/stay-compare-3.js"></script></head>
<body><main class="wrap"><nav><a href="index.html">← STAY SELECT</a>　<a href="new-arrivals.html">新着施設</a></nav><p class="eyebrow">STAY SELECT / COMPARE</p><h1>気になる宿を3施設まで比較</h1><p class="intro">全国の掲載施設から選んで、宿の種類・公式出典・確認済み情報を並べて比較できます。<strong>「未確認」は設備がないという意味ではありません。</strong>料金・空室・営業状況は掲載していません。</p>
<section class="searchbox" aria-label="施設を探す"><div class="fields"><label>施設名・地域・IDで検索<input id="q" type="search" placeholder="例：阿蘇、民宿、stay-11883" autocomplete="off"></label><label>都道府県<select id="pref"><option value="">全国</option></select></label></div><p id="status" role="status" aria-live="polite">施設データを読み込んでいます…</p><div id="results" class="results" aria-label="検索結果"></div></section>
<section class="compare" aria-labelledby="compare-title"><div class="compare-header"><h2 id="compare-title">比較リスト <span id="count">0/3</span></h2><button id="clear" type="button">選択を解除</button></div><div id="compare-table" class="table-scroll"><p class="empty">検索結果から「比較に追加」を押してください。</p></div><button id="export" type="button" disabled>比較結果をCSV保存</button><p class="caution">出典URLは観光協会・自治体などの掲載根拠です。予約・営業・価格・設備の保証ではありません。未照合施設の楽天トラベル個別予約URLや成果URLは表示しません。</p></section>
<footer><a href="index.html">STAY SELECT トップに戻る</a></footer></main></body></html>
