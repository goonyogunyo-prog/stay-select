<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国8,379施設から最大4宿を選び、チェックイン前・チェックアウト後の荷物預かり可否と料金、受取期限を比較。利用者確認メモ。"><title>チェックイン前後の荷物預かり比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-luggage-storage-windows.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>チェックイン前後の荷物預かり比較</h1><p>預けられる時間、受取締切、荷物の個数・料金を最大4宿で比較する手入力メモです。</p></div></header><main class="wrap"><section class="panel"><h2>宿泊施設を探す</h2><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：民宿 長野県" autocomplete="off"><p id="count" class="muted">施設データを読み込み中…</p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>荷物預かり条件（最大4宿）</h2><p class="muted">宿への事前確認内容を入力してください。宿の荷物預かりサービスの有無・料金・営業時間を自動取得しません。参考費用は個数×単価の単純計算です。</p><div id="cards" class="grid"></div></section><section class="panel"><h2>保存・持ち出し</h2><div class="actions"><button id="csv">CSVを出力</button><button id="json">JSONを出力</button><label class="file">JSONを復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear">比較をすべて解除</button></div><p id="status" role="status" aria-live="polite"></p></section><aside class="notice">注意：荷物の預かり可否、貴重品・食品の受入、保管責任、営業時間、追加料金は必ず宿に直接確認してください。ここでの入力・計算は予約・預かりを保証しません。</aside></main><script src="assets/stay-luggage-storage-windows.js" defer></script></body></html>
