<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊税・入湯税を含む総額メモ | STAY SELECT</title><link rel="stylesheet" href="stay-tax-budget-helper.css"></head><body><main><h1>宿泊税・入湯税を含む総額メモ</h1><p>税額は自治体・宿泊日・宿泊料金で変わります。公式案内を確認して、該当する金額を手入力してください。</p><label>宿泊料金の合計（円）<input id="base" type="number" min="0" step="1" value="30000"></label><label>人数<input id="people" type="number" min="1" step="1" value="2"></label><label>泊数<input id="nights" type="number" min="1" step="1" value="1"></label><label>宿泊税（1人1泊あたり・円）<input id="staytax" type="number" min="0" step="1" value="0"></label><label>入湯税（1人1泊あたり・円）<input id="bathtax" type="number" min="0" step="1" value="0"></label><label>その他現地支払い合計（円）<input id="extra" type="number" min="0" step="1" value="0"></label><button id="calc">計算する</button><button id="copy">結果をコピー</button><output id="result" aria-live="polite"></output><p class="note">この計算は見積もり用です。非課税・免税、年齢、課税区分、税込表示、料金改定等は反映されません。実際の支払いは施設・自治体の最新情報を優先してください。</p></main><script src="stay-tax-budget-helper.js"></script></body></html>
