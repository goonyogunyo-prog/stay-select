<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿のチェックイン・チェックアウトに合わせた移動時刻を手入力の所要時間から計算。"><title>チェックイン・移動時刻プランナー｜STAY SELECT</title><link rel="stylesheet" href="stay-checkin-timeline.css" defer></head><body><header><a href="index.html" class="brand">STAY SELECT</a><h1>チェックイン・移動時刻プランナー</h1><p>宿泊施設のチェックイン・チェックアウトと、入力した移動時間・余裕時間から出発時刻を逆算します。移動時間や宿の条件は自動取得しません。</p></header><main><form id="planner"><section><h2>宿への到着</h2><label>チェックイン日<input id="checkinDate" type="date" required></label><label>チェックイン予定時刻<input id="checkinTime" type="time" value="15:00" required></label><label>宿までの移動時間（分）<input id="travelIn" type="number" min="0" max="10080" value="90" required></label><label>到着前の余裕（分）<input id="bufferIn" type="number" min="0" max="1440" value="30" required></label></section><section><h2>宿からの出発</h2><label>チェックアウト日<input id="checkoutDate" type="date" required></label><label>チェックアウト時刻<input id="checkoutTime" type="time" value="10:00" required></label><label>退室前に必要な余裕（分）<input id="bufferOut" type="number" min="0" max="1440" value="20" required></label><label>次の目的地までの移動時間（分）<input id="travelOut" type="number" min="0" max="10080" value="60" required></label></section><button type="submit">時刻を計算する</button></form><section class="result" aria-live="polite"><h2>計算結果</h2><p id="message">日付と時刻を入力して計算してください。</p><pre id="result"></pre><div class="actions"><button id="copy" type="button" disabled>結果をコピー</button><button id="csv" type="button" disabled>CSVを保存</button></div></section><p class="notice">このツールは手入力の時刻から計算するだけです。宿泊施設の最終チェックイン時刻、送迎、道路状況、キャンセル規定、交通機関の運行状況は必ず公式情報で確認してください。入力情報は外部送信されません。</p><p><a href="index.html">トップへ戻る</a></p></main><script src="stay-checkin-timeline.js" defer></script></body></html>
