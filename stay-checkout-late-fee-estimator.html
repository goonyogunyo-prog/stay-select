<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レイトチェックアウト料金試算｜STAY SELECT</title><link rel="stylesheet" href="stay-checkout-late-fee-estimator.css"></head><body><main><h1>レイトチェックアウト料金試算</h1><p>ホテルが提示した延長料金を入力して総額を比較できます。実際の可否・料金は施設へ確認してください。</p><label>通常チェックアウト <input id="normal" type="time" value="10:00"></label><label>希望チェックアウト <input id="late" type="time" value="12:00"></label><label>30分あたり延長料金（円・1室） <input id="rate" type="number" min="0" value="1000"></label><label>部屋数 <input id="rooms" type="number" min="1" value="1"></label><label>宿泊基本料金（円・全室合計） <input id="base" type="number" min="0" value="20000"></label><button id="calc">計算</button><output id="result" aria-live="polite"></output><button id="copy">結果をコピー</button></main><script src="stay-checkout-late-fee-estimator.js"></script></body></html>
