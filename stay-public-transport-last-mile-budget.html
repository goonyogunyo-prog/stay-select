<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿までの最終移動費比較 | STAY SELECT</title><link rel="stylesheet" href="stay-public-transport-last-mile-budget.css"></head><body><main><h1>宿までの最終移動費比較</h1><p>駅・空港から宿までの移動手段を、人数と往復を含めて比較します。料金は各交通機関・宿の公式情報で確認してください。</p><div class="grid"><label>人数<input id="people" type="number" min="1" max="100" value="2"></label><label>片道／往復<select id="trips"><option value="1">片道</option><option value="2" selected>往復</option></select></label><label>公共交通 1人片道（円）<input id="transit" type="number" min="0" value="600"></label><label>タクシー 1台片道（円）<input id="taxi" type="number" min="0" value="2800"></label><label>タクシー 1台定員（人）<input id="capacity" type="number" min="1" value="4"></label><label>宿送迎 1人片道（円）<input id="shuttle" type="number" min="0" value="0"></label></div><button id="calc">比較する</button><button id="copy">結果をコピー</button><output id="result" aria-live="polite"></output><small>送迎の運行・定員・予約条件、交通運賃、タクシー料金は必ず事前確認。入力内容は送信しません。</small></main><script src="stay-public-transport-last-mile-budget.js"></script></body></html>
