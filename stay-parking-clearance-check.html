<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>駐車場の高さ・幅・長さ確認｜STAY SELECT</title><link rel="stylesheet" href="stay-parking-clearance-check.css"><main><h1>宿泊先の駐車場・車両寸法チェック</h1><p>2施設の駐車場の制限値と車両寸法を比較する参考計算です。現地の通路・傾斜・旋回・車止め・車両装備品・管理規則は判定できません。必ず施設に確認してください。</p><form id="form"><fieldset><legend>車両寸法（cm）</legend><label>高さ<input id="vh" type="number" min="1" max="1000" value="190" required></label><label>幅<input id="vw" type="number" min="1" max="1000" value="185" required></label><label>長さ<input id="vl" type="number" min="1" max="2000" value="480" required></label><label>安全余裕（各寸法cm）<input id="margin" type="number" min="0" max="100" value="10" required></label></fieldset><div id="sites"></div><button>比較する</button><button type="button" id="csv">CSV保存</button></form><div id="result" aria-live="polite"></div><p class="note">予約・送信・外部通信なし。ブラウザ内だけで計算します。未確認の制限値は適合と判定しません。</p></main><script src="stay-parking-clearance-check.js"></script></html>
