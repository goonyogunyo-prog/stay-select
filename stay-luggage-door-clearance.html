<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スーツケースと宿の出入口幅チェック｜STAY SELECT</title><meta name="description" content="宿泊施設のドア・廊下とスーツケースの幅を手入力で2案比較する簡易チェック。"><link rel="stylesheet" href="stay-luggage-door-clearance.css"></head><body><main><p><a href="index.html">STAY SELECT ホーム</a></p><h1>スーツケースと宿の出入口幅チェック</h1><p>宿や貸別荘の玄関・廊下で、大型スーツケースが通りそうかを事前に比較する目安ツールです。<strong>有効開口幅</strong>（ドアを開けたとき実際に使える幅）を入力してください。</p><form id="clearanceForm"><div class="cols"><fieldset><legend>候補A</legend><label>有効開口幅（cm）<input type="number" name="doorA" min="1" max="500" step="0.1" value="70" required></label><label>荷物の幅（cm）<input type="number" name="widthA" min="1" max="300" step="0.1" value="48" required></label><label>荷物の厚さ（cm）<input type="number" name="depthA" min="1" max="300" step="0.1" value="30" required></label></fieldset><fieldset><legend>候補B</legend><label>有効開口幅（cm）<input type="number" name="doorB" min="1" max="500" step="0.1" value="55" required></label><label>荷物の幅（cm）<input type="number" name="widthB" min="1" max="300" step="0.1" value="48" required></label><label>荷物の厚さ（cm）<input type="number" name="depthB" min="1" max="300" step="0.1" value="30" required></label></fieldset></div><label>必要な左右合計の余裕（cm）<input type="number" name="margin" min="0" max="100" step="0.1" value="8" required></label><button type="submit">比較する</button><button type="button" id="downloadCsv" disabled>CSV保存</button></form><p id="error" role="alert"></p><pre id="result" aria-live="polite"></pre><p class="notice">荷物を縦に持つ・横向きにする2方向の寸法のみを比較します。ドアノブ、段差、曲がり角、階段、荷物の持ち手、実際の運搬姿勢などは計算に含みません。通過・搬入の安全性は保証できません。事前に施設へご確認ください。入力内容は端末内で処理し、外部送信・予約は行いません。</p></main><script src="stay-luggage-door-clearance.js"></script></body></html>
