<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国10,692施設から宿を選び、航空便欠航・遅延時の宿泊延長確認事項と連絡文を整理。情報は利用者が入力します。"><title>航空便欠航・宿泊延長連絡メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-flight-disruption-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>航空便欠航・宿泊延長連絡メモ</h1><p>飛行機の欠航・遅延時に、宿への連絡事項と代替案を整理する</p></header><main><section class="panel"><h2>1. 宿を選ぶ（最大4施設）</h2><label for="search">全国10,692施設から検索</label><input id="search" placeholder="宿名・都道府県" autocomplete="off"><div id="results"></div><p id="notice" role="status"></p><ul id="chosen"></ul></section><section class="panel"><h2>2. 便と滞在の状況（手動入力）</h2><div class="fields"><label>便名（任意）<input id="flight" maxlength="40" placeholder="例：XX123"></label><label>出発予定日<input id="date" type="date"></label><label>運航状況（自分で確認）<select id="status"><option value="未確認">未確認</option><option value="遅延">遅延</option><option value="欠航">欠航</option><option value="運航予定">運航予定</option></select></label><label>追加宿泊希望（泊）<input id="nights" type="number" min="0" max="14" value="1"></label><label>宿への確認状況<select id="hotelStatus"><option>未連絡</option><option>問い合わせ中</option><option>延長可と回答あり</option><option>延長不可と回答あり</option></select></label><label>代替交通の検討<select id="alternate"><option>未検討</option><option>別便を検討</option><option>鉄道・船・バスを検討</option><option>移動を翌日以降へ</option></select></label><label>延長費用見積（円・任意）<input id="cost" type="number" min="0" max="10000000" placeholder="未確認なら空欄"></label></div><label>宿へ伝えたいこと（任意）<textarea id="memo" rows="3" maxlength="300" placeholder="例：追加宿泊可能か、荷物預かり可否、キャンセル規定を確認したい"></textarea></label><p class="hint">航空会社・交通機関・宿の実際の状況を自動取得しません。料金・延泊可否・補償条件は必ず各窓口で確認してください。予約番号・氏名などの個人情報は入力しないでください。</p><button id="generate">宿への問い合わせ文を作成</button><label>送信用文面（送信はしません）<textarea id="output" rows="9" aria-label="宿への問い合わせ文"></textarea></label><button id="copy">文面をコピー</button></section><section class="panel"><h2>3. 保存・出力</h2><button id="save">端末に保存</button><button id="exportJson">JSON出力</button><button id="exportCsv">CSV出力</button><button id="clear">メモを消去</button><label>JSON復元<input id="import" type="file" accept=".json,application/json"></label><p class="hint">localStorageに保存します。データは宿や航空会社へ自動送信されません。ブラウザの保存機能・通信環境によっては利用できない場合があります。</p></section></main><script src="assets/stay-flight-disruption-planner.js" defer></script></body></html>
