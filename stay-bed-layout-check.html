<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国の宿から最大4施設を選び、ベッド・布団・添い寝・寝具追加料金などの確認内容を比較できる手入力メモ。"><title>寝具・ベッド配置の確認｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-bed-layout-check.css"><script src="assets/stay-bed-layout-check.js" defer></script></head><body><header><a href="index.html">← STAY SELECT</a><h1>寝具・ベッド配置の確認メモ</h1><p>部屋の人数と寝具の条件を最大4施設で比較</p></header><main><p class="notice">宿のベッド数・寝具・添い寝条件・追加料金は自動取得しません。すべて利用者の手入力による確認メモです。実際の寝具・安全条件は宿に直接確認してください。氏名・予約番号・健康情報は入力しないでください。</p><section><h2>宿を検索する</h2><p>読み込み：<strong id="count">読み込み中</strong></p><label>宿名・県名<input id="query" type="search" placeholder="宿名・都道府県で検索"></label><div id="results" aria-live="polite"></div></section><section><h2>比較・確認メモ（最大4宿）</h2><div id="chosen"></div></section><section><h2>保存・持ち出し</h2><button id="exportCsv" type="button">CSV出力</button> <button id="exportJson" type="button">JSON出力</button><label>JSONを復元<input type="file" id="importJson" accept="application/json,.json"></label><button id="clear" type="button">全メモ削除</button><p id="status" role="status"></p></section><p><a href="new-arrivals.html">新着38施設へ</a></p></main></body></html>
