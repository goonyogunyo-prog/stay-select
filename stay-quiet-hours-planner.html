<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊の静粛時間・騒音配慮プランナー｜STAY SELECT</title><meta name="description" content="コテージやグループ宿泊で静粛時間と近隣配慮のルールを整理。施設の公式ルールではなく利用者メモです。"><link rel="stylesheet" href="assets/stay-quiet-hours-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>🌙 静粛時間・騒音配慮プランナー</h1><p>夜間の会話・音楽・屋外利用のルールを旅行前に共有</p></header><main><section class="panel"><h2>1. 宿泊施設を選ぶ</h2><label for="query">施設名で検索（全5,155施設）</label><input id="query" type="search" placeholder="宿泊施設名を入力"><div id="search-results" role="listbox" aria-label="検索結果"></div><p id="selected">未選択</p></section><section class="panel"><h2>2. 静粛時間の確認メモ</h2><p class="notice">ここに入力する時間・ルールは利用者の仮メモです。宿の規約や自治体条例を自動取得しません。</p><div class="two"><label>静かにする開始時刻<input type="time" id="start" value="22:00"></label><label>終了時刻<input type="time" id="end" value="07:00"></label></div><label>宿へ確認した内容・連絡先<textarea id="rules" rows="3" placeholder="例：屋外BBQは21時まで（要確認）"></textarea></label><label>グループ内の共有事項<textarea id="groupnote" rows="3" placeholder="例：夜間は窓を閉めて会話する"></textarea></label><h3>8項目の確認チェック</h3><div id="checks"></div></section><section class="panel"><h2>3. 確認状況</h2><p id="summary" aria-live="polite"></p><div class="actions"><button id="save">ブラウザに保存</button><button id="csv">CSV出力</button><button id="json">JSON出力</button><label class="file">JSON復元<input type="file" id="import" accept=".json,application/json"></label><button id="reset" type="button">入力を初期化</button></div><p id="message" role="status"></p></section><p class="notice">実際の静粛時間、花火・焚き火・BBQ・音響機器の可否は宿の公式規約・管理者へ確認してください。夜間の近隣迷惑防止のための整理ツールです。</p></main><script src="assets/stay-quiet-hours-planner.js" defer></script></body></html>
