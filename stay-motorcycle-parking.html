<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ツーリング旅行で宿のバイク駐車・屋根・施錠・充電・料金を確認し、施設ごとに記録する利用者用チェック表。"><title>バイク駐車・保管条件の確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-motorcycle-parking.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>バイク駐車・保管条件の確認メモ</h1><p>ツーリング旅行で、駐輪場所・雨よけ・防犯・充電可否を宿に確認して記録。</p></header><main><section class="panel"><h2>全国の宿を検索</h2><p>対象施設：<strong id="count">読み込み中</strong>件</p><div class="grid"><label>施設名<input type="search" id="query" placeholder="施設名・県名を入力"></label><label>都道府県<select id="pref"><option value="">全国</option></select></label></div><div id="results" aria-live="polite"></div></section><section class="panel"><h2>宿ごとの確認メモ <span id="total">0</span>件</h2><p class="notice">以下はすべて利用者の手入力・確認内容です。駐車・充電設備の有無を自動判定しません。料金や許可条件は宿に直接確認してください。ナンバープレート・予約番号・個人情報・鍵番号は記録しないでください。電源使用は宿の許可が必要です。</p><div class="buttons"><button id="csv">CSV出力</button><button id="json">JSON保存</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="danger">全件削除</button></div><p id="status" role="status" aria-live="polite"></p><div id="records"></div></section><p><a href="new-arrivals.html">新着38施設</a> ／ <a href="index.html">トップページ</a></p></main><script src="assets/stay-motorcycle-parking.js" defer></script></body></html>
