<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旅行中のフェリー券・入場券・整理券の利用予定、期限、担当者を整理。ローカル保存とCSV・JSONに対応。"><title>旅のチケット・整理券管理｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ticket-pass-wallet.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>旅のチケット・整理券管理</h1><p>フェリー・施設入場・駐車券などの使い忘れを防ぐ、旅行前の確認ノート</p></header><main><section class="panel"><h2>宿泊先を選択</h2><label>施設名・都道府県で検索 <input id="staySearch" type="search" placeholder="例：宮崎県・温泉・宿名"></label><select id="staySelect" aria-label="宿泊先"><option value="">宿泊先を選択してください</option></select><p id="stayCount" role="status">宿泊先データを読み込み中…</p><p class="hint">チケットの予約・発券・使用可否は確認しません。券面・運航会社・施設の公式情報を必ず確認してください。予約番号やQRコードなど機密情報は入力しないでください。</p></section><section class="panel"><h2>チケット・整理券を登録</h2><div class="form"><label>名称 <input id="ticket" maxlength="90" placeholder="例：往路フェリー乗船券"></label><label>種類 <select id="kind"><option>交通券</option><option>施設入場券</option><option>駐車券</option><option>整理券</option><option>クーポン</option><option>その他</option></select></label><label>担当者（任意）<input id="holder" maxlength="45" placeholder="例：同行者A"></label><label>使用期限・集合時刻（任意）<input id="deadline" type="datetime-local"></label><label>枚数 <input id="qty" type="number" min="1" max="100" value="1"></label><label>合計金額（円・任意）<input id="cost" type="number" min="0" max="10000000" value="0"></label><label>状態 <select id="state"><option value="未使用">未使用</option><option value="使用済">使用済</option><option value="要確認">要確認</option><option value="取消">取消</option></select></label><label>メモ（任意）<input id="memo" maxlength="140" placeholder="例：受付場所は要確認"></label></div><button id="add">登録する</button><p id="message" role="status"></p></section><section class="panel"><h2>一覧と期限チェック</h2><p id="summary"></p><div class="actions"><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="import">JSON復元<input id="restore" type="file" accept=".json,application/json"></label><button id="clear" class="danger">全削除</button></div><div class="tablewrap"><table><thead><tr><th>券種・名称</th><th>担当</th><th>期限</th><th>枚数</th><th>金額</th><th>状態</th><th>確認</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="assets/stay-ticket-pass-wallet.js" defer></script></body></html>
