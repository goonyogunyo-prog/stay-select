<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャンセル期限・無料取消確認メモ | STAY SELECT</title><link rel="stylesheet" href="stay-cancellation-buffer-2026.css"></head><body><main><p>STAY SELECT｜旅行準備ツール</p><h1>キャンセル期限・無料取消確認メモ</h1><p>予約サイトに記載された期限を入力して、締切までの残り時間を確認できます。施設の規約を自動取得するものではありません。</p><label>予約先・施設名<input id="hotel" placeholder="施設名"></label><label>無料取消の締切（現地時刻）<input id="deadline" type="datetime-local"></label><label>現在時刻（同じタイムゾーン）<input id="now" type="datetime-local"></label><label>余裕を持って判断する時間（時間）<input id="buffer" type="number" min="0" max="720" value="24"></label><button id="calc">締切を確認</button><section id="result" role="status" aria-live="polite"></section><button id="copy" type="button">結果をコピー</button><p class="note">注意：取消料・締切・タイムゾーンは予約経路やプランで異なります。入力時刻は必ず同じタイムゾーンに揃え、最終的に予約確認メール・公式規約で確認してください。入力情報は外部送信しません。</p></main><script src="stay-cancellation-buffer-2026.js"></script></body></html>
