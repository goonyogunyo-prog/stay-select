<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿へ送る荷物の容積重量比較｜STAY SELECT</title><meta name="description" content="旅行の事前宅配荷物の寸法・重量・個数から容積重量の目安を端末内で試算。CSV保存。"><link rel="stylesheet" href="stay-parcel-volumetric-weight.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>宿へ送る荷物の容積重量比較</h1><p>旅行前に宿へ荷物を送る場合、荷物の縦・横・高さ・実重量・個数を入力して、容積重量と実重量を比較できます。</p><p class="notice">換算係数5,000は入力例です。実際の宅配便料金・サイズ区分・受付可否・荷物の重量計算方法は運送会社・宿泊施設に確認してください。料金・配送予約は自動取得しません。外部送信なし。</p><p><label>容積重量の換算係数（cm³/kg、仮定値）<input id="divisor" type="number" min="4000" max="10000" value="5000"></label></p><div class="rooms"><section class="room"><h2>荷物タイプ1</h2><div class="fields"><label>荷物名<input id="label1" maxlength="40" value="スーツケース"></label><label>個数<input id="count1" type="number" min="0" max="30" value="1"></label><label>縦（cm）<input id="length1" type="number" min="1" max="300" step="0.1" value="70"></label><label>横（cm）<input id="width1" type="number" min="1" max="300" step="0.1" value="45"></label><label>高さ（cm）<input id="height1" type="number" min="1" max="300" step="0.1" value="28"></label><label>実重量（kg/個）<input id="weight1" type="number" min="0" max="100" step="0.1" value="15"></label></div></section><section class="room"><h2>荷物タイプ2</h2><div class="fields"><label>荷物名<input id="label2" maxlength="40" value="段ボール"></label><label>個数<input id="count2" type="number" min="0" max="30" value="2"></label><label>縦（cm）<input id="length2" type="number" min="1" max="300" step="0.1" value="50"></label><label>横（cm）<input id="width2" type="number" min="1" max="300" step="0.1" value="40"></label><label>高さ（cm）<input id="height2" type="number" min="1" max="300" step="0.1" value="30"></label><label>実重量（kg/個）<input id="weight2" type="number" min="0" max="100" step="0.1" value="8"></label></div></section><section class="room"><h2>荷物タイプ3</h2><div class="fields"><label>荷物名<input id="label3" maxlength="40" value="追加の荷物"></label><label>個数<input id="count3" type="number" min="0" max="30" value="0"></label><label>縦（cm）<input id="length3" type="number" min="1" max="300" step="0.1" value="30"></label><label>横（cm）<input id="width3" type="number" min="1" max="300" step="0.1" value="20"></label><label>高さ（cm）<input id="height3" type="number" min="1" max="300" step="0.1" value="20"></label><label>実重量（kg/個）<input id="weight3" type="number" min="0" max="100" step="0.1" value="3"></label></div></section></div><div class="actions"><button id="calc">重量を比較</button><button id="csv" class="secondary">結果をCSV保存</button></div><p id="status" role="status" aria-live="polite"></p><section id="results" aria-label="計算結果"></section><p>※荷物ごとの比較重量は実重量と容積重量の大きい方を採用した目安です。各社の料金算定・端数処理・三辺合計による制限を保証しません。</p></main><script src="stay-parcel-volumetric-weight.js"></script></body></html>
