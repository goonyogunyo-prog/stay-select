<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="換気可能開始・終了、必要時間、就寝時刻を入力して宿ごとの時間の余裕を比較。自動取得や予約はしません。"><title>換気・就寝前時間チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ventilation-sleep-check.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>換気・就寝前時間チェック</h1><p>窓を開けられる時間帯と就寝前の換気予定が両立するか、最大4宿で比較します。</p></header><main><section class="panel"><h2>宿泊施設を選択</h2><p>全国 <b id="total">—</b> 施設。最大4宿。</p><label for="search">施設名・都道府県で検索</label><input id="search" type="search" placeholder="例：青森県 旅館"><div id="results" class="results"></div></section><section class="panel"><h2>共通の就寝予定</h2><div class="fields"><label>就寝予定時刻<input type="time" id="departure" value="23:30"></label><label>就寝前の準備時間（分）<input type="number" id="prep" min="0" max="180" value="15"></label></div><p class="hint">各宿の窓の開閉可否・換気可能時間・所要時間は公式案内や宿への問い合わせで確認して入力してください。自動取得しません。</p></section><section class="panel"><h2>換気時間の比較</h2><div id="selected" class="cards"></div><div id="summary" role="status" aria-live="polite"></div><div class="actions"><button id="save">ブラウザ保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="filelabel">JSON復元<input type="file" id="import" accept=".json,application/json"></label><button id="reset" class="secondary">すべて消去</button></div><p id="status" role="status" aria-live="polite">読み込み中</p></section></main><footer><a href="index.html">トップへ</a>｜<a href="new-arrivals.html">新着38施設</a><p>本機能は手入力による時刻計算ツールです。宿への問い合わせ・予約・換気設備の保証は行いません。</p></footer><script src="assets/stay-ventilation-sleep-check.js" defer></script></body></html>
