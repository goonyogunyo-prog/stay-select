<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先のプール利用条件・時間・追加料金・準備物を自分で確認して比較する計画ツール"><title>プール利用条件・準備チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-pool-use-planner.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>プール利用条件・準備チェック</h1><p>宿泊先のプール利用ルールを自分で確認して、準備と予定を整理。</p></div></header><main class="wrap"><p class="notice"><strong>プールの有無・営業・料金を自動判定しません。</strong> 必ず宿の最新公式情報で利用条件・安全ルールを確認してください。入力内容は端末のブラウザ内に保存します。</p><section class="panel"><h2>利用条件を登録</h2><form id="entry"><label>宿泊先を検索<input id="stay-search" type="search" placeholder="施設名・都道府県" autocomplete="off" required></label><div id="search-results" class="results" aria-live="polite"></div><p id="selected" class="selected">宿泊先未選択</p><div class="fields"><label>プール名（利用者入力）<input id="pool-name" maxlength="100" placeholder="例：屋内温水プール" required></label><label>利用予定日<input id="visit-date" type="date" required></label><label>利用開始予定<input id="visit-time" type="time" required></label><label>公式確認した開始時刻（任意）<input id="open-time" type="time"></label><label>公式確認した終了時刻（任意）<input id="close-time" type="time"></label><label>追加料金（円・未確認なら空欄）<input id="fee" type="number" min="0" max="1000000" step="1" placeholder="未確認"></label></div><div class="check-grid"><label><input type="checkbox" id="confirmed-open">利用日の営業を公式確認</label><label><input type="checkbox" id="confirmed-reservation">予約要否を公式確認</label><label><input type="checkbox" id="confirmed-age">年齢・身長制限を公式確認</label><label><input type="checkbox" id="confirmed-cap">水泳帽規定を公式確認</label><label><input type="checkbox" id="confirmed-towel">水着・タオル持参を公式確認</label><label><input type="checkbox" id="confirmed-safety">監視員・安全ルールを公式確認</label></div><label>確認元の公式URL（任意）<input id="source-url" type="url" maxlength="500" placeholder="https://..."></label><label>メモ（任意）<textarea id="memo" maxlength="400" rows="2" placeholder="レンタルや利用対象など"></textarea></label><button type="submit">確認メモを保存</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><div class="toolbar"><h2>保存した計画 <span id="count">0</span>/30件</h2><div><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="file-label">JSON復元<input type="file" id="import" accept=".json,application/json"></label></div></div><div class="stats"><span>料金入力済み合計：<span id="total-fee">0</span>円</span><span>公式確認項目：<span id="checks">0</span>件</span></div><p class="muted">営業時間は同一日内で比較。深夜またぎは要確認。料金未入力は集計対象外であり、無料とはみなしません。</p><div id="plans" class="cards" aria-live="polite"></div></section></main><script src="assets/stay-pool-use-planner.js" defer></script></body></html>
