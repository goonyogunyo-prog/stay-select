<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊の忘れ物チェック｜STAY SELECT</title><link rel="stylesheet" href="stay-departure-room-sweep.css"></head><body><main><a href="index.html">STAY SELECT</a><h1>宿泊の忘れ物チェック</h1><p>出発前・チェックアウト前の持ち物確認。入力内容は送信されません。</p><label>旅のメモ <input id="trip" maxlength="120" placeholder="例：温泉旅行"></label><label>確認モード <select id="mode"><option value="departure">出発前</option><option value="checkout">チェックアウト前</option></select></label><section id="items" aria-label="持ち物一覧"></section><form id="addForm"><label>項目を追加 <input id="custom" maxlength="80" required placeholder="例：コンタクトレンズ"></label><button>追加</button></form><p id="status" role="status"></p><button id="csv" type="button">CSV保存</button><button id="reset" type="button">チェックをリセット</button><p class="note">端末内で動作します。保存したCSVに個人情報を記入する際は取り扱いにご注意ください。</p></main><script src="stay-departure-room-sweep.js"></script></body></html>
