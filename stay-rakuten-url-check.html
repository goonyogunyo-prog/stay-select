<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>楽天URL種別チェック｜STAY SELECT</title><link rel="stylesheet" href="stay-rakuten-url-check.css"></head><body><header><a href="index.html">STAY SELECT</a><span>楽天URL種別チェック</span></header><main><h1>楽天リンクを掲載前に分類</h1><p>URLを貼り付けると、楽天検索・個別施設・楽天アフィリエイトなどを端末内で分類します。<strong>リンク先の実在、成果計測、施設一致は検証しません。</strong></p><label for="url">楽天関連URL（1行1件、最大100件）</label><textarea id="url" rows="7" placeholder="https://kw.travel.rakuten.co.jp/keyword/Search.do?f_query=..."></textarea><div class="actions"><button id="check">分類する</button><button id="export">CSV出力</button></div><p id="count" role="status"></p><div class="scroll"><table><thead><tr><th>URL</th><th>分類</th><th>予約CTA</th><th>理由</th></tr></thead><tbody id="results"></tbody></table></div><h2>運用上の注意</h2><p>楽天検索URLは施設予約ページではありません。個別施設URLも施設一致・最新掲載・提携条件の別途確認が必要です。アフィリエイトURLは発行者と計測条件を確認してください。</p><p><a href="new-arrivals.html">今回の新着2施設</a> ｜ <a href="stay-rakuten-verification-queue.html">既存照合キュー</a></p></main><script src="stay-rakuten-url-check.js" defer></script></body></html>
