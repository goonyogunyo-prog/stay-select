<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先2候補の机幅・奥行きとPC・マウス・ノート・余白を比較する端末内試算ツール。"><title>宿泊先の作業机・PC配置比較｜STAY SELECT</title><link rel="stylesheet" href="stay-remote-desk-fit.css"></head><body><header><a href="index.html">STAY SELECT</a><a href="new-arrivals.html">新着施設</a></header><main><h1>リモートワークの机スペース比較</h1><p>2施設の机寸法を、ノートPC・マウス・メモ帳・左右の余白と比較。入力した寸法での平面配置だけを試算します。設備の有無、机の耐荷重、電源、通信品質は保証しません。</p><form id="desk-form"><section><h2>共通の持ち物（cm）</h2><div class="fields"><label>PC幅<input id="pcW" type="number" min="1" max="200" step="0.1" value="32" required></label><label>PC奥行<input id="pcD" type="number" min="1" max="150" step="0.1" value="23" required></label><label>マウス使用幅<input id="mouseW" type="number" min="0" max="100" step="0.1" value="18" required></label><label>メモ帳使用幅<input id="noteW" type="number" min="0" max="100" step="0.1" value="20" required></label><label>左右余白（片側）<input id="marginW" type="number" min="0" max="50" step="0.1" value="5" required></label><label>手前余白<input id="marginD" type="number" min="0" max="50" step="0.1" value="8" required></label></div></section><div class="grid"><section><h2>施設A</h2><label>名称<input id="nameA" maxlength="80" value="施設A"></label><label>机幅（cm）<input id="widthA" type="number" min="1" max="500" step="0.1" value="100" required></label><label>机奥行（cm）<input id="depthA" type="number" min="1" max="300" step="0.1" value="55" required></label></section><section><h2>施設B</h2><label>名称<input id="nameB" maxlength="80" value="施設B"></label><label>机幅（cm）<input id="widthB" type="number" min="1" max="500" step="0.1" value="70" required></label><label>机奥行（cm）<input id="depthB" type="number" min="1" max="300" step="0.1" value="35" required></label></section></div><div class="buttons"><button type="submit">2施設を比較</button><button type="button" id="download" disabled>結果をCSV保存</button></div></form><p id="error" role="alert"></p><div id="result" aria-live="polite"></div><p class="hint">机の寸法は利用者が直接確認して入力してください。実際の配置は配線・機器形状・利き手等で変わります。個人情報を入力しないでください。予約・外部送信は行いません。</p></main><script src="stay-remote-desk-fit.js"></script></body></html>
