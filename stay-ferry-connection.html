<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国5,801宿から島旅・フェリー乗継の確認メモを最大6宿分作成。便・締切・代替手段は手入力。"><link rel="stylesheet" href="assets/stay-ferry-connection.css"><title>島旅・フェリー乗継の確認メモ｜STAY SELECT</title></head><body><header><a href="index.html">← STAY SELECT</a><h1>島旅・フェリー乗継の確認メモ</h1><p>船の乗り遅れや欠航に備えた宿別の計画表</p></header><main><section class="panel"><p>運航時刻・欠航・料金・乗船締切は<strong>公式運航会社や宿に自分で確認</strong>して記録してください。運航情報は自動取得・自動保証しません。</p><label for="search">宿名・都道府県で検索（全5,801件）</label><input id="search" type="search" placeholder="例：昭和荘、鹿児島県"><select id="stay" aria-label="宿泊施設候補"><option value="">読み込み中...</option></select><button id="add" type="button">この宿を追加</button><p id="notice" role="status" aria-live="polite"></p></section><section class="panel"><h2>フェリー・離島アクセス比較（最大6宿）</h2><div id="cards" class="cards"></div><div class="buttons"><button id="csv" type="button">CSVを出力</button><button id="json" type="button">JSONを出力</button><label class="upload">JSONを復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="danger">全件削除</button></div><p class="hint">入力内容はこの端末のブラウザに保存されます。公開情報ではない個人情報は入力しないでください。予約・運航照会・実際の乗継保証は行いません。</p></section></main><script src="assets/stay-ferry-connection.js" defer></script></body></html>
