<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先から朝市に立ち寄りチェックアウトまでに戻れるかを、入力した時刻と移動・買い物時間から計算。最大4宿比較、CSV/JSON保存。"><title>朝市・チェックアウト前の立寄り計画｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-morning-market-window.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>朝市・チェックアウト前の立寄り計画</h1><p>宿から朝市に出かけ、チェックアウトまでに戻る余裕を比較</p></header><main><p class="notice">朝市の開催日・開店時刻・宿のチェックアウト期限・移動時間は自動取得しません。すべて利用者が公式情報等で確認して入力するメモです。道路状況や営業時間、天候は必ず再確認してください。予約・問い合わせは自動送信しません。</p><section class="panel"><h2>候補を追加（最大4件）</h2><div class="fields"><label>宿泊施設名（検索）<input id="stay-query" type="search" placeholder="宿名の一部を入力" autocomplete="off"></label><label>候補<select id="stay-select"><option value="">先に宿名を検索</option></select></label><label>朝市名<input id="market-name" placeholder="例：温泉街の朝市" maxlength="100"></label><label>朝市開始時刻<input id="market-open" type="time" value="07:00"></label><label>宿のチェックアウト期限<input id="checkout" type="time" value="10:00"></label><label>片道移動（分）<input id="travel" type="number" min="0" max="360" value="20"></label><label>朝市滞在（分）<input id="shopping" type="number" min="0" max="360" value="45"></label><label>余裕として確保（分）<input id="reserve" type="number" min="0" max="180" value="15"></label><label>公式確認元URL（任意）<input id="source" type="url" placeholder="https://..." maxlength="500"></label></div><button id="add" type="button">比較に追加</button><p id="feedback" role="status" aria-live="polite"></p></section><section class="panel"><h2>朝市とチェックアウトの余裕</h2><p id="summary">まだ比較対象がありません。</p><div id="cards" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを書き出す</button><button id="json" type="button">JSONを書き出す</button><label class="file">JSONを復元<input id="restore" type="file" accept="application/json,.json"></label><button id="clear" type="button">全件削除</button></div></section><p><a href="new-arrivals.html">新着38施設</a> ／ <a href="index.html">トップに戻る</a></p></main><script src="assets/stay-morning-market-window.js" defer></script></body></html>
