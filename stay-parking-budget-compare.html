<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>駐車料金・宿泊費比較 | STAY SELECT</title><link rel="stylesheet" href="stay-parking-budget-compare.css"><main><h1>宿泊先の駐車料金込み総額比較</h1><p>宿泊料金と駐車場の料金・泊数を入力し、2施設の予算を比較。実際の料金・駐車可否は施設へ確認してください。</p><div class="grid"><section><h2>施設A</h2><label>宿泊料金（円）<input id="aStay" type="number" min="0" value="15000"></label><label>駐車料金（円/泊）<input id="aPark" type="number" min="0" value="1000"></label></section><section><h2>施設B</h2><label>宿泊料金（円）<input id="bStay" type="number" min="0" value="14000"></label><label>駐車料金（円/泊）<input id="bPark" type="number" min="0" value="1800"></label></section></div><label>駐車泊数<input id="nights" type="number" min="0" max="365" value="2"></label><button id="calc">比較する</button><button id="csv">結果をCSV保存</button><output id="result" aria-live="polite"></output><p class="note">駐車場の最大料金、入出庫回数、税・サービス料、連泊割引等は含みません。</p></main><script src="stay-parking-budget-compare.js"></script></html>
