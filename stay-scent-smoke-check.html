<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国6,675宿から最大6宿を選び、香料・たばこ煙・客室消臭対応など14項目を確認する比較メモ。"><title>香り・煙・消臭対応の確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-scent-smoke-check.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>香り・煙・消臭対応を宿ごとに確認</h1><p>香料やたばこのにおいが気になるとき、予約前に確認する項目を宿ごとに記録できます。</p></header><main><section class="notice"><strong>施設の対応状況を自動判定する機能ではありません。</strong> すべて利用者の確認・入力メモです。宿独自公式サイトや宿へ最新条件をご確認ください。未照合施設には予約CTAを表示しません。氏名・予約番号・健康情報などの個人情報は入力しないでください。入力はブラウザ内に保存されます。</section><section class="panel"><h2>施設検索</h2><label for="query">宿泊施設名</label><input id="query" type="search" placeholder="施設名で検索"><label for="pref">都道府県</label><select id="pref"><option value="">すべて</option></select><p id="status" aria-live="polite">読み込み中…</p><div id="results" class="cards"></div></section><section class="panel"><h2>比較メモ <span id="selectedCount">0/6</span></h2><p>最大6宿。CSV/JSON出力・JSON復元が可能です。共有端末では保存に注意してください。</p><div id="selected" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを保存</button><button id="json" type="button">JSONを保存</button><label class="upload">JSONを復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">すべて消去</button></div></section></main><script defer src="assets/stay-scent-smoke-check.js"></script></body></html>
