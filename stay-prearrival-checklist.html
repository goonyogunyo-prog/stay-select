<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊先への事前確認メール作成｜STAY SELECT</title><link rel="stylesheet" href="stay-prearrival-checklist.css"></head><body><main><h1>宿泊先への事前確認メール作成</h1><p>施設へ事前に確認したい項目を選び、問い合わせ文を作成できます。施設情報や回答を自動取得しません。</p><label>施設名<input id="hotel" maxlength="120" placeholder="宿泊施設名"></label><label>宿泊予定日<input id="date" type="date"></label><label>予約名（任意）<input id="guest" maxlength="100"></label><fieldset><legend>確認したいこと</legend><label><input type="checkbox" value="チェックイン最終受付時刻">チェックイン最終受付時刻</label><label><input type="checkbox" value="駐車場の予約要否・料金">駐車場の予約要否・料金</label><label><input type="checkbox" value="アレルギー対応の可否">アレルギー対応の可否</label><label><input type="checkbox" value="送迎サービスの有無と予約方法">送迎サービスの有無と予約方法</label><label><input type="checkbox" value="客室設備とバリアフリー対応">客室設備とバリアフリー対応</label><label><input type="checkbox" value="荷物の事前預かり">荷物の事前預かり</label></fieldset><label>その他の確認事項<textarea id="extra" maxlength="800" rows="3"></textarea></label><button id="build">問い合わせ文を作成</button><button id="copy" type="button">文章をコピー</button><label>作成結果<textarea id="result" rows="12" readonly></textarea></label><p id="status" role="status"></p><small>予約・変更・キャンセルを実行する機能ではありません。個人情報を外部送信・保存しません。</small></main><script src="stay-prearrival-checklist.js"></script></body></html>
