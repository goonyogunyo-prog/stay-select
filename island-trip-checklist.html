<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="父島・母島・南大東島・渡嘉敷島・与那国島の宿38施設の予約・交通・送迎・欠航対応を端末内でチェック。CSV・JSON出力対応。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/stay-select/island-trip-checklist.html"><title>離島宿・移動の予約前チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/island-trip-checklist.css"></head><body><header><a href="./">STAY SELECT</a><a href="new-arrivals.html">新着38宿</a><a href="stays/">全国の宿</a></header><main><p class="eyebrow">ISLAND TRAVEL PLANNER · 2026.10.20</p><h1>離島旅の「確認漏れ」をなくす。</h1><p class="lead">宿・船や飛行機・送迎・食事・現金・荷物・欠航時の連絡。5島の新着38宿ごとにチェック状況を記録できます。<strong>チェックは利用者が自分で確認した結果</strong>であり、サイトが運行・予約を保証するものではありません。</p><div class="notice"><strong>データの出典を区別：</strong>宿独自公式本文を直接取得した3施設と、観光協会の宿泊掲載のみの35施設を明記。料金・空室・交通便の運行状況は自動取得しません。記録はこのブラウザ内だけに保存されます。</div><section class="panel"><div class="stats"><span>全施設 <b id="total">38</b></span><span>何か確認済 <b id="started">0</b></span><span>全7項目完了 <b id="done">0</b></span></div><div class="filters"><label>宿名で検索<input id="q" type="search" placeholder="宿名・都道府県・島"></label><label>島<select id="area"><option value="">全5島</option><option>父島</option><option>母島</option><option>南大東島</option><option>渡嘉敷島</option><option>与那国島</option></select></label><label>進捗<select id="progress"><option value="">すべて</option><option value="todo">未着手</option><option value="partial">確認途中</option><option value="complete">7項目完了</option></select></label></div><div class="actions"><button id="export-csv">進捗CSVを保存</button><button id="export-json" class="secondary">JSONバックアップ</button><label><span>JSONを復元</span> <input id="import-json" type="file" accept="application/json,.json"></label></div><p id="status" role="status" aria-live="polite"></p></section><p id="result-count" aria-live="polite">38件</p><section class="grid" id="list"></section></main><script src="assets/island-trip-checklist.js" defer></script></body></html>
