<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊税・入湯税込み予算計算｜STAY SELECT</title><link rel="stylesheet" href="stay-tax-budget.css"></head><body><main><h1>宿泊税・入湯税込み予算計算</h1><p>料金表で確認した税額を入力して、旅行全体の概算を計算します。税率や免除条件は自治体・施設により異なります。</p><label>1人1泊の宿泊基本料金（円）<input id="price" type="number" min="0" value="12000"></label><label>人数<input id="people" type="number" min="1" max="1000" value="2"></label><label>泊数<input id="nights" type="number" min="1" max="365" value="2"></label><label>1人1泊の宿泊税（円）<input id="tax" type="number" min="0" value="0"></label><label>1人1泊の入湯税（円）<input id="bath" type="number" min="0" value="150"></label><label>滞在全体の追加料金（円）<input id="extra" type="number" min="0" value="0"></label><button id="calc">計算する</button><button id="copy">結果をコピー</button><output id="result" aria-live="polite"></output><p class="note">税額は自動判定しません。宿泊税が室料区分で変わる場合や免税対象者がいる場合は、実際の料金表で確認してください。入力内容は送信・保存しません。</p></main><script src="stay-tax-budget.js"></script></body></html>
