<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊SEOトピッククラスター｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-seo-topic-cluster-studio.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿泊SEOトピッククラスター</h1><p>検索意図ごとに宿泊施設をまとめて比較記事を企画する。<strong id="count">読込中</strong></p></header><main><section><h2>記事企画</h2><label>検索テーマ<input id="keyword" maxlength="120" placeholder="例：祖谷 民宿 比較"></label><label>検索意図<select id="intent"><option>比較・検討</option><option>家族旅行</option><option>記念日</option><option>温泉旅行</option><option>グループ旅行</option></select></label><label>宿を検索<input id="search" type="search" placeholder="施設名・都道府県"></label><div id="results"></div><p id="chosen">選択：0/8</p><label>編集メモ<textarea id="notes" rows="3" maxlength="800" placeholder="公式で確認すべき料金・設備、記事の比較観点など"></textarea></label><label>進捗<select id="progress"><option>企画中</option><option>出典確認中</option><option>下書き中</option><option>公開前確認</option><option>公開済み（自己申告）</option></select></label><button id="save">保存</button><p id="message" role="status"></p></section><section><h2>保存した記事群</h2><p>最大200件端末保存。料金・設備の断定、予約CTAや成果URLの自動生成は行いません。</p><div id="saved"></div><button id="csv">CSV出力</button><button id="json">JSON出力</button><label>JSON復元<input id="import" type="file" accept=".json,application/json"></label></section></main><script src="assets/stay-seo-topic-cluster-studio.js" defer></script></body></html>
