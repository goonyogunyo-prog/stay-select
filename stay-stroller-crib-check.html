<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ベビーカー・ベビーベッド貸出条件メモ｜STAY SELECT</title><meta name="description" content="宿泊先のベビーカー・ベビーベッド貸出可否や料金、予約期限を利用者自身で確認・記録するメモ。"><link rel="stylesheet" href="assets/stay-stroller-crib-check.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>ベビーカー・ベビーベッド貸出条件メモ</h1><p>子連れ旅行で事前確認した貸出条件を宿ごとに記録・比較できます。</p></header><main><section class="panel"><p class="warning"><strong>重要：</strong>宿の設備・貸出可否・衛生状態・安全基準・料金は自動取得していません。予約前に宿へ直接確認し、製品の対象年齢・体重・安全上の注意を守ってください。これは予約・安全認証機能ではありません。</p><label>施設検索<input id="search" autocomplete="off" placeholder="宿名または都道府県で検索"></label><div id="results" role="listbox" aria-label="施設検索結果"></div><p id="selected" class="muted">施設を選択してください。</p><div class="fields"><label>備品の種類<select id="equipment"><option>ベビーカー</option><option>ベビーベッド</option><option>ベッドガード</option><option>ベビーチェア</option><option>その他</option></select></label><label>貸出可否（利用者確認）<select id="availability"><option>未確認</option><option>利用可能と回答</option><option>貸出不可と回答</option><option>在庫確認待ち</option></select></label><label>確認日<input id="checkedAt" type="date"></label><label>予約・申込期限<input id="deadline" type="date"></label><label>確認した料金（円）<input id="fee" type="number" min="0" max="1000000" step="1" placeholder="未確認なら空欄"></label><label>対象年齢・体重の条件<input id="ageRule" maxlength="160" placeholder="例：対象月齢と体重を宿に確認"></label><label>受取・返却場所<input id="pickup" maxlength="160" placeholder="例：フロント"></label><label>確認先・メモ<input id="memo" maxlength="300" placeholder="例：公式サイト・電話確認の日時"></label></div><div class="buttons"><button id="add">記録を追加</button><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSONバックアップ</button><label class="file-label">JSON復元<input id="restore" type="file" accept=".json,application/json" hidden></label></div><p id="message" role="status" class="muted"></p></section><section class="panel"><h2>記録一覧 <span id="count"></span></h2><div id="entries"></div><p class="muted">この端末のブラウザ内に保存します。共用端末に氏名・連絡先などの個人情報を入力しないでください。外部送信は行いません。</p></section></main><script defer src="assets/stay-stroller-crib-check.js"></script></body></html>
