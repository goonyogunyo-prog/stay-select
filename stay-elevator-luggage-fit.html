<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿のエレベーターの扉幅・かご内寸と荷物カートの幅・奥行きを2施設比較。端末内試算とCSV保存。"><title>エレベーターと荷物カートの寸法比較｜STAY SELECT</title><link rel="stylesheet" href="stay-elevator-luggage-fit.css"></head><body><header><a href="index.html">STAY SELECT</a>　<a href="new-arrivals.html">新着施設</a></header><main><h1>エレベーターと荷物カートの寸法比較</h1><p>スーツケース用カートなどの幅・奥行きと、2施設のエレベーターの扉有効幅・かご内寸を比較します。入力値は各施設への確認結果で置き換えてください。</p><div class="grid"><section><h2>共通の荷物条件</h2><label>荷物・カート幅（cm）<input id="itemW" type="number" min="1" max="400" step="0.1" value="65"></label><label>荷物・カート奥行き（cm）<input id="itemD" type="number" min="1" max="400" step="0.1" value="85"></label><label>各辺に必要な余裕（cm）<input id="gap" type="number" min="0" max="50" step="0.1" value="5"></label></section><section><h2>施設A</h2><label>施設名<input id="nameA" value="施設A"></label><label>エレベーター扉有効幅（cm）<input id="doorA" type="number" min="1" max="500" value="90"></label><label>かご内幅（cm）<input id="cabinWA" type="number" min="1" max="600" value="120"></label><label>かご内奥行き（cm）<input id="cabinDA" type="number" min="1" max="600" value="120"></label></section><section><h2>施設B</h2><label>施設名<input id="nameB" value="施設B"></label><label>エレベーター扉有効幅（cm）<input id="doorB" type="number" min="1" max="500" value="70"></label><label>かご内幅（cm）<input id="cabinWB" type="number" min="1" max="600" value="110"></label><label>かご内奥行き（cm）<input id="cabinDB" type="number" min="1" max="600" value="100"></label></section></div><div class="actions"><button type="button" id="calculate">2施設を比較</button><button type="button" id="download">結果をCSV保存</button></div><div id="result" role="status" aria-live="polite"></div><p class="note">判定は正面・90度回転の矩形近似のみです。乗員のスペース、斜め搬入、扉の高さ、手すり、段差、荷重制限、動線を考慮しません。実際の搬入・安全性・バリアフリー適合を保証しません。予約・外部送信はありません。</p></main><script src="stay-elevator-luggage-fit.js" defer></script></body></html>
