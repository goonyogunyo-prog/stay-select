<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式宿泊一覧の更新差分・重複確認｜STAY SELECT</title><meta name="description" content="公式観光協会・旅館組合の宿泊施設一覧を手動で旧版・新版比較。施設名の追加・削除・重複候補を端末内で検査しCSVに出力。"><link rel="stylesheet" href="assets/stay-official-listing-diff.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>公式宿泊一覧の更新差分・重複確認</h1><p class="note">公式団体の宿泊一覧を編集者が手動で貼り付け、施設名の追加・削除と既存サイト同名候補を比較する補助ツールです。Webページの自動取得・予約・成果URL発行・サイト公開・GitHub更新はしません。名称一致だけでは施設の実在・営業・独立性を証明できません。</p><section><h2>1. 出典と地域</h2><label for="pref">都道府県（必須）</label><input id="pref" placeholder="例：長崎県"><label for="source">公式掲載URL（任意・HTTPS）</label><input id="source" type="url" placeholder="https://..."><div class="cols"><div><label for="before">旧公式一覧（施設名を1行ずつ）</label><textarea id="before" placeholder="宿A&#10;宿B"></textarea></div><div><label for="after">新公式一覧（施設名を1行ずつ）</label><textarea id="after" placeholder="宿A&#10;宿C"></textarea></div></div><button id="run">差分と既存施設名を検査</button><button id="download">CSV出力</button><p id="status" role="status">施設辞書を読み込み中…</p></section><section><h2>2. 判定結果</h2><p id="summary">未実行</p><div class="scroll"><table><thead><tr><th>施設名</th><th>県</th><th>判定</th><th>既存施設ID</th></tr></thead><tbody id="results"></tbody></table></div><p><small>「新規候補」は未検証。別名、同一施設の別棟・客室、休業、旧掲載、他県同名を公式個別ページや宿独自情報で確認してください。結果は最大600行表示、CSVは全行を出力します。</small></p></section></main><script src="assets/stay-official-listing-diff.js" defer></script></body></html>
