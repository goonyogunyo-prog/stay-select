<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離島旅行の船・フェリーの乗継、最終便、欠航時の代替交通を宿泊候補ごとに手入力で整理。"><title>船・フェリー乗継と欠航時の代替手段メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ferry-connection-plan.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>⛴️ 船・フェリー乗継と欠航時の代替手段メモ</h1><p>全国6,029施設から最大6宿を比較。港から宿までの移動、最終便、受付締切、荒天欠航時の代替案を自分で記録できます。</p></header><main><section class="panel"><h2>宿泊候補を追加</h2><label for="query">施設名・都道府県で検索</label><input id="query" type="search" placeholder="例：伊根 / 鹿児島県" autocomplete="off"><p id="result-count" aria-live="polite"></p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><div class="row"><h2>乗継・欠航時の備え（最大6宿）</h2><span id="saved" role="status" aria-live="polite"></span></div><p class="notice">運航時刻、欠航、船賃、交通手段、宿の対応を自動照合しません。必ず運航会社と宿の公式情報を確認してください。保存先はこのブラウザ内のみです。</p><p class="progress-tip">進捗は「利用港・航路・最終便・欠航時代替」の4欄の記入状況であり、運航保証ではありません。</p><div id="cards" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを書き出す</button><button id="json" type="button">JSONを書き出す</button><label class="upload">JSONを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">全メモを削除</button></div></section><p><a href="new-arrivals.html">新着38施設を見る</a></p></main><script src="assets/stay-ferry-connection-plan.js" defer></script></body></html>
