<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布団敷き・追加寝具の事前確認ボード｜STAY SELECT</title><meta name="description" content="宿の布団敷き時刻・追加寝具の依頼と回答を宿ごとに整理する利用者メモ。"><link rel="stylesheet" href="assets/stay-futon-request-board.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>布団敷き・追加寝具の事前確認ボード</h1><p>旅館や一棟貸しで、布団の枚数・敷き方・追加費用・宿への依頼状況を整理。</p></header><main><section class="panel"><p class="warning"><strong>利用前に確認：</strong>布団敷きサービス、寝具追加の可否・料金・時間は自動判定しません。宿へ直接確認してください。このページから予約・依頼送信はできません。</p><div class="fields"><label>宿泊施設を検索<input id="query" placeholder="施設名または都道府県" autocomplete="off"></label><label>検索結果（最大60件）<select id="stay"><option value="">施設名で検索してください</option></select></label><label>宿泊人数<input id="guests" type="number" min="1" max="100" value="2"></label><label>希望する布団・寝具の総数<input id="total" type="number" min="0" max="100" value="2"></label><label>追加寝具の希望数<input id="extra" type="number" min="0" max="100" value="0"></label><label>追加寝具1組あたりの宿回答料金（円、未確認なら空欄）<input id="fee" type="number" min="0" max="1000000" placeholder="未確認"></label><label>布団敷き希望時刻（任意）<input id="setup" type="time"></label><label>宿からの回答状況<select id="status"><option>未確認</option><option>問い合わせ中</option><option>宿から了承済み</option><option>宿から不可と回答</option></select></label><label class="full">確認日（任意）<input id="checked" type="date"></label><label class="full">宿に確認した内容・注意点（200字以内）<textarea id="memo" rows="2" maxlength="200" placeholder="敷布団の厚さ、セルフ敷き、子供用寝具、追加費用の条件など"></textarea></label></div><div class="actions"><button id="add">確認メモを追加</button><span id="message" role="status" aria-live="polite"></span></div></section><section class="panel"><h2>登録した宿の確認メモ <small id="count">0件</small></h2><div id="summary" class="summary"></div><div id="entries" class="cards"><p>登録はまだありません。</p></div><div class="actions"><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSONバックアップ</button><label class="file-label">JSON復元<input id="import" type="file" accept="application/json,.json" hidden></label></div><p class="muted">最大30件。データはこのブラウザ内に保存します。共有端末では個人情報を入力しないでください。バックアップを取ってからブラウザデータを消去してください。</p></section><p><a href="new-arrivals.html">新着38施設へ</a> ／ <a href="index.html">STAY SELECTトップへ</a></p></main><script src="assets/stay-futon-request-board.js" defer></script></body></html>
