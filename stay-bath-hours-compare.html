<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿の大浴場・男女入替・清掃時間を自分で確認し、入浴希望時間と重ならないか最大4宿で比較。"><title>大浴場の時間・入替チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-bath-hours-compare.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>大浴場の時間・入替チェック</h1><p>入浴可能時間と清掃・男女入替時間を、宿の公式案内などで確認して比較できます。</p></header><main><section class="panel"><h2>施設を探す</h2><p>全国 <b id="total">—</b> 施設から最大4宿を比較できます。</p><label for="search">施設名・都道府県で検索</label><input id="search" type="search" placeholder="例：茨城県 旅館"><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>入浴希望</h2><div class="fields"><label>入浴開始希望時刻<input type="time" id="want" value="20:30"></label><label>入浴したい時間（分）<input type="number" id="duration" value="40" min="1" max="240"></label></div><p class="hint">日をまたぐ浴場では、開始時刻より早い時刻を翌日とみなします。清掃・入替時間が不明な場合は空欄にしてください。空欄を「休止なし」と保証するものではありません。</p></section><section class="panel"><h2>宿ごとの確認メモ</h2><div id="selected" class="cards"></div><div id="summary" role="status" aria-live="polite"></div><div class="actions"><button id="save">ブラウザ保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="filelabel">JSON復元<input type="file" id="import" accept=".json,application/json"></label><button id="reset" class="secondary">すべて消去</button></div><p id="status" role="status" aria-live="polite">読み込み中</p></section></main><footer><a href="index.html">トップへ</a>｜<a href="new-arrivals.html">新着38施設</a><p>このページは手入力の比較ツールです。実際の営業時間、男女別利用条件、貸切予約、設備、営業状況は自動取得しません。予約や問い合わせの送信は行いません。</p></footer><script src="assets/stay-bath-hours-compare.js" defer></script></body></html>
