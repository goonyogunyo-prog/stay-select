<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>公式出典の証拠強度チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-source-evidence-gate.css"><script defer src="assets/stay-source-evidence-gate.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a>　<a href="new-arrivals.html">新着施設</a></nav><p class="eyebrow">EDITOR ONLY / EVIDENCE GATE</p><h1>公式出典の証拠強度チェック</h1><p>宿の「公式掲載」と「観光協会の会員名簿掲載」を区別します。出典を機械的に分類する編集用ツールで、営業・宿泊可能性・料金・空室を保証しません。</p><section class="summary" id="summary" aria-live="polite">読み込み中…</section><section class="panel"><label>施設名・都道府県・掲載元で検索 <input id="query" type="search" placeholder="例：大島観光協会、民宿、東京都"></label><label>証拠分類 <select id="tier"><option value="all">すべて</option><option value="member">会員名簿（追加確認が必要）</option><option value="individual">公式宿泊個別掲載</option><option value="listing">公式宿泊一覧等</option><option value="unknown">出典不足・その他</option></select></label><button id="export" type="button">表示条件のCSVを出力</button></section><p id="status" role="status"></p><div class="tablewrap"><table><thead><tr><th>施設名</th><th>県</th><th>証拠区分</th><th>掲載元</th><th>確認日</th><th>公式出典</th></tr></thead><tbody id="results"></tbody></table></div><p class="small">画面表示は最大200行。CSVは絞込結果を全件出力します。データは端末内で処理され、外部へ送信しません。出典URLは編集者が直接確認してください。</p></main></body></html>
