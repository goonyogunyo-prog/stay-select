<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="途中参加・途中帰宅があるグループ宿泊の費用を、宿泊人数と各人の泊数で按分。CSV保存。"><title>宿泊日数が違うグループの費用按分｜STAY SELECT</title><link rel="stylesheet" href="stay-uneven-nights-cost-split.css"></head><body><main><a href="index.html">← STAY SELECT</a><h1>宿泊日数が違うグループの費用按分</h1><p>同じ宿を利用しても、途中参加・途中帰宅で宿泊日数が異なるときの負担額を計算します。総額を人泊（人数×泊数）で配分し、円単位の端数を調整します。</p><p class="note">宿の請求・子ども料金・税金の取り扱いは実際の予約条件を優先。計算は端末内だけで行い、予約・送信・外部アクセスはしません。</p><section><label>宿泊料金の合計（円）<input id="total" type="number" min="0" step="1" value="78000"></label><label>人数（1〜8人）<input id="people" type="number" min="1" max="8" step="1" value="3"></label><label>共通で宿泊できる最大泊数<input id="maxNights" type="number" min="1" max="365" step="1" value="3"></label><div id="members"></div><button id="calc">費用を按分する</button><button id="csv" disabled>CSVを保存</button><div id="result" role="status" aria-live="polite"></div></section></main><script src="stay-uneven-nights-cost-split.js" defer></script></body></html>
