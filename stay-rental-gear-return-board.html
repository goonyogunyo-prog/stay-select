<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レンタル用品の返却・移動余裕ボード｜STAY SELECT</title><meta name="description" content="宿泊先を選んで、レンタル用品の返却予定・移動・清掃・予備時間を手入力で整理する無料の計画ツール。"><link rel="stylesheet" href="assets/stay-rental-gear-return-board.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>レンタル用品の返却・移動余裕ボード</h1><p>スキー板・自転車・SUP・キャンプ用品などの返却前に、必要な時間を整理。</p></header><main><section class="intro"><p>これは利用者の入力をもとに計算する計画メモです。実際のレンタル条件、返却店舗の営業時間、延滞料、交通状況、洗浄ルールは自動取得しません。予約・空室の保証はありません。</p><p id="load-status" role="status">施設データを読み込み中…</p></section><form id="gear-form"><label>宿泊先を検索<input id="stay-query" type="search" placeholder="宿の名前を入力" autocomplete="off"></label><label>宿泊先<select id="stay-select" required><option value="">施設名で検索してください</option></select></label><label>レンタル用品<select id="gear-type"><option>自転車</option><option>スキー・スノーボード</option><option>SUP・カヤック</option><option>キャンプ用品</option><option>その他</option></select></label><label>返却先（利用者メモ）<input id="provider" maxlength="100" placeholder="例：レンタル店・宿フロント"></label><label>最後の利用終了予定<input id="finish-at" type="datetime-local" required></label><label>返却締切予定<input id="return-at" type="datetime-local" required></label><label>返却先までの移動（分）<input id="travel-min" type="number" min="0" max="1440" value="30" required></label><label>清掃・点検（分）<input id="clean-min" type="number" min="0" max="1440" value="15" required></label><label>予備時間（分）<input id="buffer-min" type="number" min="0" max="1440" value="20" required></label><label>預り金・返金確認（円、任意）<input id="deposit" type="number" min="0" max="10000000" value="0"></label><label class="wide">確認メモ<textarea id="note" maxlength="500" rows="2" placeholder="返却方法、付属品、写真、連絡先など"></textarea></label><button type="submit">返却計画を追加（最大30件）</button></form><section><h2>登録した返却計画 <span id="plan-count">0</span>/30</h2><p id="summary" role="status">未登録</p><div id="plans" class="plans"></div></section><section><h2>データ管理</h2><p>入力内容はこのブラウザのlocalStorageに保存します。共有端末では個人情報を入力しないでください。</p><div class="actions"><button id="export-csv" type="button">CSV出力</button><button id="export-json" type="button">JSONバックアップ</button><label class="file-label">JSON復元<input id="import-json" type="file" accept=".json,application/json"></label><button id="clear-plans" type="button">すべて削除</button></div><p id="message" role="status"></p></section></main><script src="assets/stay-rental-gear-return-board.js" defer></script></body></html>
