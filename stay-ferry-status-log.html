<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="島旅の船便運航状況を宿泊先と紐づけて手動記録。確認日時、運航予定・遅延・欠航などの変更履歴を残す。"><title>島旅・船便運航情報確認ログ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ferry-status-log.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>島旅・船便運航情報確認ログ</h1><p>宿泊先と航路ごとに、公式発表を確認した時刻と運航状況の変化を自分で記録。</p></div></header><main class="wrap"><section class="notice"><strong>自動運航判定ではありません。</strong> このページは運航情報を取得・通知しません。欠航・遅延の判断は必ず船会社や自治体の最新公式情報を確認してください。ここに入力したURLは参考メモで、外部サイトの内容を自動検証しません。</section><section class="panel"><h2>確認ログを追加</h2><form id="entry"><label>宿泊先を検索<input id="stay-search" type="search" placeholder="施設名・都道府県" autocomplete="off" required></label><div id="search-results" class="results" aria-live="polite"></div><p id="selected" class="selected">宿泊先未選択</p><div class="fields"><label>航路・船便名<input id="route" maxlength="100" placeholder="例：那覇泊港→座間味港" required></label><label>公式情報を確認した日時<input id="checked-at" type="datetime-local" required></label><label>確認した運航状態<select id="status"><option value="未確認">未確認</option><option value="運航予定">運航予定</option><option value="遅延">遅延</option><option value="欠航">欠航</option><option value="条件付き運航">条件付き運航</option><option value="運航終了">運航終了</option></select></label><label>確認元の公式URL（任意）<input id="source-url" type="url" placeholder="https://..." maxlength="500"></label></div><label>メモ（任意）<textarea id="memo" rows="2" maxlength="400" placeholder="確認した便、更新予定時刻、問い合わせ先など"></textarea></label><button type="submit">この確認を記録</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><div class="toolbar"><h2>確認履歴 <span id="count">0</span>/100件</h2><div><button type="button" id="csv">CSV出力</button><button type="button" id="json">JSON出力</button><label class="file-label">JSON復元<input type="file" id="import" accept=".json,application/json"></label></div></div><p class="sub">同じ宿泊先・航路の直前記録から状態が変わった場合、「変更あり」と表示します。変更履歴は端末内のブラウザ保存です。</p><div id="logs" class="logs" aria-live="polite"></div></section></main><script src="assets/stay-ferry-status-log.js" defer></script></body></html>
