<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊費の割り勘・精算メモ | STAY SELECT</title><link rel="stylesheet" href="stay-group-expense-allocation.css"><main><h1>宿泊費の割り勘・精算メモ</h1><p>宿泊費と追加費用を合算して人数で均等割り。金額は円単位で端数調整します。予約や決済は行いません。</p><label>宿泊費（円）<input id="stay" type="number" min="0" step="1" value="30000"></label><label>追加費用（円）<input id="extra" type="number" min="0" step="1" value="0"></label><label>人数<input id="people" type="number" min="1" max="100" step="1" value="3"></label><button id="calc">計算する</button><output id="result" aria-live="polite"></output><button id="csv" disabled>CSV保存</button><p class="note">※端数の1円は先頭の人から順に加算。施設の正式な料金・税・キャンセル条件は予約先で確認してください。</p></main><script src="stay-group-expense-allocation.js"></script></html>
