<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="離島の宿泊時に車両航送の予約状況、車両寸法、乗船締切、港への到着時刻を整理する利用者入力メモ。"><title>車両フェリー乗船・受付締切メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ferry-vehicle-check.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>車両フェリー乗船・受付締切メモ</h1><p>離島の宿へ車で向かう前に、車両航送の予約・寸法・港の受付締切を整理。時刻表や運航状況の自動判定はしません。</p></header><main><section class="panel"><h2>宿泊先を探す</h2><label for="search">施設名・都道府県で検索</label><input id="search" autocomplete="off" placeholder="施設名・都道府県"><div id="results" role="status" aria-live="polite"></div><p id="picked">宿が未選択です。</p></section><section class="panel"><h2>利用者が確認した航送情報を記録</h2><div class="fields"><label>乗船日<input id="date" type="date"></label><label>航路・港<input id="route" placeholder="例：○○港 → △△港" maxlength="100"></label><label>フェリー出航予定<input id="depart" type="time" value="10:00"></label><label>車両受付締切<input id="cutoff" type="time" value="09:00"></label><label>港への到着予定<input id="arrival" type="time" value="08:30"></label><label>車両全長（m）<input id="length" type="number" min="1" max="30" step="0.1" value="4.5"></label><label>車両全高（m）<input id="height" type="number" min="0.5" max="8" step="0.1" value="1.8"></label><label>車両航送予約<select id="booking"><option>未確認</option><option>予約済み（利用者入力）</option><option>予約不要と案内あり（要再確認）</option><option>要予約・手続き中</option></select></label><label>運航状況確認<select id="status"><option>未確認</option><option>公式案内を確認済み（利用者入力）</option><option>欠航・変更の案内あり</option></select></label><label>公式運航情報URL<input id="official" type="url" placeholder="https://" maxlength="300"></label><label class="wide">備考・受付場所・車両条件<textarea id="memo" rows="3" maxlength="500"></textarea></label></div><div class="actions"><button id="add">この宿の乗船メモを追加</button><button id="exportCsv" type="button">CSV出力</button><button id="exportJson" type="button">JSON出力</button><label class="import">JSON復元<input id="importJson" type="file" accept="application/json,.json"></label><button id="print" type="button">印刷</button><button id="clear" type="button" class="secondary">全件削除</button></div><p id="notice" role="status" aria-live="polite"></p></section><section class="panel"><h2>比較メモ（最大4宿）</h2><p id="summary"></p><div id="entries"></div></section><p class="disclaimer">このツールは入力値から受付締切と港到着予定の時間差のみを計算します。フェリーの車両積載条件・車両長区分・受付締切・予約・欠航・道路所要時間・宿泊先へのアクセスは、利用者が運航会社の最新公式案内で必ず確認してください。記録はこの端末のブラウザ内に保存され、STAY SELECTのサーバーには送信されません。</p></main><script src="assets/stay-ferry-vehicle-check.js" defer></script></body></html>
