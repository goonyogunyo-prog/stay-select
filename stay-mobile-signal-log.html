<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先で携帯キャリアごとの電波・データ通信・通話状況を自分で確認し、宿ごとに記録するSTAY SELECTのメモ。"><title>宿の携帯電波・通信確認ログ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-mobile-signal-log.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿の携帯電波・通信確認ログ</h1><p>離島・山間部などの宿で、キャリア別の電波状況を確認して記録するメモ。</p></header><main><section class="panel"><h2>宿泊施設を検索</h2><p>検索対象 <strong id="count">読み込み中</strong> 件</p><div class="row"><label>宿名<input id="query" type="search" placeholder="宿泊施設名を入力"></label><label>都道府県<select id="pref"><option value="">すべて</option></select></label></div><div id="results" aria-live="polite"></div></section><section class="panel"><h2>電波・通信状況メモ <span id="total">0</span> 件</h2><p class="notice">宿の電波・通信品質は自動判定しません。キャリアの公式エリアマップ・宿への問い合わせ・現地での実測を利用者が確認し、情報源と確認日を記録してください。携帯番号・位置の詳細・Wi-Fiパスワード・氏名・部屋番号は入力しないでください。緊急通報の可否は保証できません。</p><div class="buttons"><button id="csv">CSV出力</button><button id="json">JSON出力</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="danger">全件削除</button></div><p id="status" role="status"></p><div id="records"></div></section><p><a href="new-arrivals.html">新着38施設を見る</a> ｜ <a href="index.html">トップへ戻る</a></p></main><script src="assets/stay-mobile-signal-log.js" defer></script></body></html>
