<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿の飲料持ち込み・開栓料・グラス・氷の条件を確認する利用者入力メモ。最大6施設を比較。"><title>飲料持ち込み・開栓料・グラスの確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-drink-corkage.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>飲料持ち込み・開栓料・グラスの確認メモ</h1><p>ワインや飲料の持ち込み可否、開栓料、グラス、氷などを宿ごとに整理し最大6施設を比較できます。</p></header><main class="wrap"><p class="notice"><strong>飲料持込・開栓料・備品の有無を自動取得する機能ではありません。</strong>宿や貸出事業者の公式案内を確認してください。氏名・住所・電話番号・本人確認書類番号・予約番号・カード情報は入力しないでください。入力はこの端末のブラウザ内に保存されます。</p><section class="panel"><h2>施設を検索・追加</h2><p id="loaded">施設一覧を読み込み中…</p><label for="query">施設名・都道府県</label><input id="query" class="search" autocomplete="off" placeholder="例：宮津市、静岡県"><p id="result-count" class="muted"></p><div id="results" aria-live="polite"></div></section><section class="panel"><h2>比較・保存 <small id="selection-count">0/6施設</small></h2><div class="toolbar"><button type="button" id="csv">CSV出力</button><button type="button" id="json">JSONバックアップ</button><label class="btn" for="import">JSON復元</label><input id="import" type="file" accept=".json,application/json" aria-label="JSONファイルを読み込む"></div><p id="saved" class="muted" aria-live="polite">入力内容はこの端末に保存されます。機器変更前にはJSONをバックアップしてください。</p></section><div class="cards" id="cards"></div></main><script src="assets/stay-drink-corkage.js" defer></script></body></html>
