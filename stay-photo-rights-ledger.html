<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真利用許諾台帳｜STAY SELECT</title><meta name="description" content="宿泊施設の写真掲載許諾・権利者・根拠URL・有効期限を手動記録。許諾のない写真を公開しないための編集用台帳。"><link rel="stylesheet" href="assets/stay-photo-rights-ledger.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>写真利用許諾台帳</h1><p>宿泊施設の写真をサイトに掲載する前に、権利者と利用許諾を確認する編集用ツールです。<strong>写真の自動取得・転載・公開はしません。</strong>「許諾済」は編集者の入力であり、サイトが許諾を保証するものではありません。</p><div class="panel"><label for="q">施設検索（全11,534施設）</label><input id="q" type="search" placeholder="宿の名前を入力"><select id="stay" aria-label="施設選択"></select><div id="selected" aria-live="polite"></div><label for="photo">掲載したい写真の参照URL（httpsのみ）</label><input id="photo" type="url" placeholder="https://..."><label for="holder">権利者・許諾者</label><input id="holder" placeholder="写真の著作権者など"><label for="status">利用許諾の確認状況</label><select id="status"><option>未確認</option><option>許諾済（手動確認）</option><option>利用不可</option><option>期限切れ</option></select><label for="proof">許諾の根拠URL（httpsのみ）</label><input id="proof" type="url" placeholder="https://..."><label for="expiry">許諾期限（不明なら空欄）</label><input id="expiry" type="date"><label for="memo">用途・注意事項</label><textarea id="memo" rows="3" maxlength="500"></textarea><button id="save" type="button">台帳に保存（最大500件）</button><p id="msg" role="status"></p></div><div class="panel"><h2>保存済みの写真利用記録</h2><p id="summary"></p><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="import">JSON復元<input id="import" type="file" accept="application/json,.json"></label></div><div id="records"></div></div><p class="note">記録はこの端末のブラウザ内に保存されます。別端末と同期されません。許諾済でも期限切れ・利用範囲の違いに注意してください。画像URLを入力しても外部画像は読み込みません。</p></main><script src="assets/stay-photo-rights-ledger.js" defer></script></body></html>
