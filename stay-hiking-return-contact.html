<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山歩き・下山予定の帰着連絡ボード｜STAY SELECT</title><meta name="description" content="宿泊先からの登山・ハイキング帰着予定と連絡先を手動管理。緊急通報や自動通知は行いません。"><link rel="stylesheet" href="assets/stay-hiking-return-contact.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>山歩き・下山予定の帰着連絡ボード</h1><p class="lead">登山・ハイキングの帰着予定と連絡タイミングを整理する、利用者入力のメモです。</p></header><main><p class="notice"><strong>安全上の注意：</strong>この機能はGPS追跡・自動通知・遭難通報を行いません。出発前に家族や同行者へ計画を共有し、地域の登山届・公式気象情報・緊急連絡手段を別途確認してください。携帯電波のない場所では動作を保証しません。</p><section class="panel"><h2>計画を登録</h2><div class="fields"><label class="wide">宿泊先を検索<input id="search" placeholder="宿名または県名" autocomplete="off"><span class="muted" id="selected">未選択</span></label><input id="stay" type="hidden"><div id="results" class="wide" aria-label="宿泊先検索結果"></div><label class="wide">山・ルート名<input id="route" placeholder="例：登山口→山頂→登山口"></label><label>帰着予定日時<input id="returnAt" type="datetime-local"></label><label>帰着後の連絡予定日時<input id="contactAt" type="datetime-local"></label><label>連絡先の名前・連絡手段<input id="contactTo" placeholder="例：同行者・家族"></label><label>連絡方法<select id="contactMethod"><option>電話</option><option>SMS</option><option>メッセージアプリ</option><option>対面</option><option>その他</option></select></label><label class="wide">連絡時に伝えること・備考<textarea id="memo" placeholder="例：到着報告・予定変更時の対応"></textarea></label></div><div class="buttons"><button id="add">計画を登録</button><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSONバックアップ</button><label class="file-label">JSON復元<input id="restore" type="file" accept=".json,application/json" style="display:none"></label></div><p class="muted" id="message" role="status"></p></section><section class="panel"><h2>登録した計画 <small id="count"></small></h2><div id="plans" aria-live="polite"></div><p class="muted">入力内容はこの端末のブラウザ内に保存を試みます。共用端末には個人情報を入力しないでください。外部への送信・自動通知はありません。</p></section></main><script src="assets/stay-hiking-return-contact.js" defer></script></body></html>
