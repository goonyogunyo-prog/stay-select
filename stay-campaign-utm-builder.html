<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Instagram・TikTok投稿の流入元を区別するUTMリンクを作成。予約URLや成果URLは生成しません。"><title>SNS流入計測URL作成｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-campaign-utm-builder.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>SNS流入計測URL作成</h1><p>投稿ごとにSTAY SELECTへの流入元を区別するリンクを作成</p></header><main><section><h2>投稿の設定</h2><div class="fields"><label>媒体<select id="platform"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select></label><label>キャンペーン名<input id="campaign" value="stay_select_autumn_2026" maxlength="70"></label><label>投稿識別子（任意）<input id="content" placeholder="post_01" maxlength="70"></label></div><p>リンク先はSTAY SELECTのトップページです。宿の個別予約URLや成果URLは生成しません。</p><button id="make" type="button">計測URLを作る</button><label for="output">生成したURL</label><textarea id="output" rows="4" readonly></textarea><div class="actions"><button id="copy" type="button">URLをコピー</button><button id="save" type="button">履歴に保存</button></div><p id="status" role="status"></p></section><section><h2>投稿履歴</h2><p>媒体・キャンペーン・投稿ID・URLを端末に保存。クリック数や広告成果は自動計測しません。</p><div id="history" aria-live="polite"></div><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="upload">JSON復元<input id="restore" type="file" accept=".json,application/json"></label><button id="clear" type="button">履歴削除</button></div></section><section><h2>ご利用前の注意</h2><p>URLに個人情報を入力しないでください。流入の実測にはGA4等のアクセス解析設定が必要です。楽天トラベルの個別掲載・予約可否・成果計測はこの機能では検証しません。</p></section></main><script src="assets/stay-campaign-utm-builder.js" defer></script></body></html>
