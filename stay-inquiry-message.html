<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊前に確認したい内容を選んで、日本語の問い合わせ文を作成。宿の設備や営業状況は自動判定しません。"><title>宿への事前確認メッセージ作成｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-inquiry-message.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿への事前確認メッセージ作成</h1><p>予約前に聞き忘れがちな条件を整理して、丁寧な問い合わせ文を作れます。</p></header><main><section class="panel"><h2>宿を探す</h2><p>全国 <b id="total">—</b> 施設を検索できます。最大4施設まで選択できます。</p><label for="search">施設名・都道府県</label><input id="search" type="search" autocomplete="off" placeholder="例：旅館・山梨県"><div id="results" aria-live="polite"></div></section><section class="panel"><h2>問い合わせ内容を選択</h2><p class="hint">選択内容は施設の設備があることを意味しません。各宿に確認するための質問文を作成します。</p><div id="topics" class="topics"></div><label for="travel-date">宿泊予定日（任意）</label><input id="travel-date" type="date"><label for="guests">人数・同行者（任意）</label><input id="guests" placeholder="例：大人2名、子ども1名"><label for="custom">その他の質問（任意）</label><textarea id="custom" rows="3" placeholder="例：駅からの送迎はありますか？"></textarea><div class="toolbar"><button id="make">問い合わせ文を作成</button><button id="copy" type="button">文章をコピー</button><button id="export">JSON保存</button><label class="filelabel" for="import">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="reset" class="secondary">選択を消去</button></div><p id="status" role="status" aria-live="polite">読み込み中</p></section><section class="panel"><h2>作成した文章</h2><label for="output">内容を編集して、宿の公式問い合わせ窓口から送信してください。</label><textarea id="output" rows="16" spellcheck="false"></textarea><p class="hint">本機能はメール送信・予約・料金照会をしません。楽天トラベル未照合施設への予約CTAもありません。連絡先は公式掲載元や宿の公式情報で確認してください。</p></section><section class="panel"><h2>選択した宿</h2><div id="selected" class="selected"></div></section></main><footer><a href="index.html">トップへ戻る</a>｜<a href="new-arrivals.html">新着施設</a></footer><script src="assets/stay-inquiry-message.js" defer></script></body></html>
