<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊グループ旅行の車別座席数・乗車人数・荷物容量・交通費を比較。CSV保存。端末内処理のみ。"><title>グループ旅行の車割り・荷物配分｜STAY SELECT</title><link rel="stylesheet" href="stay-group-car-seats-planner.css"></head><body><main><p class="brand"><a href="index.html">STAY SELECT</a> / 宿泊前の準備</p><h1>グループ旅行の車割り・荷物配分</h1><p>車ごとの定員・乗車人数・荷物の積載枠と荷物個数を入力すると、超過・余裕と交通費の目安を比較できます。車両の安全な積載・法令適合・座席の使用条件は保証しません。</p><div class="panel"><label>旅行全体の人数 <input id="group" type="number" min="1" step="1" value="8"></label><div id="cars" class="cars"></div><div class="actions"><button id="calculate">計算する</button><button id="download" disabled>CSVを保存</button></div><p id="error" role="alert"></p><section id="results" aria-live="polite"></section></div><p class="notice">端末内で計算し、入力内容を外部送信しません。予約・決済は行いません。荷物の大きさやシートベルト、道路交通法、車両ごとの最大積載量は別途確認してください。</p><p><a href="index.html">トップへ戻る</a></p></main><script src="stay-group-car-seats-planner.js"></script></body></html>
