<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>楽天トラベル3列CSV 事前監査｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-rakuten-csv-preflight.css"><script defer src="assets/stay-rakuten-csv-preflight.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a> ／ <a href="new-arrivals.html">新着施設</a></nav><h1>楽天トラベル3列CSV 事前監査</h1><p class="intro">楽天トラベルの「リンク先URL／リンクテキスト／商品画像URL」CSVを端末内で検証します。検索URLは個別施設の予約URLでも成果URLでもありません。形式確認だけで施設一致・成果計測を保証しません。</p><section><label for="csvfile">CSVファイルを選択（ローカルで読み込み）</label><input id="csvfile" type="file" accept=".csv,text/csv"><label for="csvtext">またはCSVを貼り付け（最大15,000行）</label><textarea id="csvtext" rows="6" placeholder="リンク先URL,リンクテキスト,商品画像URL"></textarea><button id="run" type="button">事前監査する</button><button id="export" type="button" disabled>指摘一覧CSVを保存</button></section><p id="status" role="status" aria-live="polite">未実行</p><section><h2>検査結果</h2><div id="stats"></div><div class="tablewrap"><table><thead><tr><th>行</th><th>判定</th><th>リンクテキスト</th><th>理由</th></tr></thead><tbody id="results"></tbody></table></div></section><p class="foot">検索URLを成果URLとして扱わず、未照合予約CTAも作成しません。サーバー送信・自動公開・GitHub更新・成果URL発行なし。個別施設との同一性は人が公式根拠で確認してください。</p></main><p style="text-align:center"><a href="stay-official-batch-stager.html">新機能：公式掲載候補の安全一括ステージング</a></p></body></html>
