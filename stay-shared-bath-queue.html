<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="グループ旅行のシャワー・浴室利用順を人数と利用可能時間から試算。施設の利用ルールは必ず手動で確認。"><title>グループ浴室利用順シミュレーター｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-shared-bath-queue.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>グループ浴室利用順シミュレーター</h1><p>シャワー台数・利用可能時間・人数を入力して、最大4宿の順番と終了時刻を試算。</p></header><main><section class="panel"><h2>宿を選択</h2><p>全国 <strong id="total">—</strong> 施設から検索（最大4宿）。</p><label for="search">宿名・都道府県</label><input id="search" type="search" placeholder="例：福井県 民宿"><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>利用順を試算</h2><p class="hint">施設の浴室・シャワー台数、利用可能時間、貸切可否、男女別ルール、清掃時間は自動取得しません。すべて宿に確認した値を手入力してください。24時をまたぐ時間は計算対象外です。</p><div id="cards" class="cards"></div></section><section class="panel"><h2>保存・出力</h2><div class="actions"><button id="save">ブラウザに保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="secondary">全消去</button></div><p id="status" role="status"></p><p class="hint">参加者名は仮名で入力できます。共有端末では個人情報・予約番号を入力しないでください。データは端末内に保存されます。</p></section><p><a href="index.html">トップへ戻る</a></p></main><script src="assets/stay-shared-bath-queue.js" defer></script></body></html>
