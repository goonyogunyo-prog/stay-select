<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コテージ薪・炭の必要量と費用メモ｜STAY SELECT</title><meta name="description" content="焚き火・BBQの許可条件、薪と炭の必要量、現地購入費を宿ごとに整理する利用者入力の計画ツール。"><link rel="stylesheet" href="assets/stay-firewood-fuel-budget.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>コテージ薪・炭の必要量と費用メモ</h1><p>焚き火・BBQの燃料数量と予算、施設の利用条件を宿ごとに記録する計画ツール。</p></header><main><section class="panel"><p class="warning"><strong>重要：</strong>火気の使用可否、直火・焚き火台のルール、消火・灰処理、燃料の販売・持ち込み、天候規制は施設・自治体の公式情報で確認してください。許可を得ていない火気使用は行わないでください。このツールは設備や営業状況を自動判定しません。</p><div class="fields"><label>施設名・都道府県で検索<input id="query" autocomplete="off" placeholder="施設名を入力"></label><label>検索結果（最大60件）<select id="stay"><option value="">検索してください</option></select></label><label>宿泊日数<input id="nights" type="number" min="1" max="30" step="1" value="2"></label><label>1日あたり利用回数<input id="sessions" type="number" min="1" max="10" step="1" value="1"></label><label>1回あたり薪の見積量（kg）<input id="wood" type="number" min="0" max="100" step="0.1" value="3"></label><label>薪1kgの想定価格（円、未確認は空欄）<input id="woodprice" type="number" min="0" max="100000" step="1" placeholder="未確認"></label><label>1回あたり炭の見積量（kg）<input id="charcoal" type="number" min="0" max="100" step="0.1" value="0"></label><label>炭1kgの想定価格（円、未確認は空欄）<input id="charcoalprice" type="number" min="0" max="100000" step="1" placeholder="未確認"></label><label>火気利用の施設回答<select id="permission"><option>未確認</option><option>条件付きで利用可</option><option>利用可</option><option>利用不可</option></select></label><label>直火・焚き火台ルール<select id="firepit"><option>未確認</option><option>焚き火台のみ</option><option>指定場所のみ</option><option>施設の指示に従う</option><option>火気利用不可</option></select></label><label>薪・炭の購入先<select id="purchase"><option>未確認</option><option>施設販売を確認</option><option>持ち込み可を確認</option><option>施設の指定品のみ</option><option>販売・持込不可</option></select></label><label>灰処理・消火ルール<select id="ash"><option>未確認</option><option>施設指定場所に処理</option><option>持ち帰り指示</option><option>施設に要問い合わせ</option></select></label><label class="full">確認日<input id="checked" type="date"></label><label class="full">公式確認URL（任意）<input id="source" type="url" maxlength="300" placeholder="https://..."></label><label class="full">メモ（200字以内）<textarea id="memo" maxlength="200" rows="2" placeholder="風の強い日の禁止条件、薪のサイズ、利用可能時間、予備費など"></textarea></label></div><div class="actions"><button id="add">宿の燃料計画を登録</button><span id="message" role="status" aria-live="polite"></span></div></section><section class="panel"><h2>保存した計画 <small id="count">0件</small></h2><p class="summary" id="summary">計画を登録すると必要量を集計します。</p><div id="entries" class="cards"></div><div class="actions"><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSONバックアップ</button><label class="file-label">JSON復元<input id="import" type="file" accept="application/json,.json" hidden></label></div><p class="muted">最大30件。ブラウザ内保存のみで施設への問い合わせ・予約は送信しません。共有端末で個人情報を入力しないでください。</p></section><p><a href="new-arrivals.html">新着38施設</a> ／ <a href="index.html">トップページ</a></p></main><script src="assets/stay-firewood-fuel-budget.js" defer></script></body></html>
