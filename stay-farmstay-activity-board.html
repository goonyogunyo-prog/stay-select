<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="農家民泊や宿の体験の日時・持ち物・雨天時対応・費用を自分で整理できる準備ボード。"><title>農家民泊・体験準備ボード｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-farmstay-activity-board.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>農家民泊・体験準備ボード</h1><p>宿泊先の農業体験・ものづくり・地域体験を計画する手入力メモ</p></header><main><section class="note"><strong>施設のサービス・体験を自動判定する機能ではありません。</strong><p>料金・実施日・空き状況・安全性・雨天対応・予約条件は宿泊施設または主催者に必ず確認してください。個人情報や予約番号は記録しないでください。入力内容はこのブラウザにのみ保存されます。</p></section><section class="panel"><h2>宿泊先を探す</h2><label for="query">施設名または都道府県</label><input id="query" type="search" placeholder="施設名を入力" autocomplete="off"><p id="load" role="status">施設データ読み込み中…</p><div id="matches" class="matches"></div><p id="chosen" aria-live="polite">宿泊先未選択</p></section><section class="panel"><h2>体験予定を登録（最大20件）</h2><form id="activityForm"><label>体験名<input id="title" required maxlength="90" placeholder="例：収穫体験"></label><label>実施日<input id="day" type="date"></label><label>集合時間<input id="time" type="time"></label><label>集合場所<input id="place" maxlength="100" placeholder="施設に確認"></label><label>服装・持ち物<input id="gear" maxlength="240" placeholder="施設に確認"></label><label>雨天・中止時の扱い<input id="rain" maxlength="240" placeholder="施設に確認"></label><label>参加費（円・見積もり）<input id="fee" type="number" min="0" max="10000000" step="1" value="0"></label><label>確認状況<select id="confirmed"><option value="未確認">未確認</option><option value="施設に確認済み">施設に確認済み</option></select></label><label class="wide">その他メモ<textarea id="memo" maxlength="400" rows="3"></textarea></label><button type="submit">体験予定を追加</button></form></section><section class="panel"><h2>準備リスト</h2><p id="summary" role="status">0件</p><div class="actions"><button id="save" type="button">ブラウザに保存</button><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="import">JSON復元<input id="restore" type="file" accept=".json,application/json"></label><button id="clear" type="button">入力をすべて消去</button></div><div id="items" aria-live="polite"></div><p id="message" role="status"></p></section></main><footer>STAY SELECT｜入力内容の正確性は利用者が確認してください。</footer><script src="assets/stay-farmstay-activity-board.js" defer></script></body></html>
