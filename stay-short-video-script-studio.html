<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECTの宿泊施設から、Instagram・TikTok向け15秒・30秒・45秒のオリジナル紹介台本を作成。料金・設備を推測せず公開前の確認事項を表示。"><title>15秒・30秒の宿紹介動画台本メーカー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-short-video-script-studio.css"></head><body><header><a href="index.html">STAY SELECT トップ</a><h1>15秒・30秒の宿紹介動画台本メーカー</h1><p>全国<span id="count">読み込み中</span>を検索。出典にない設備・料金は自動生成しません。</p></header><main><section><h2>1. 紹介する宿を選ぶ</h2><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：四季館彩冬" autocomplete="off"><div id="results" aria-live="polite"></div><p><strong>選択中：</strong><span id="selected">未選択</span></p><p class="muted" id="source"></p></section><section><h2>2. 動画の長さと切り口</h2><div class="grid"><div><label for="seconds">長さ</label><select id="seconds"><option value="15">15秒</option><option value="30">30秒</option><option value="45">45秒</option></select></div><div><label for="angle">切り口</label><select id="angle"><option>週末旅行の候補</option><option>友人との旅行計画</option><option>記念日の宿探し</option><option>一人旅の候補</option></select></div></div><label for="hook">冒頭の一言（任意・自分で編集）</label><input id="hook" maxlength="180" placeholder="例：次の週末、どこに泊まる？"><div class="actions"><button type="button" id="generate">台本を作成・保存</button></div><p id="notice" role="status" aria-live="polite"></p></section><section><h2>3. 台本・投稿文案</h2><div class="warning">施設名・所在地・公式掲載元以外の情報は確認前に断定しません。実際の画像・動画素材の利用許諾とPR表記、ASP承認は必ず確認してください。動画の自動生成・投稿は行いません。</div><pre id="output" class="result">施設を選んで台本を生成してください。</pre><div class="actions"><button type="button" class="secondary" id="copy">台本をコピー</button><button type="button" class="secondary" id="csv">CSV出力</button><button type="button" class="secondary" id="json">JSONバックアップ</button></div></section><section><h2>保存した台本（最大500件・この端末）</h2><ul id="history"></ul><label for="import">JSONバックアップを復元</label><input id="import" type="file" accept=".json,application/json"><div class="actions"><button type="button" class="secondary" id="clear">保存した台本を削除</button></div></section></main><footer><a href="index.html">STAY SELECTへ戻る</a>｜料金・空室・営業・設備・楽天個別掲載は未確認</footer><script src="assets/stay-short-video-script-studio.js" defer></script></body></html>
