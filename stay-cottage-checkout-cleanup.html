<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="コテージ・貸別荘の退室前にごみの持ち帰り、分別、清掃、鍵返却を施設ごとに確認。最大4宿比較、CSV/JSON出力・復元。"><title>コテージ退室・ごみ分別チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-cottage-checkout-cleanup.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>コテージ退室・ごみ分別チェック</h1><p>宿ごとに違う清掃・ごみ・鍵返却ルールを確認するメモ</p></header><main><p class="notice">宿の清掃義務、ごみ分別・持ち帰り、退室時刻は自動判定しません。公式案内や予約規約を確認して入力してください。未確認項目は未確認のまま残してください。自動予約・連絡は行いません。</p><section class="panel"><h2>候補を追加（最大4宿）</h2><div class="fields"><label>宿名検索<input id="search" type="search" placeholder="施設名の一部" autocomplete="off"></label><label>候補<select id="candidate"><option value="">宿名を検索</option></select></label><label>退室予定日<input id="checkout-date" type="date"></label><label>チェックアウト時刻（確認して入力）<input id="checkout-time" type="time" value="10:00"></label><label>清掃予定時間（分）<input id="cleanup-min" type="number" min="0" max="600" value="30"></label><label>確認元URL（任意）<input id="policy-url" type="url" placeholder="https://..."></label></div><label>宿の清掃・ごみ規約のメモ<textarea id="policy-note" rows="2" maxlength="1200" placeholder="例：ごみ持帰りの要否を宿に確認中"></textarea></label><button id="add" type="button">候補に追加</button><p id="feedback" role="status" aria-live="polite"></p></section><section class="panel"><div class="toolbar"><h2>退室チェック</h2><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><button id="print" type="button">印刷</button></div><p class="small">状態は「未確認・要対応・完了・対象外」。保存はこの端末内だけです。ブラウザのデータ削除で消えることがあります。</p><div id="entries" class="entries"><p>宿を追加してください。</p></div><div class="import"><label>JSON復元<input id="import-file" type="file" accept="application/json,.json"></label><button id="clear" type="button">全件削除</button></div></section></main><footer>STAY SELECT｜施設の公式規約の代わりにはなりません。</footer><script src="assets/stay-cottage-checkout-cleanup.js" defer></script></body></html>
