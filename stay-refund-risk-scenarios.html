<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="返金可能プランと返金不可プランを、キャンセル確率を仮定して比較。宿泊・交通費のキャンセル損失と通常旅行費用を計算。"><title>キャンセル費用リスク比較｜STAY SELECT</title><link rel="stylesheet" href="stay-refund-risk-scenarios.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>キャンセル費用リスク比較</h1><p class="notice">2つの宿泊プランについて、キャンセル時の返金見込額と通常の旅行費用を比較する手入力ツールです。確率は利用者の仮定であり、実際のキャンセル率・返金規定を推定しません。金額は円。端末内で計算し、予約・決済・外部送信・自動保存は行いません。</p><label>キャンセルを想定する確率（0〜100%・任意の仮定）<input id="chance" type="number" min="0" max="100" step="1" value="20"></label><div class="grid"><fieldset><legend>プランA</legend><label>宿泊料金<input id="aL" type="number" min="0" value="25000"></label><label>キャンセル時の宿泊返金額<input id="aR" type="number" min="0" value="0"></label><label>交通費・付随費用（支払総額）<input id="aT" type="number" min="0" value="6000"></label><label>キャンセル時の交通等返金額<input id="aTR" type="number" min="0" value="0"></label></fieldset><fieldset><legend>プランB</legend><label>宿泊料金<input id="bL" type="number" min="0" value="30000"></label><label>キャンセル時の宿泊返金額<input id="bR" type="number" min="0" value="30000"></label><label>交通費・付随費用（支払総額）<input id="bT" type="number" min="0" value="6000"></label><label>キャンセル時の交通等返金額<input id="bTR" type="number" min="0" value="0"></label></fieldset></div><div class="buttons"><button id="calc" type="button">比較する</button><button id="csv" type="button">結果CSVを保存</button></div><section id="result" role="status" aria-live="polite">数値を入力して比較してください。</section><p class="note">返金額は宿泊費・交通費の各支払額を超えない範囲で入力してください。手数料・ポイント・為替・宿泊税・保険などは必要に応じて付随費用に加算してください。キャンセル料発生時期は宿や予約プランごとに異なるため、必ず予約元で確認してください。</p></main><script src="stay-refund-risk-scenarios.js" defer></script></body></html>
