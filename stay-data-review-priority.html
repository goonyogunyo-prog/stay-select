<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設データ再確認優先度｜STAY SELECT</title><meta name="description" content="全国の宿泊施設について、公式情報・楽天照合状況・確認日から再確認優先度を整理。"><link rel="stylesheet" href="assets/stay-data-review-priority.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>施設データ再確認優先度ボード</h1><p>公開データの「確認作業」を効率化する編集者向け機能。宿の品質評価や予約推奨ランキングではありません。</p></header><main><section class="panel"><h2>データの読み込みと絞り込み</h2><p id="status" role="status" aria-live="polite">施設データを読み込んでいます…</p><div class="filters"><label>施設名・都道府県<input id="q" type="search" placeholder="例：室戸、長野県"></label><label>都道府県<select id="pref"><option value="">全国</option></select></label><label>確認状況<select id="filter"><option value="all">すべて</option><option value="no-rakuten">楽天個別URL未照合</option><option value="no-official">宿独自公式URLなし</option><option value="old">確認から14日以上</option><option value="high">再確認優先度・高</option></select></label></div><div class="actions"><button id="export">表示対象をCSVで出力</button><button id="reset" type="button">絞り込みを解除</button></div><p class="notice">優先度は確認作業の順序を示す機械的な目安です。実際の営業・料金・設備・空室・予約可能性は判定しません。未照合の楽天検索URLは予約リンクではありません。</p></section><section class="panel"><h2>再確認キュー</h2><p id="count" aria-live="polite"></p><div id="results" class="results"></div><button id="more" type="button">次の50件を表示</button></section></main><script src="assets/stay-data-review-priority.js" defer></script></body></html>
