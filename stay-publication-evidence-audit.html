<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>掲載証拠の公開前監査｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-publication-evidence-audit.css"><script defer src="assets/stay-publication-evidence-audit.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a>　<a href="new-arrivals.html">新着31施設</a></nav><p class="eyebrow">EDITORIAL EVIDENCE GATE</p><h1>掲載証拠の公開前監査</h1><p>公式会員名簿だけの掲載・出典URL不足・確認日不足などを自動で抽出します。<strong>「注意なし」は営業・施設実在・楽天掲載の保証ではありません。</strong> 施設の自動公開、予約CTA、成果URL生成は行いません。</p><section class="summary"><div><strong id="total">--</strong><small>全施設</small></div><div><strong id="needs">--</strong><small>証拠の追加確認</small></div><div><strong id="members">--</strong><small>会員名簿のみ</small></div><div><strong id="safe">--</strong><small>形式上の注意なし</small></div></section><div class="controls"><label>施設名・県・ID<input id="query" placeholder="検索"></label><label>監査区分<select id="level"><option value="all">すべて</option><option value="review">追加確認が必要</option><option value="member">会員名簿のみ</option><option value="pass">形式上の注意なし</option></select></label><button id="export" type="button">絞込結果CSV出力</button></div><p id="status" role="status">施設データ読込中…</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>施設名</th><th>県</th><th>区分</th><th>理由</th><th>出典</th></tr></thead><tbody id="results"></tbody></table></div><p class="hint">表示は先頭200件。CSVには絞込に一致する全件を含めます。公式掲載URLのHTTP応答・現地営業・予約条件は自動確認しません。</p></main></body></html>
