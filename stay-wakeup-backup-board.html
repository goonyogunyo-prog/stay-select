<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="早朝のフェリー・列車・観光出発に備え、起床と出発の余裕、予備アラーム設定などを管理する手入力ボード。実際のアラーム通知は行いません。"><title>早朝出発・目覚まし二重化ボード｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-wakeup-backup-board.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>早朝出発・目覚まし二重化ボード</h1><p>フェリー・始発列車・朝日観光に遅れないための手入力チェック。<strong>このページ自体はアラームを鳴らしません。</strong></p></header><main><section class="panel"><h2>宿泊先を選ぶ</h2><label>宿名・県名<input id="search" placeholder="例：長野県、諏訪、民宿"></label><label>検索結果（最大80件）<select id="candidates"><option value="">宿名を検索してください</option></select></label><p id="chosen" class="muted">未選択</p></section><section class="panel"><h2>出発前の計画</h2><div class="fields"><label>起床予定<input id="wake" type="datetime-local"></label><label>宿を出る予定<input id="leave" type="datetime-local"></label><label>身支度・荷造り（分）<input id="prep" type="number" min="0" max="720" value="45"></label><label>朝食・会計など（分）<input id="extra" type="number" min="0" max="720" value="20"></label></div><fieldset><legend>設定したか確認（実際のアラーム機能ではありません）</legend><label class="check"><input id="alarm" type="checkbox">メインアラームを設定</label><label class="check"><input id="backup" type="checkbox">別端末など予備アラームを設定</label><label class="check"><input id="power" type="checkbox">端末の充電・電源を確認</label><label class="check"><input id="key" type="checkbox">鍵・チェックアウト方法を確認</label></fieldset><label>メモ<textarea id="note" maxlength="500" rows="3" placeholder="宿の門限、同行者の起床時刻など"></textarea></label><button id="add" type="button">計画を登録する</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>登録済み計画 <span id="total">0</span>/30</h2><div class="toolbar"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label></div><div id="plans" class="cards"><p class="muted">まだ登録がありません。</p></div></section><p class="muted">日時・準備時間は利用者入力。交通・施設情報の自動照合や、端末の実際のアラーム設定・通知・送信はしません。保存はこのブラウザ内のみです。</p></main><script src="assets/stay-wakeup-backup-board.js" defer></script></body></html>
