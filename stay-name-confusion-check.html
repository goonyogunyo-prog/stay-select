<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国6,561施設から似た宿名を検索し、都道府県と公式掲載元を比較。予約先の取り違えを防ぐ確認メモ。"><title>宿名の取り違え防止チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-name-confusion-check.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿名の取り違え防止チェック</h1><p>同じような名前の宿を比較し、都道府県と公式掲載元を確認できます。</p></header><main><section class="notice"><strong>予約・営業の確認機能ではありません。</strong> 施設名・県・掲載元の照合を支援するツールです。宿泊の予約・営業状況・料金・空室・所在地の詳細は宿側に確認してください。楽天個別掲載未照合施設に予約リンクは表示しません。</section><section class="panel"><h2>宿泊施設を検索</h2><label for="query">宿の名前（部分一致・表記ゆれに対応）</label><input id="query" type="search" placeholder="例：伝泊、海の宿、民宿" autocomplete="off"><label for="pref">都道府県</label><select id="pref"><option value="">すべて</option></select><p id="count" role="status" aria-live="polite">読み込み中…</p><div id="results" class="cards"></div></section><section class="panel"><h2>取り違え防止の比較メモ <span id="selectedCount">0/4</span></h2><p>最大4施設を保存できます。選択した施設の県と公式掲載元を並べて確認してください。</p><div id="selected" class="cards"></div><div class="actions"><button id="export" type="button">比較メモをCSV保存</button><button id="clear" type="button" class="secondary">選択をクリア</button></div><p class="muted">この端末のブラウザに施設IDのみ保存します。個人情報は入力しないでください。</p></section></main><script defer src="assets/stay-name-confusion-check.js"></script></body></html>
