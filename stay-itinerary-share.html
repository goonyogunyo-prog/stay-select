<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊旅程の共有メモ作成｜STAY SELECT</title><link rel="stylesheet" href="stay-itinerary-share.css"></head><body><main><p class="brand">STAY SELECT / TRAVEL TOOL</p><h1>宿泊旅程の共有メモ作成</h1><p>同行者に送る集合・宿泊・移動情報を1つの文章にまとめます。入力はこの画面内だけで処理します。</p><div class="fields"><label>旅行名<input id="trip" placeholder="週末温泉旅行"></label><label>集合日時<input id="meet" type="datetime-local"></label><label>集合場所<input id="place" placeholder="新宿駅 南口"></label><label>宿泊施設<input id="hotel" placeholder="施設名"></label><label>宿泊日<input id="checkin" type="date"></label><label>チェックアウト日<input id="checkout" type="date"></label><label>交通・アクセス<textarea id="route" rows="2" placeholder="電車、バス、駐車場など"></textarea></label><label>持ち物・連絡事項<textarea id="notes" rows="3" placeholder="身分証、予約確認など"></textarea></label></div><button id="make">共有文を作成</button><button id="copy" type="button">文章をコピー</button><button id="clear" type="button">入力を消去</button><h2>共有用テキスト</h2><textarea id="output" rows="12" readonly aria-label="共有用テキスト"></textarea><p id="status" role="status"></p><p class="foot">※予約・交通情報の正確性は公式情報で確認してください。入力内容は自動保存されません。</p></main><script src="stay-itinerary-share.js"></script></body></html>
