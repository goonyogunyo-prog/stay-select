<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>公式掲載の確認ワークフロー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-source-verification-workflow.css"></head><body><header><a href="index.html">STAY SELECT</a><span>／</span><a href="new-arrivals.html">新着38施設</a></header><main><p class="eyebrow">LOCAL VERIFICATION WORKSPACE</p><h1>公式掲載の確認ワークフロー</h1><p>2026年11月1日に公式観光団体の宿泊掲載で確認した38施設について、再確認の進捗をこの端末内だけで記録します。<strong>チェック状態は公式な営業確認や楽天個別URL照合を意味しません。</strong></p><div class="controls"><label>施設名を検索<input id="q" type="search" placeholder="施設名・種別"></label><label>作業状態<select id="status-filter"><option value="all">すべて</option><option value="todo">未着手</option><option value="checking">確認中</option><option value="done">人手確認済み</option></select></label><button id="export">全38施設の作業台帳CSV</button><button id="reset">この端末の記録を初期化</button></div><p id="summary" role="status" aria-live="polite">読み込み中…</p><div id="cards" class="cards"></div><p class="notice">公式掲載リンクは情報確認用です。予約CTA・楽天成果URL発行・GitHub書込・自動公開はありません。端末の保存領域を消すと記録も消えます。</p></main><script src="assets/stay-source-verification-workflow.js" defer></script></body></html>
