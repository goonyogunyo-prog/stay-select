<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿への自家用車移動に必要な給油量と燃料残量を試算する利用者入力メモ。全国10507施設から宿を検索し最大4件比較。"><title>宿への給油・燃料余裕プラン｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-fuel-stop-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿への給油・燃料余裕プラン</h1><p>山間部・離島・遠距離ドライブで、給油の必要量と残量を手動入力で確認するためのメモ</p></header><main><section class="panel"><h2>宿を選ぶ（最大4件）</h2><label for="search">全国10,507施設から検索</label><input id="search" placeholder="宿名または都道府県" autocomplete="off"><div id="searchResults" aria-live="polite"></div><p id="notice" role="status" class="muted"></p></section><section class="panel"><h2>走行・燃料の条件</h2><p class="muted small">入力値は利用者の見積もりです。燃費は渋滞・坂道・冬季・荷物量で変化します。</p><div class="fields"><label>タンク容量（L）<input id="tank" type="number" min="1" max="200" step="0.1" value="45"></label><label>出発時の燃料残量（L）<input id="remaining" type="number" min="0" max="200" step="0.1" value="20"></label><label>実燃費（km/L）<input id="efficiency" type="number" min="1" max="100" step="0.1" value="12"></label><label>宿までの走行距離（km）<input id="distance" type="number" min="0" max="5000" step="1" value="180"></label><label>予備として残す燃料（L）<input id="reserve" type="number" min="0" max="100" step="0.1" value="8"></label><label>給油所・最終営業確認先（任意）<input id="station" maxlength="120" placeholder="給油所名・公式情報URLなど"></label></div><label>確認メモ<textarea id="memo" maxlength="500" placeholder="営業時間・定休日・給油できる時間帯・悪天候時の迂回などは公式情報で確認"></textarea></label><div class="row actions"><button id="calculate">試算する</button><button id="save" class="secondary">選択した宿へ保存</button></div><div id="estimate" class="result" aria-live="polite"></div></section><section class="panel"><h2>宿別比較・保存メモ</h2><div id="cards" class="cards"></div><div class="actions"><button id="exportCsv" class="secondary">CSV出力</button><button id="exportJson" class="secondary">JSON出力</button><label for="importJson">JSONを復元<input id="importJson" type="file" accept="application/json,.json"></label><button id="print" class="secondary">印刷</button><button id="clear" class="danger">保存データを全削除</button></div><p class="muted small">このページは給油所の位置・営業時間・実際の残燃料を自動取得しません。給油所・道路情報は公式情報で確認してください。保存はこのブラウザ内のみです。個人情報は入力しないでください。</p></section></main><script src="assets/stay-fuel-stop-planner.js" defer></script></body></html>
