<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出典ドメイン別再確認台帳｜STAY SELECT</title><meta name="description" content="公式掲載URLをドメインごとに集計し、確認日の古い掲載や出典不足を優先して見直すための端末内ツール。"><link rel="stylesheet" href="assets/stay-source-domain-overview.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>出典ドメイン別・再確認台帳</h1><p>全施設の出典URLをドメイン単位で集計。出典の集中度と確認日の古さを把握します。掲載内容の真偽・営業状況を自動判定する機能ではありません。</p></div></header><main class="wrap"><section class="panel"><h2>出典の集計</h2><p id="status" role="status">読み込み中…</p><div class="stats" id="stats"></div><label for="filter">ドメイン・都道府県・掲載元で絞り込み</label><input id="filter" type="search" placeholder="例：yamaguchi、青森県"><label for="sort">並び順</label><select id="sort"><option value="count">掲載件数の多い順</option><option value="oldest">最古の確認日順</option><option value="domain">ドメイン名順</option></select><button type="button" id="export">表示中の集計CSVを出力</button><div class="scroll"><table><thead><tr><th>出典ドメイン</th><th>施設数</th><th>最古の確認日</th><th>最新の確認日</th><th>県の数</th><th>例：掲載元</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="note">公式ドメインであることや掲載の最新性を自動保証しません。料金・空室・設備は未検証。予約CTA・成果URLは生成しません。</p></main><script src="assets/stay-source-domain-overview.js" defer></script></body></html>
