<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊料金以外の追加費用を手動入力して最大4宿を比較。宿泊税・入湯税・駐車場・ペット料金などを見落とさないメモ。"><title>宿泊追加費用・現地支払メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-extra-cost-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿泊追加費用・現地支払メモ</h1><p>宿泊税・入湯税・駐車場・ペット料金など、宿泊料金に含まれない費用を手動で整理</p></header><main><section class="panel"><h2>宿を選ぶ（最大4施設）</h2><label>全国10,545施設から検索<input id="search" autocomplete="off" placeholder="施設名または都道府県"></label><div id="results"></div><p id="notice" role="status"></p></section><section class="panel"><h2>宿泊料金・追加費用を入力</h2><p class="muted">すべて利用者の入力値です。実際の料金・税額・適用条件は宿や自治体の公式情報を確認してください。</p><div class="fields"><label>宿泊料金合計（円）<input id="base" type="number" min="0" max="10000000" step="1" value="20000"></label><label>宿泊税合計（円）<input id="tax" type="number" min="0" max="1000000" step="1" value="0"></label><label>入湯税合計（円）<input id="bath" type="number" min="0" max="1000000" step="1" value="0"></label><label>駐車料金合計（円）<input id="parking" type="number" min="0" max="1000000" step="1" value="0"></label><label>ペット・同伴料金合計（円）<input id="pet" type="number" min="0" max="1000000" step="1" value="0"></label><label>その他追加費用合計（円）<input id="other" type="number" min="0" max="1000000" step="1" value="0"></label><label>すでに支払った金額（円）<input id="paid" type="number" min="0" max="10000000" step="1" value="0"></label><label>料金確認先URL・電話メモ<input id="reference" maxlength="180" placeholder="宿や自治体の公式案内"></label></div><label>確認メモ<textarea id="memo" maxlength="600" placeholder="税の対象者、子ども料金、キャンセル料、支払方法、領収書など"></textarea></label><div class="actions"><button id="calculate">費用を試算</button><button id="save">選択した宿へ保存</button></div><div id="estimate" class="result" aria-live="polite"></div></section><section class="panel"><h2>最大4宿の費用比較</h2><div id="cards" class="cards"></div><div class="actions"><button id="exportCsv">CSV出力</button><button id="exportJson">JSON出力</button><label class="file">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="print">印刷</button><button id="clear" class="danger">全削除</button></div><p class="muted small">このページは施設の料金・税率・空室・楽天掲載を自動取得しません。宿の確認結果を手動で記録するツールです。個人情報や決済情報は入力しないでください。データは端末内に保存されます。</p></section></main><script defer src="assets/stay-extra-cost-planner.js"></script></body></html>
