<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>チェックイン・アウトの実質滞在時間比較｜STAY SELECT</title><link rel="stylesheet" href="stay-effective-hours.css"></head><body><main><a href="index.html">← STAY SELECT</a><h1>宿の実質滞在時間を比較</h1><p>2つの宿についてチェックイン・チェックアウトの日時と旅行代金を入力し、滞在可能時間と1時間あたりの目安費用を比較できます。</p><p class="note">入力は端末内のみで処理。宿の実際の入退室時刻や料金は自動取得しません。予約・外部送信はありません。</p><div class="grid"><section><h2>候補A</h2><label>チェックイン日時<input id="a-in" type="datetime-local" value="2026-11-14T15:00"></label><label>チェックアウト日時<input id="a-out" type="datetime-local" value="2026-11-15T10:00"></label><label>宿泊費合計（円）<input id="a-price" type="number" min="0" step="1" value="18000"></label></section><section><h2>候補B</h2><label>チェックイン日時<input id="b-in" type="datetime-local" value="2026-11-14T14:00"></label><label>チェックアウト日時<input id="b-out" type="datetime-local" value="2026-11-15T11:00"></label><label>宿泊費合計（円）<input id="b-price" type="number" min="0" step="1" value="20000"></label></section></div><div class="actions"><button id="calculate" type="button">比較する</button><button id="csv" type="button">CSV保存</button></div><div id="result" role="status" aria-live="polite"></div><p><small>滞在時間はチェックインからチェックアウトまでの暦上の差分で、外出・睡眠時間は控除しません。1時間あたりの費用は便宜上の指標であり、料金の優劣を保証しません。</small></p></main><script src="stay-effective-hours.js" defer></script></body></html>
