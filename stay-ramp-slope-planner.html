<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>段差とスロープ長さの事前確認｜STAY SELECT</title><meta name="description" content="宿泊施設の入口の段差とスロープの設置可能長さを2案比較する手入力ツール。"><link rel="stylesheet" href="stay-ramp-slope-planner.css"></head><body><main><p><a href="index.html">STAY SELECT ホーム</a></p><h1>段差とスロープ長さの事前確認</h1><p>宿の入口や貸別荘の玄関で、段差の高さと設置可能な水平距離を2案比較します。目安の最大勾配は<strong>利用者が入力する仮定</strong>です。安全基準・法令適合・車椅子での通行可能性を判定するものではありません。</p><form id="rampForm"><div class="rooms"><fieldset><legend>候補A</legend><label>段差の高さ（cm）<input name="riseA" type="number" min="0.1" max="300" step="0.1" value="15" required></label><label>使える水平距離（cm）<input name="runA" type="number" min="1" max="10000" step="0.1" value="220" required></label></fieldset><fieldset><legend>候補B</legend><label>段差の高さ（cm）<input name="riseB" type="number" min="0.1" max="300" step="0.1" value="20" required></label><label>使える水平距離（cm）<input name="runB" type="number" min="1" max="10000" step="0.1" value="180" required></label></fieldset></div><label>想定する最大勾配 1 : <input name="ratio" type="number" min="1" max="100" step="0.1" value="12" required></label><button type="submit">試算する</button><button type="button" id="downloadCsv" disabled>CSV保存</button></form><p id="error" role="alert"></p><pre id="result" aria-live="polite"></pre><p class="notice">実際の利用可否はスロープの材質・幅・踊り場・滑り止め・介助の有無などにも左右されます。施設管理者と専門家に直接確認してください。入力値は端末内でのみ計算し、予約・外部送信は行いません。</p></main><script src="stay-ramp-slope-planner.js"></script></body></html>
