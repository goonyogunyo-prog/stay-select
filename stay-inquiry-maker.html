<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>宿泊前の問い合わせ文を作る｜STAY SELECT</title><link rel="stylesheet" href="stay-inquiry-maker.css"></head><body><header><a href="index.html">STAY SELECT</a>　 <a href="new-arrivals.html">新着・公式出典</a></header><main><p class="eyebrow">FREE TOOL / LOCAL ONLY</p><h1>宿泊前の問い合わせ文を作る</h1><div class="intro"><p>貸切風呂・ケーキ・送迎・キャンセル規定など、宿に確認したいことを選ぶだけで問い合わせ文を作れます。入力内容はこのページから外部送信されません。</p><p class="note">ここでの入力は予約・空室確認ではありません。表示される文章は下書きです。宿泊先への送信は利用者が行ってください。施設の料金・設備・営業・空室は未検証です。</p></div><section class="panel"><h2>宿泊希望を入力</h2><div class="grid"><div><label for="hotel">施設名</label><input id="hotel" placeholder="例：〇〇旅館"></div><div><label for="date">チェックイン予定日</label><input id="date" type="date"></div><div><label for="nights">泊数</label><select id="nights"><option value="未定">未定</option><option value="1泊">1泊</option><option value="2泊">2泊</option><option value="3泊以上">3泊以上</option></select></div><div><label for="persons">人数</label><input id="persons" type="number" min="1" max="99" placeholder="例：2"></div></div><h2>確認したい内容</h2><div class="checks"><label><input type="checkbox" id="bath"></label><label><input type="checkbox" id="cake"></label><label><input type="checkbox" id="decor"></label><label><input type="checkbox" id="parking"></label><label><input type="checkbox" id="shuttle"></label><label><input type="checkbox" id="food"></label><label><input type="checkbox" id="cancel" checked></label><label><input type="checkbox" id="tax" checked></label><label><input type="checkbox" id="late"></label><label><input type="checkbox" id="wifi"></label></div><label for="extra">その他の質問（任意）</label><input id="extra" placeholder="例：チェックアウト後に荷物を預けられますか"><div class="buttons"><button id="make">文章を作成</button><button id="copy" class="secondary">文章をコピー</button><button id="csv" class="secondary">下書きCSVを保存</button></div><p class="status" id="status" role="status"></p><label for="output">作成した問い合わせ文（編集できます）</label><textarea id="output"></textarea></section><p><a href="stay-publish-safety-gate.html">GitHub公開前の安全確認</a> ／ <a href="stay-rakuten-bulk-audit.html">楽天CSV安全監査</a></p></main><footer>STAY SELECT｜宿への問い合わせ・予約を自動実行しません。</footer><script src="stay-inquiry-maker.js" defer></script></body></html>
