<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊施設の季節営業・休業期間を公式案内と照らし、利用者が確認した情報を記録する台帳。営業状態は自動判定しません。"><title>季節営業・休業の確認台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-seasonal-operation-log.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>季節営業・休業の確認台帳</h1><p>冬季休業・季節営業・臨時休業を、公式案内や宿への問い合わせで確認した記録として残せます。</p></header><main><section class="panel"><h2>宿を探す</h2><p>検索対象 <strong id="total">読み込み中</strong> 施設</p><label>施設名・都道府県で検索<input id="q" type="search" placeholder="例：山荘、北海道"></label><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>確認メモ <span id="count">0</span>/100</h2><p class="warn">この台帳は利用者の手入力メモです。掲載施設の営業状況・休業日・予約可否を自動取得・保証しません。宿の公式案内・電話等で再確認してください。個人情報・予約番号は入力しないでください。</p><div id="entries" class="entries"></div><div class="actions"><button id="save" type="button">ブラウザに保存</button><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="file">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="danger">すべて削除</button></div><p id="message" role="status" aria-live="polite"></p></section></main><script src="assets/stay-seasonal-operation-log.js" defer></script></body></html>
