<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊費・交通費・食費を人数で割り、キャンセル時の負担も仮定で試算する無料ツール。料金や空室は取得しません。"><title>グループ旅行の費用割り勘試算｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-group-budget-split.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>グループ旅行の費用割り勘・キャンセル負担試算</h1><p>全10,994施設を検索。手入力の仮定で宿ごとの予算を比較します。予約・料金取得・成果計測は行いません。</p></header><main><section><h2>宿を探す</h2><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：石川県 / 民宿" autocomplete="off"><div id="search-results" aria-live="polite"></div><p id="load-status">施設データを読み込み中…</p></section><section><h2>条件と費用（円・手入力）</h2><div class="fields"><label>人数<input id="people" type="number" min="1" max="100" value="4"></label><label>泊数<input id="nights" type="number" min="1" max="90" value="1"></label><label>宿泊費（1室・1泊の総額）<input id="room" type="number" min="0" value="16000"></label><label>部屋数<input id="rooms" type="number" min="1" max="100" value="1"></label><label>交通費（全員分合計）<input id="transport" type="number" min="0" value="8000"></label><label>食費・その他（全員分合計）<input id="other" type="number" min="0" value="4000"></label><label>追加手数料・税（合計）<input id="fees" type="number" min="0" value="0"></label><label>キャンセル料率（宿泊費に対する仮定％）<input id="cancel" type="number" min="0" max="100" value="50"></label></div><label>プランメモ<input id="memo" maxlength="120" placeholder="例：食事なし・料金は未確認"></label><button id="calculate" type="button">試算する</button><div id="summary" aria-live="polite"></div></section><section><h2>宿ごとの比較記録（最大4宿）</h2><p>宿を選んで「この宿を記録」。選択宿の公式掲載URLは予約ページではありません。</p><button id="save" type="button">この宿を記録</button><button id="clear" type="button">記録をすべて削除</button><div id="records"></div></section><section><h2>保存・出力</h2><button id="export-csv" type="button">CSVを出力</button><button id="export-json" type="button">JSONを出力</button><label for="import-json">JSONから復元</label><input id="import-json" type="file" accept="application/json,.json"><p id="notice" role="status"></p><p class="small">入力内容は端末内のブラウザ保存領域に保存します。ブラウザ設定等で消えることがあります。個人情報は入力しないでください。キャンセル料率・料金・税・設備は公式に照合してください。</p></section></main><script src="assets/stay-group-budget-split.js" defer></script></body></html>
