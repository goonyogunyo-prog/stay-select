<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="貸別荘・コテージの滞在日数と人数から、ごみ袋の必要枚数を概算。CSV保存。端末内処理のみ。"><title>貸別荘のごみ袋必要枚数を試算｜STAY SELECT</title><link rel="stylesheet" href="stay-cottage-trash-bag-estimator.css"></head><body><header><a href="index.html">STAY SELECT</a><span>旅支度ツール</span></header><main><h1>貸別荘のごみ袋・保管量の目安</h1><p>人数と泊数、1人1日のごみ量、分別で減る割合、袋容量、予備枚数から必要枚数を概算します。施設ごとの分別・持ち帰り規定は必ず確認してください。</p><form id="form"><div class="fields"><label>宿泊人数<input id="people" type="number" min="1" max="100" step="1" value="4" required></label><label>泊数<input id="nights" type="number" min="1" max="60" step="1" value="3" required></label><label>1人1日ごみ量（L・仮定）<input id="liters" type="number" min="0.1" max="30" step="0.1" value="2" required></label><label>資源分別等で減る割合（%）<input id="reduction" type="number" min="0" max="95" step="1" value="20" required></label><label>ごみ袋容量（L）<input id="bag" type="number" min="1" max="120" step="1" value="20" required></label><label>袋の使用率（%）<input id="fill" type="number" min="10" max="100" step="1" value="80" required></label><label>予備枚数<input id="reserve" type="number" min="0" max="100" step="1" value="1" required></label></div><div class="actions"><button type="submit">必要枚数を計算</button><button type="button" id="csv" disabled>CSVを保存</button></div></form><section id="result" aria-live="polite"></section><p class="note">数値は利用者の仮定に基づく体積の概算です。臭い・衛生管理・分別規定・収集日・施設の持ち帰り条件を保証しません。予約・決済・外部送信は行いません。</p></main><script src="stay-cottage-trash-bag-estimator.js"></script></body></html>
