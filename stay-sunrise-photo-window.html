<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日の出撮影と朝食・チェックアウトを両立する出発時刻を、利用者が確認した時刻から計算する宿泊旅行メモ。"><title>日の出撮影・朝食時間プランナー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-sunrise-photo-window.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>日の出撮影・朝食時間プランナー</h1><p>日の出時刻・天気・撮影場所・朝食時間は自動取得しません。現地の公式案内や天気予報を確認して入力してください。</p></header><main><section class="panel"><h2>1. 宿を検索</h2><p id="loaded" class="muted">施設データを読み込み中…</p><label for="query">宿泊施設名</label><input id="query" autocomplete="off" placeholder="宿名の一部を入力"><div id="candidates" aria-live="polite"></div><p id="selected" class="muted">宿泊先未選択</p></section><section class="panel"><h2>2. 利用者が確認した予定を入力</h2><div class="fields"><label>撮影場所（自分で確認）<input id="place" maxlength="100" placeholder="例：海岸の展望台"></label><label>日の出時刻（現地の対象日）<input id="sunrise" type="time" value="06:15"></label><label>撮影場所までの片道移動（分）<input id="travel" type="number" min="0" max="360" value="20"></label><label>現地での撮影準備（分）<input id="setup" type="number" min="0" max="180" value="15"></label><label>日の出後の撮影時間（分）<input id="shoot" type="number" min="0" max="240" value="30"></label><label>帰着後の余裕（分）<input id="buffer" type="number" min="0" max="180" value="15"></label><label>朝食の開始時刻（任意）<input id="breakfast" type="time" value="08:00"></label><label>チェックアウト時刻（任意）<input id="checkout" type="time" value="10:00"></label><label>時刻の確認元URL（任意）<input id="source" type="url" placeholder="https://"></label></div><label>メモ<textarea id="memo" maxlength="1000" rows="3" placeholder="撮影場所の立入規則・朝食予約時間など"></textarea></label><div class="buttons"><button id="add">計画を追加（最大4宿）</button><button id="reset" class="secondary">入力をクリア</button></div><p id="status" role="status"></p></section><section class="panel"><h2>3. 比較・保存・復元</h2><p class="muted">出発・帰着目安は入力値による単純計算です。夜明けの明るさ、現地移動、朝食提供、天候、安全性を保証しません。</p><div id="results" class="results"></div><div class="buttons"><button id="csv">CSV出力</button><button id="json">JSON出力</button><button id="print" class="secondary">印刷</button></div><label>JSONから復元<input id="import" type="file" accept=".json,application/json"></label></section><footer><a href="index.html">STAY SELECTへ戻る</a>｜<a href="new-arrivals.html">新着施設</a></footer></main><script defer src="assets/stay-sunrise-photo-window.js"></script></body></html>
