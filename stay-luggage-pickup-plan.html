<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿のチェックアウト後の荷物預け先、受取時刻、駅までの移動、料金概算を利用者入力で管理するボード。施設の預かり対応は自動判定しません。"><title>チェックアウト後の荷物受取計画｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-luggage-pickup-plan.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>チェックアウト後の荷物受取計画</h1><p>観光中の荷物預かり・受け取り忘れを防ぐための手入力ボード。<strong>宿の荷物預かり可否やコインロッカー料金は自動確認しません。</strong></p></header><main><section class="panel"><h2>宿泊先を選ぶ</h2><label>施設名・都道府県で検索<input id="search" placeholder="例：仙北市、民宿、秋田県" autocomplete="off"></label><label>候補（最大80件）<select id="candidates"><option value="">検索して選択</option></select></label><p id="chosen" class="muted">未選択</p></section><section class="panel"><h2>荷物受取・移動の計画</h2><div class="fields"><label>チェックアウト予定<input id="checkout" type="datetime-local"></label><label>荷物受取予定<input id="pickup" type="datetime-local"></label><label>出発交通機関の発車予定<input id="departure" type="datetime-local"></label><label>受取期限（任意）<input id="deadline" type="datetime-local"></label><label>預け先（利用者確認）<select id="storage"><option value="宿フロント">宿フロント（預かり可否は未確認）</option><option value="コインロッカー">コインロッカー</option><option value="その他">その他</option></select></label><label>受取場所から駅・乗り場までの移動（分）<input id="travel" type="number" min="0" max="1440" value="20"></label><label>必要な乗車前余裕（分）<input id="buffer" type="number" min="0" max="240" value="15"></label><label>荷物個数<input id="bags" type="number" min="1" max="20" value="2"></label><label>1個・1時間あたり仮料金（円）<input id="hourly" type="number" min="0" max="100000" value="0"></label></div><label>注意メモ<textarea id="note" maxlength="500" rows="3" placeholder="フロントに預かり可能か確認／ロッカーの最大利用時間／営業時間など"></textarea></label><button id="add" type="button">計画を登録</button><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>保存済み計画 <span id="total">0</span>/30</h2><div class="toolbar"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label></div><div id="plans" class="cards"><p class="muted">計画はありません。</p></div></section><p class="muted">金額は「預け時間を1時間単位に切り上げ × 仮料金 × 個数」の概算です。実際のロッカーは時間制・日額制等で異なります。時刻、料金、預け先の利用条件はすべて利用者の入力値です。保存はこの端末のブラウザ内のみです。</p></main><script src="assets/stay-luggage-pickup-plan.js" defer></script></body></html>
