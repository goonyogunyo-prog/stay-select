<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国10,669施設から宿を選び、Instagram・TikTok用の確認済み情報だけを使った投稿文を作成。"><title>宿紹介SNS投稿文スタジオ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-social-caption-studio.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿紹介SNS投稿文スタジオ</h1><p>事実を盛らずに、宿紹介の投稿文をつくる</p></header><main><section class="panel"><h2>施設を選択（最大4件）</h2><label for="search">全国10,669施設から検索</label><input id="search" placeholder="宿名・都道府県" autocomplete="off"><div id="results"></div><p id="notice" role="status"></p><ul id="chosen"></ul></section><section class="panel"><h2>投稿の設定</h2><div class="fields"><label>投稿先<select id="platform"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select></label><label>切り口<select id="angle"><option value="discover">旅先で宿を探す</option><option value="compare">宿選びの比較</option><option value="island">島旅・地方旅</option></select></label></div><label>自分のひとこと（任意）<textarea id="personal" maxlength="180" placeholder="例：週末の旅先を探していて気になった宿。実際の宿泊経験ではありません。"></textarea></label><p class="hint">掲載元に宿名と都道府県が載っていることだけを根拠に作成します。未確認の料金・営業・設備・空室・予約可能・体験談を断定しません。</p><button id="generate">投稿文を生成</button><button id="copy">文章をコピー</button><label>投稿文<textarea id="output" rows="12" aria-label="投稿文"></textarea></label></section><section class="panel"><h2>メモとエクスポート</h2><button id="save">この端末に保存</button><button id="export">JSONで出力</button><button id="reset">選択をクリア</button><label>JSON復元<input id="import" type="file" accept="application/json,.json"></label><p class="hint">保存は利用端末のlocalStorageのみ。投稿の自動送信・SNSへの接続はしません。個人情報や予約番号は入力しないでください。</p></section></main><script src="assets/stay-social-caption-studio.js" defer></script></body></html>
