<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊地の祭り・イベント、交通規制、駐車場・公共交通への影響を自分で確認し記録する比較ツール。"><title>イベント開催日・交通規制の確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-event-road-restrictions.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>🗓️ イベント開催日・交通規制の確認メモ</h1><p>全国6,105施設から最大6宿を比較。祭り・マラソン・花火大会などの開催日と、道路・駐車場・交通機関の制限を整理します。</p></header><main><section class="panel"><h2>宿泊候補を追加</h2><label for="query">施設名・都道府県で検索</label><input id="query" type="search" placeholder="例：岩手県 / 民宿" autocomplete="off"><p id="result-count" aria-live="polite"></p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><div class="row"><h2>イベントと道路規制の確認項目（最大6宿）</h2><span id="saved" role="status" aria-live="polite"></span></div><p class="notice"><strong>必ず公式発表を確認：</strong>開催日・通行止め・交通機関・迂回路は自動取得・自動判定しません。宿泊先・自治体・警察・交通事業者などの最新案内で確認してください。メモはこのブラウザ内に保存します。</p><p class="progress-tip">進捗は開催日・規制・迂回路・確認日の記入数です。安全な通行やイベント開催を保証するものではありません。</p><div id="cards" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを書き出す</button><button id="json" type="button">JSONを書き出す</button><label class="upload">JSONを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">全メモを削除</button></div></section><p><a href="new-arrivals.html">新着38施設を見る</a></p></main><script src="assets/stay-event-road-restrictions.js" defer></script></body></html>
