<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊アフィリエイトの未確定・確定・取消・入金を手入力して月次差額を照合する管理台帳。自動計測や成果保証は行いません。"><title>広告成果・入金照合台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-affiliate-payout-reconciliation.css"></head><body><header><a href="index.html">STAY SELECT トップ</a><h1>広告成果・入金照合台帳</h1><p>全国<span id="count">読み込み中</span>から施設を検索。ASPの画面と突き合わせるための手動メモです。</p></header><main><section><h2>1. 施設と対象月</h2><label for="search">宿泊施設名・都道府県</label><input type="search" id="search" placeholder="宿名・都道府県を入力"><div id="results" aria-live="polite"></div><p id="selected">施設未選択</p><label for="month">対象月</label><input id="month" type="month" value="2026-10"><label for="asp">ASP／広告主</label><input id="asp" maxlength="100" placeholder="例：楽天アフィリエイト"></section><section><h2>2. 数値を手入力</h2><div class="form-grid"><label>広告クリック数<input id="clicks" type="number" min="0" step="1" value="0"></label><label>未確定成果件数<input id="pending" type="number" min="0" step="1" value="0"></label><label>確定成果件数<input id="confirmed" type="number" min="0" step="1" value="0"></label><label>取消件数<input id="cancelled" type="number" min="0" step="1" value="0"></label><label>確定報酬額（円）<input id="approvedYen" type="number" min="0" step="1" value="0"></label><label>実入金額（円）<input id="paidYen" type="number" min="0" step="1" value="0"></label></div><label for="evidence">ASP管理画面の確認日・根拠メモ</label><textarea id="evidence" rows="3" maxlength="1200" placeholder="確認した日付や照合根拠。個人情報・認証情報は記入しないでください。"></textarea><button type="button" id="add">台帳に保存</button><p id="notice" role="status" aria-live="polite"></p></section><section><h2>3. 記録と差額</h2><p>差額＝確定報酬額－実入金額。未入金・翌月払い等の可能性があり、差額だけで異常と断定しません。</p><div id="summary" aria-live="polite"></div><div id="records"></div><div class="actions"><button type="button" id="csv">CSVを出力</button><button type="button" id="json">JSONを出力</button><label class="file-label">JSONを復元<input id="import" type="file" accept="application/json,.json"></label><button type="button" id="clear" class="danger">全記録削除</button></div><p class="muted">最大500件、端末内のlocalStorageに保存。ASP・SNS・楽天から自動取得しません。成果の承認・予約・入金を保証しません。楽天検索URLは個別予約リンクではありません。</p></section></main><script src="assets/stay-affiliate-payout-reconciliation.js" defer></script></body></html>
