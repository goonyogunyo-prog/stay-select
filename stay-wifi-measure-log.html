<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先のWi-Fi速度・安定性を自分で測り、宿ごとに記録するSTAY SELECTの比較メモ。"><title>宿のWi-Fi実測ログ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-wifi-measure-log.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿のWi-Fi速度・安定性を記録</h1><p>速度テストの結果を手入力して、宿ごとに比較・保存するメモ。</p></header><main><section class="panel"><h2>施設を探す</h2><p>検索対象：<strong id="count">読み込み中</strong>施設</p><div class="grid"><label>宿泊施設名<input id="search" type="search" placeholder="宿名の一部"></label><label>都道府県<select id="pref"><option value="">すべて</option></select></label></div><div id="results" aria-label="検索結果"></div></section><section class="panel"><h2>実測ログ <span id="total">0</span>件</h2><p class="warning">数値は利用者が実測して手入力する記録です。Wi-Fi設備や通信速度を自動検査・保証しません。SSID、パスワード、部屋番号、氏名などは記録しないでください。最大60件まで保存できます。</p><div><button id="exportCsv">CSVを出力</button><button id="exportJson">JSONを出力</button><label class="import">JSONを復元<input type="file" id="importJson" accept=".json,application/json"></label><button id="clear" class="secondary">記録を全削除</button></div><p id="status" role="status" aria-live="polite"></p><div id="records"></div></section></main><script src="assets/stay-wifi-measure-log.js" defer></script></body></html>
