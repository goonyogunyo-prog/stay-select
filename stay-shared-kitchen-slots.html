<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="コテージ・貸別荘の共用キッチン利用時間を整理し、重複を確認する端末内ツール。"><title>共用キッチン利用時間チェック｜STAY SELECT</title><link rel="stylesheet" href="stay-shared-kitchen-slots.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>共用キッチン利用時間チェック</h1><p>コテージやグループ旅行の調理時間を手入力し、同じキッチンで時間が重なる予定を検出します。予約・外部送信・保存は行いません。</p><p class="notice">施設の利用規則・キッチン設備・予約状況を自動確認するものではありません。利用前に宿泊施設へご確認ください。</p><div class="grid"><label>利用グループ<input id="group" placeholder="A班" maxlength="60"></label><label>利用日<input id="date" type="date"></label><label>開始<input id="start" type="time" value="18:00"></label><label>終了<input id="end" type="time" value="19:00"></label><label>キッチン名<input id="kitchen" value="共用キッチン" maxlength="60"></label></div><div class="actions"><button id="add">予定を追加</button><button id="csv">CSV保存</button><button id="clear" class="secondary">全件消去</button></div><p id="status" role="status" aria-live="polite"></p><h2>予定一覧と重複</h2><div id="results"></div><p class="note">終了時刻と次の開始時刻が同じ場合は重複とみなしません。日付をまたぐ予定は別々に入力してください。</p></main><script src="stay-shared-kitchen-slots.js"></script></body></html>
