<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行の食事代・宿泊代予算計算 | STAY SELECT</title><link rel="stylesheet" href="stay-group-meal-budget.css"></head><body><main><h1>旅行の食事代・宿泊代 予算計算</h1><p>宿泊費と食事費を人数・泊数で合算し、1人あたりの予算を計算します。料金は入力値に基づく概算です。</p><label>人数 <input id="people" type="number" min="1" max="100" value="2"></label><label>泊数 <input id="nights" type="number" min="1" max="60" value="1"></label><label>宿泊料金（1室1泊・円）<input id="room" type="number" min="0" value="16000"></label><label>部屋数 <input id="rooms" type="number" min="1" max="100" value="1"></label><label>朝食（1人1泊・円）<input id="breakfast" type="number" min="0" value="1500"></label><label>夕食（1人1泊・円）<input id="dinner" type="number" min="0" value="3000"></label><label>その他（全員合計・円）<input id="other" type="number" min="0" value="0"></label><button id="calc">計算する</button><section id="result" role="status" aria-live="polite"></section><button id="copy">結果をコピー</button><p class="note">宿泊料金に食事代が含まれる場合、重複計上を避けるため食事代を0円にしてください。税・サービス料・人数別料金は施設にご確認ください。入力内容は送信されません。</p></main><script src="stay-group-meal-budget.js"></script></body></html>
