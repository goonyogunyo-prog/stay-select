<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="貸別荘・コテージの家電同時使用時の合計Wと想定回路容量を比較。端末内計算・CSV保存。"><title>貸別荘の家電同時使用・回路容量の目安｜STAY SELECT</title><link rel="stylesheet" href="stay-shared-circuit-load-check.css"></head><body><main><p class="brand"><a href="index.html">STAY SELECT</a> / 宿泊前の準備</p><h1>家電の同時使用と回路容量の目安</h1><p>貸別荘・コテージで電気ケトルや電子レンジなどを同時に使う場合、消費電力の合計と仮定した回路容量を比較します。<strong>安全判定・法令適合判定ではありません。</strong></p><section class="panel"><div class="grid"><label>電圧（V）<input id="voltage" type="number" min="1" step="1" value="100"></label><label>仮定した回路の定格電流（A）<input id="amps" type="number" min="1" step="1" value="15"></label></div><h2>同じ回路で同時に使うと仮定した家電</h2><div id="appliances" class="grid"></div><div class="actions"><button id="calculate" type="button">計算する</button><button id="download" type="button" disabled>CSVを保存</button></div><p id="error" role="alert"></p><section id="results" aria-live="polite"></section></section><p class="notice">これは定格値による概算です。実際の配線系統、起動電流、連続使用の条件、コンセントの定格、ブレーカー仕様は不明です。定格以下でも安全を保証しません。宿の設備管理者に確認し、発熱・異臭・頻繁な遮断があれば使用を中止してください。入力データは外部送信しません。予約・決済機能なし。</p><p><a href="index.html">トップへ戻る</a></p></main><script src="stay-shared-circuit-load-check.js" defer></script></body></html>
