<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>宿への問い合わせ準備｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-contact-prep.css"></head><body><header><a href="index.html">STAY <b>SELECT</b></a><nav><a href="new-arrivals.html">新着施設</a><a href="stay-source-conflict-review.html">出典レビュー</a></nav></header><main><p class="eyebrow">TRAVEL PLANNING / CONTACT CHECKLIST</p><h1>宿への問い合わせを、<em>抜け漏れなく。</em></h1><p>新着38施設の公式掲載を確認し、問い合わせ時に聞きたい内容をまとめる無料ツールです。料金・設備・空室・営業は未確認。入力内容はサーバーへ送信しません。</p><section class="panel"><label>施設名を検索<input id="search" type="search" placeholder="施設名で絞り込む"></label><label>施設を選択<select id="stay"></select></label><p id="source"></p><div class="checks"><label><input type="checkbox" value="希望日の宿泊可否と総額（税・追加料金を含む）">宿泊可否・総額</label><label><input type="checkbox" value="キャンセル料の発生日時と規定">キャンセル規定</label><label><input type="checkbox" value="貸切風呂・客室露天風呂の有無と予約条件">お風呂</label><label><input type="checkbox" value="送迎の有無、駅からのアクセス">アクセス・送迎</label><label><input type="checkbox" value="記念日ケーキ・飾り付けの可否と料金">記念日対応</label><label><input type="checkbox" value="食事内容、アレルギー対応、追加料金">食事</label></div><label>宿泊希望日<input id="date" type="date"></label><label>人数<input id="people" type="number" min="1" max="30" value="2"></label><label>自由記入<textarea id="extra" rows="3" placeholder="確認したいこと"></textarea></label><div class="actions"><button id="make">問い合わせ文を作成</button><button id="copy">文章をコピー</button><button id="csv">対象施設をCSV出力</button></div><label>問い合わせ用メモ<textarea id="result" rows="12" readonly></textarea></label><p id="status" role="status"></p></section><p class="note">施設への送信や予約は行いません。宿の公式サイト・公式観光団体掲載先から、最新の連絡先を確認してください。楽天検索URLは予約URLではありません。</p></main><footer>STAY SELECT · 2026-11-01</footer><script src="assets/stay-contact-prep.js" defer></script></body></html>
