<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="連泊の部屋替え、鍵の返却と受取、荷物の移動を手動記録。最大4宿比較・CSV/JSON出力に対応。"><title>連泊の部屋替え・荷物移動メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-room-move-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>連泊の部屋替え・荷物移動メモ</h1><p>連泊中に部屋が変わる場合の荷物・鍵・受取時刻を整理</p></header><main><section class="panel"><h2>宿を選ぶ（最大4施設）</h2><label>全国10,583施設から検索<input id="search" autocomplete="off" placeholder="施設名または都道府県"></label><div id="results"></div><p id="notice" role="status"></p></section><section class="panel"><h2>部屋替え予定と荷物を入力</h2><p class="muted">以下は利用者の確認メモです。宿側が部屋替え・荷物預かりに対応するかは、必ず施設に直接確認してください。</p><div class="fields"><label>部屋替え予定日<input id="moveDate" type="date"></label><label>現在の部屋番号・タイプ<input id="fromRoom" maxlength="80" placeholder="例：和室 201"></label><label>移動先の部屋番号・タイプ<input id="toRoom" maxlength="80" placeholder="例：洋室 305"></label><label>荷物の個数<input id="bags" type="number" min="0" max="100" step="1" value="2"></label><label>旧室の鍵返却時刻<input id="keyReturn" type="time" value="10:00"></label><label>新室の鍵受取時刻<input id="keyReceive" type="time" value="15:00"></label><label>荷物の一時保管場所<input id="storage" maxlength="150" placeholder="例：フロントに確認"></label><label>宿の連絡先・公式確認URL<input id="contact" maxlength="180" placeholder="例：宿の公式案内"></label></div><fieldset><legend>確認チェック（利用者の手動記録）</legend><label><input id="confirmed" type="checkbox"> 部屋替えの可否を宿に確認</label><label><input id="bagsReady" type="checkbox"> 荷物の移動・タグ付けを確認</label><label><input id="valuables" type="checkbox"> 貴重品・忘れ物を確認</label><label><input id="keys" type="checkbox"> 鍵の返却・受取方法を確認</label></fieldset><label>申し送り・注意事項<textarea id="memo" maxlength="600" placeholder="例：荷物はフロント預かり可否確認、子ども用品、移動補助など"></textarea></label><div class="actions"><button id="calculate">時刻差を試算</button><button id="save">選択した宿へ保存</button></div><div id="estimate" class="result" aria-live="polite"></div></section><section class="panel"><h2>最大4宿の部屋替え比較</h2><div id="cards" class="cards"></div><div class="actions"><button id="exportCsv">CSV出力</button><button id="exportJson">JSON出力</button><label class="file">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="print">印刷</button><button id="clear" class="danger">全削除</button></div><p class="muted small">部屋替えの対応可否・客室の提供時刻・荷物保管・料金は自動取得しません。時刻差は同日内の単純計算です。個人情報や決済情報は入力しないでください。保存は端末内のみです。</p></section></main><script defer src="assets/stay-room-move-planner.js"></script></body></html>
