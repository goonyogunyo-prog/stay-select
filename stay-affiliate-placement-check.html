<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECTの広告掲載先・提携承認・PR表記・リンク先を手動で確認するチェック台帳。審査・法令適合を自動保証しません。"><title>広告掲載チェック台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-affiliate-placement-check.css"></head><body><header><a href="index.html">STAY SELECT トップ</a><h1>広告掲載チェック台帳</h1><p>提携先の承認サイト・掲載媒体・PR表記・リンク先を手動で確認して記録します。</p></header><main><section><h2>掲載前の確認記録を追加</h2><p class="note">この台帳は確認メモであり、ASPの承認状況や規約適合性、楽天トラベルの個別掲載、成果発生を自動判定しません。未照合施設には予約CTAを設置しないでください。</p><div class="fields"><label>確認日<input id="date" type="date"></label><label>媒体<select id="channel"><option>STAY SELECT</option><option>Instagram</option><option>TikTok</option><option>その他</option></select></label><label>掲載先URL<input id="placement" type="url" maxlength="300" placeholder="https://...（公開予定ページ）"></label><label>広告主・ASP<input id="partner" maxlength="100" placeholder="例：楽天トラベル／楽天アフィリエイト"></label><label>対象施設（任意）<input id="search" type="search" placeholder="全国10,884施設を検索"><span id="selected">未指定</span></label></div><div id="results" aria-live="polite"></div><button type="button" id="clear-hotel" class="secondary">施設選択を解除</button><div class="fields"><label>承認サイトの確認<select id="approved"><option>未確認</option><option>申請中</option><option>承認済を手動確認</option><option>対象外・要確認</option></select></label><label>リンク種別<select id="linktype"><option>未確認</option><option>施設名検索URL</option><option>楽天個別URL（手動照合済）</option><option>ユーザー発行成果URL（手動確認済）</option><option>その他</option></select></label><label>PR・広告表記<select id="disclosure"><option>未確認</option><option>表示済を手動確認</option><option>要修正</option><option>非該当・要確認</option></select></label><label>公開前判定（手動）<select id="status-choice"><option>未確認</option><option>確認中</option><option>要修正</option><option>確認済（手動）</option></select></label><label class="wide">根拠・確認先・メモ<textarea id="memo" maxlength="600" rows="3" placeholder="ASP管理画面の確認日、広告主規約、PR表記位置、リンク先など"></textarea></label></div><button id="add" type="button">記録を追加・端末保存</button><p id="status" role="status" aria-live="polite"></p></section><section><h2>確認状況</h2><div id="summary" class="summary"></div><div class="toolbar"><label>状態で絞り込み<select id="filter"><option value="">すべて</option><option>未確認</option><option>確認中</option><option>要修正</option><option>確認済（手動）</option></select></label><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label></div><div id="entries" aria-live="polite"></div></section></main><footer>STAY SELECT｜広告掲載・提携承認の最終判断は各ASP・広告主の最新規約で確認してください。</footer><script src="assets/stay-affiliate-placement-check.js" defer></script></body></html>
