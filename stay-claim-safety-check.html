<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>宿泊案内文の未検証表現チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-claim-safety-check.css"><script defer src="assets/stay-claim-safety-check.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a> ／ <a href="new-arrivals.html">新着・出典</a></nav><h1>宿泊案内文の未検証表現チェック</h1><p>編集者向け。公開前の紹介文に含まれる「空室あり」「最安値」「貸切風呂完備」「楽天で予約可能」など、根拠の再確認が必要な断定を端末内で検出します。<strong>自動で真偽は判定できません。</strong></p><label for="copy">確認する文章（最大30,000文字）</label><textarea id="copy" maxlength="30000" rows="9" placeholder="ここに宿泊施設の紹介文を貼り付けてください"></textarea><div class="controls"><button id="check" type="button">表現をチェック</button><button id="export" type="button" disabled>指摘CSVを出力</button><button id="clear" type="button">クリア</button></div><p id="status" role="status" aria-live="polite">入力された文章は外部送信しません。</p><div class="scroll"><table><thead><tr><th>区分</th><th>見つかった表現</th><th>対応案</th></tr></thead><tbody id="results"><tr><td colspan="3">まだチェックしていません。</td></tr></tbody></table></div><p class="warn">「未確認」「要確認」と明示された表現は除外する場合があります。営業・設備・価格・予約可否を確認するには宿泊施設公式情報等で人手照合してください。GitHubへの書込・予約CTA生成・成果URL発行はしません。</p></main></body></html>
