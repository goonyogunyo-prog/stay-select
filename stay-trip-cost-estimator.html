<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国の宿から4宿を選び、宿泊費・食費・駐車場代・入湯税等を手入力して旅行総額を比較。料金は自動取得しません。"><title>宿泊費総額比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-trip-cost-estimator.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿泊費の総額比較</h1><p>宿泊料金だけでなく、人数・泊数・駐車場・食事・清掃費などを入力し、最大4宿を同じ条件で比較できます。</p></header><main><section class="panel"><h2>宿を選ぶ</h2><p>検索対象 <strong id="total">読込中</strong> 施設</p><label>施設名・県名で検索<input id="q" type="search" placeholder="例：旅館、北海道"></label><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>比較条件</h2><div class="two"><label>人数（1〜30人）<input id="people" type="number" min="1" max="30" value="2"></label><label>泊数（1〜30泊）<input id="nights" type="number" min="1" max="30" value="1"></label></div><p class="note">各宿の金額は利用者の手入力です。料金・税金・予約可否・設備は取得しません。税・手数料は宿に確認し、二重計上にご注意ください。</p></section><section class="panel"><h2>候補 <span id="count">0</span>/4</h2><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="import">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="danger">全件削除</button></div><div id="cards" class="cards"></div><p id="message" role="status"></p></section><p><a href="new-arrivals.html">新着施設一覧</a> ／ <a href="index.html">トップ</a></p></main><script defer src="assets/stay-trip-cost-estimator.js"></script></body></html>
