<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貸別荘の電気・水道代割り勘計算｜STAY SELECT</title><meta name="description" content="貸別荘やコテージの電気・水道メーター差額と固定費を入力し、合計・人数割を試算。端末内で計算、CSV保存対応。"><link rel="stylesheet" href="stay-cottage-utility-split.css"></head><body><main><p><a href="index.html">STAY SELECT ホーム</a></p><h1>貸別荘の電気・水道代割り勘計算</h1><p>宿から提示されたメーター値・単価・固定費を手入力して、グループの実費を概算します。単価や計算方法は施設ごとに異なります。宿の規約・請求明細を優先してください。</p><form id="utilityForm"><fieldset><legend>電気（kWh）</legend><label>開始メーター<input data-num name="electricStart" type="number" step="0.01" min="0" value="1250" required></label><label>終了メーター<input data-num name="electricEnd" type="number" step="0.01" min="0" value="1290" required></label><label>1kWhあたり円<input data-num name="yenPerKwh" type="number" step="0.01" min="0" value="35" required></label></fieldset><fieldset><legend>水道（m³）</legend><label>開始メーター<input data-num name="waterStart" type="number" step="0.01" min="0" value="250" required></label><label>終了メーター<input data-num name="waterEnd" type="number" step="0.01" min="0" value="253" required></label><label>1m³あたり円<input data-num name="yenPerM3" type="number" step="0.01" min="0" value="220" required></label></fieldset><fieldset><legend>その他</legend><label>固定費（円）<input data-num name="fixedFee" type="number" step="0.01" min="0" value="600" required></label><label>人数<input data-num name="people" type="number" step="1" min="1" max="1000" value="4" required></label></fieldset><button type="submit">計算する</button><button type="button" id="csvBtn">CSVを保存</button></form><p id="error" role="alert"></p><p id="result" aria-live="polite"></p><p><small>端末内計算のみ。予約・決済・外部送信は行いません。税、燃料調整費、最低料金などの扱いは施設へ確認してください。</small></p></main><script src="stay-cottage-utility-split.js" defer></script></body></html>
