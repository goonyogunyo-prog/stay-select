<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グループ旅行の部屋割り・定員チェック｜STAY SELECT</title><meta name="description" content="3部屋の定員・人数・料金を比較し、過不足と一人あたり費用を計算。端末内処理、CSV保存。"><link rel="stylesheet" href="stay-group-room-allocation.css"></head><body><main><p><a href="index.html">STAY SELECT ホーム</a></p><h1>グループ旅行の部屋割り・定員チェック</h1><p>旅行者数と部屋ごとの定員・割当人数・宿泊料金を手入力し、定員超過・未割当人数・1人あたりの目安費用を確認します。<strong>実際の定員・添い寝・子ども料金・追加寝具・税金は宿の規定を優先</strong>してください。</p><form id="roomForm"><label>旅行者合計（人）<input type="number" name="party" min="1" max="200" step="1" value="8" required></label><div class="rooms"><fieldset><legend>部屋A</legend><label>定員<input name="capA" type="number" min="0" max="100" value="4" step="1" required></label><label>割当人数<input name="useA" type="number" min="0" max="100" value="4" step="1" required></label><label>部屋料金（円）<input name="costA" type="number" min="0" max="100000000" value="28000" step="1" required></label></fieldset><fieldset><legend>部屋B</legend><label>定員<input name="capB" type="number" min="0" max="100" value="3" step="1" required></label><label>割当人数<input name="useB" type="number" min="0" max="100" value="3" step="1" required></label><label>部屋料金（円）<input name="costB" type="number" min="0" max="100000000" value="22000" step="1" required></label></fieldset><fieldset><legend>部屋C（未使用ならすべて0）</legend><label>定員<input name="capC" type="number" min="0" max="100" value="2" step="1" required></label><label>割当人数<input name="useC" type="number" min="0" max="100" value="1" step="1" required></label><label>部屋料金（円）<input name="costC" type="number" min="0" max="100000000" value="12000" step="1" required></label></fieldset></div><button type="submit">部屋割りを計算</button><button type="button" id="saveCsv" disabled>結果をCSV保存</button></form><p id="error" role="alert"></p><section id="result" aria-live="polite"></section><p class="notice">料金は手入力の参考値です。実際の予約・空室確認・決済・外部送信は行いません。</p></main><script src="stay-group-room-allocation.js"></script></body></html>
