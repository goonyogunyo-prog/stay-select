<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECT全宿泊施設から宿を探し、客室の不備・宿への連絡内容・対応状況を手入力して管理する確認記録。CSV/JSON保存対応。"><title>宿泊先の客室・設備不備の連絡記録｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-room-issue-log.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>客室・設備の不備を記録する</h1><p>チェックイン後に気付いた設備の不備を、宿への連絡と対応状況とともに整理。</p></header><main><section class="panel"><h2>宿泊施設を検索</h2><p>検索対象 <strong id="staycount">読み込み中</strong> 施設</p><div class="grid"><label>宿泊施設名<input id="search" type="search" placeholder="宿名の一部を入力"></label><label>都道府県<select id="pref"><option value="">すべて</option></select></label><label>不備の種類<select id="category"><option>清掃・衛生</option><option>空調・換気</option><option>水回り</option><option>騒音</option><option>鍵・セキュリティ</option><option>寝具</option><option>通信・電源</option><option>その他</option></select></label></div><p class="small" id="found"></p><div id="results" aria-label="宿の検索結果"></div></section><section class="panel"><h2>連絡・対応状況の記録 <span id="total">0</span>件</h2><p class="warning">これは利用者の手入力メモです。宿の不備・設備状況を自動判定しません。予約番号、氏名、部屋番号、暗証番号、決済情報などは入力しないでください。緊急時は宿や適切な窓口へ直接連絡してください。</p><p><button id="exportcsv">CSV保存</button><button id="exportjson">JSON保存</button><label>JSONを復元<input id="importjson" type="file" accept="application/json,.json"></label></p><p class="small">最大100件。ブラウザ内保存（localStorage）。ブラウザの削除・端末変更で失われる場合があるため、CSV/JSONも保存してください。</p><div id="records"></div></section><p role="status" id="status" aria-live="polite"></p><p><a href="index.html">トップに戻る</a>　<a href="new-arrivals.html">新着38施設と公式出典</a></p></main><script src="assets/stay-room-issue-log.js" defer></script></body></html>
