<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>根拠付き施設紹介カード作成｜STAY SELECT</title><meta name="description" content="宿泊施設の確認済み情報だけを根拠URL・確認日と一緒にHTMLカードへ。自動公開・予約リンク生成なし。"><link rel="stylesheet" href="assets/stay-evidence-backed-card.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>根拠付き施設紹介カード作成</h1><p>出典と確認日を記録した事実だけを、編集者が確認してHTML下書きにします。施設名・都道府県以外の条件は自動的に「確認済み」になりません。</p></header><main><section class="panel"><h2>1. 施設を選択</h2><label for="q">施設名検索（全施設）</label><input id="q" placeholder="宿の名前・都道府県を入力"><label for="hotel">施設候補</label><select id="hotel"><option value="">施設を検索してください</option></select><p id="loadStatus" role="status">施設データを読み込み中…</p><p id="selected"></p></section><section class="panel"><h2>2. 出典付き事実を入力</h2><p>各項目は手入力です。料金・空室・営業・設備を未確認のまま断定しないでください。出典URL・確認日がない行はHTMLに含めません。</p><div id="facts"></div><button id="addFact" type="button">確認項目を追加（最大6）</button><label for="editorNote">編集メモ（HTMLには掲載しません）</label><textarea id="editorNote" rows="3" placeholder="要再確認事項など"></textarea></section><section class="panel"><h2>3. 下書きを検査・出力</h2><div class="actions"><button id="build" type="button">HTML下書きを生成</button><button id="copy" type="button">HTMLをコピー</button><button id="download" type="button">HTMLを保存</button><button id="save" type="button">端末に保存</button><button id="csv" type="button">保存済みCSV出力</button><button id="json" type="button">保存済みJSON出力</button></div><p id="message" role="status"></p><textarea id="output" rows="10" readonly aria-label="HTML下書き"></textarea><p>出力はHTML断片であり、自動公開・楽天予約CTA・成果URL発行はありません。リンク先や文言は公開前に再確認してください。</p></section><section class="panel"><h2>端末内の保存済みカード（最大300件）</h2><div id="saved"></div><label for="restore">JSON復元（自分で出力したファイルのみ）</label><input type="file" id="restore" accept="application/json,.json"></section></main><script src="assets/stay-evidence-backed-card.js" defer></script></body></html>
