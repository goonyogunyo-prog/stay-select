<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿の改装・工事、騒音、エレベーター・浴場休止、代替サービスを宿へ確認して記録する比較メモ。"><title>改装・工事・館内休止の確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-renovation-impact.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>🔧 改装・工事・館内休止の確認メモ</h1><p>全国6,143施設から最大6宿を比較。予約前に工事期間、騒音、浴場・エレベーターの休止を確認しましょう。</p></header><main><section class="panel"><h2>宿泊候補を追加</h2><label for="query">施設名・都道府県で検索</label><input id="query" type="search" placeholder="例：福井県 / 旅館" autocomplete="off"><p id="result-count" aria-live="polite"></p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><div class="row"><h2>工事・設備休止の確認項目（最大6宿）</h2><span id="saved" role="status" aria-live="polite"></span></div><p class="notice"><strong>宿への直接確認が必要：</strong>工事日程・騒音・館内設備休止・料金や補償は自動取得・自動判定しません。宿泊施設の最新公式案内や電話等で確認してください。メモはこのブラウザ内に保存します。</p><p class="progress-tip">進捗は工事開始日・騒音・浴場休止・確認日の記入数です。記入は情報の正確性を保証しません。</p><div id="cards" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを書き出す</button><button id="json" type="button">JSONを書き出す</button><label class="upload">JSONを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">全メモを削除</button></div></section><p><a href="new-arrivals.html">新着38施設を見る</a></p></main><script src="assets/stay-renovation-impact.js" defer></script></body></html>
