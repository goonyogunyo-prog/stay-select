<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>館内スパ・エステ希望時間ボード｜STAY SELECT</title><meta name="description" content="宿泊先のスパ・エステ・マッサージ希望時間と料金を利用者が記録する管理メモ"><link rel="stylesheet" href="assets/stay-spa-appointment-board.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>館内スパ・エステ希望時間ボード</h1><p>予約前の希望枠・費用・宿への確認状況をまとめるメモ</p></header><main><section class="panel"><p class="notice"><strong>利用前に：</strong>スパ・マッサージの提供有無、施術条件、料金、キャンセル料は必ず施設へ直接確認してください。入力内容は宿へ送信されません。医療上の助言や施術予約を行うものではありません。</p><div class="fields"><label>施設名・都道府県で検索<input id="q" placeholder="宿名を入力" autocomplete="off"></label><label>検索結果（最大50件）<select id="stay"><option value="">施設を検索してください</option></select></label><label>サービス種別<select id="service"><option>マッサージ</option><option>エステ</option><option>スパ</option><option>その他</option></select></label><label>希望日<input id="date" type="date"></label><label>希望開始時刻<input id="time" type="time"></label><label>希望時間（分）<input id="minutes" type="number" min="0" max="600" value="60"></label><label>確認した料金（円・未確認なら空欄）<input id="price" type="number" min="0" max="1000000" placeholder="未確認"></label><label>施設への確認状況<select id="status"><option>未問い合わせ</option><option>問い合わせ中</option><option>予約確認済み</option><option>利用不可</option></select></label><label>確認日・条件メモ<input id="note" maxlength="200" placeholder="例：宿へ電話確認、変更期限も確認"></label></div><div class="actions"><button id="add">希望枠を追加</button><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSON保存</button><label class="file">JSON復元<input id="import" type="file" accept="application/json,.json" hidden></label><button id="clear" class="danger">全件削除</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>希望枠一覧</h2><p id="summary">まだ登録がありません。</p><div id="list"></div></section><p><a href="new-arrivals.html">新着38施設</a> ／ <a href="index.html">トップへ</a></p></main><script src="assets/stay-spa-appointment-board.js" defer></script></body></html>
