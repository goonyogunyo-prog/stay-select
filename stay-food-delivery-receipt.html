<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先への食材・飲料の事前配送、冷蔵冷凍便の受取・保管、追加料金、配送締切を宿に確認して比較するメモ。"><title>食材の事前配送・受取確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-food-delivery-receipt.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>食材の事前配送・受取確認メモ</h1><p>一棟貸し・コテージ・温泉宿などに、食材や飲料を事前配送できるかを比較。冷蔵・冷凍便の受取、追加料金、締切、引渡し場所を記録できます。</p></header><main class="wrap"><p class="notice"><strong>宿泊施設の配送受取・冷蔵保管設備を自動判定する機能ではありません。</strong>必ず宿に直接確認し、配送先の個人名・住所・電話番号・予約番号・送り状番号などの個人情報は記録しないでください。保存はこの端末のブラウザ内のみです。</p><section class="panel"><h2>施設を検索・追加</h2><p id="loaded">施設一覧を読み込み中…</p><label for="query">施設名・都道府県</label><input id="query" class="search" autocomplete="off" placeholder="例：内子の宿、愛媛県"><p id="result-count" class="muted"></p><div id="results" aria-live="polite"></div></section><section class="panel"><h2>比較・保存 <small id="selection-count">0/6施設</small></h2><div class="toolbar"><button type="button" id="csv">CSV出力</button><button type="button" id="json">JSONバックアップ</button><label class="btn" for="import">JSON復元</label><input id="import" type="file" accept=".json,application/json" aria-label="JSONファイルを読み込む"></div><p id="saved" class="muted" aria-live="polite">入力内容はこの端末に保存されます。機器の変更前にはJSONをバックアップしてください。</p></section><div class="cards" id="cards"></div></main><script src="assets/stay-food-delivery-receipt.js" defer></script></body></html>
