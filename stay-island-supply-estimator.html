<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>離島の水・食事持参量の目安｜STAY SELECT</title><link rel="stylesheet" href="stay-island-supply-estimator.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><p class="eyebrow">ISLAND TRAVEL TOOL</p><h1>離島の水・食事持参量を計算</h1><p>旅行人数、滞在日数、1人1日あたりの想定消費量から、持参する水と食事の目安を計算します。必要量は各自で調整してください。島内での販売状況や必要な栄養・水分量を保証するものではありません。</p><form id="supply-form"><label>人数（1～50人）<input id="guests" type="number" min="1" max="50" value="2" required></label><label>滞在日数（1～14日）<input id="days" type="number" min="1" max="14" value="2" required></label><label>予備日数（0～3日）<input id="buffer" type="number" min="0" max="3" value="1" required></label><label>水の想定量（1人1日あたり L）<input id="water" type="number" min="0.5" max="10" step="0.1" value="2" required></label><label>持参食（1人1日あたり食数）<input id="meals" type="number" min="0" max="4" value="2" required></label><button type="submit">持参量の目安を計算</button></form><p id="message" role="status" aria-live="polite"></p><section id="result" aria-label="計算結果"></section><button type="button" id="download" disabled>計算結果をCSV保存</button><p class="foot">入力内容は端末内のみで計算し、保存・送信しません。予約や宿への連絡は行いません。島の交通、商店、飲料水の利用可否は最新の公式情報で確認してください。</p></main><script src="stay-island-supply-estimator.js" defer></script></body></html>
