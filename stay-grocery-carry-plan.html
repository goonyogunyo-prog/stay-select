<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国8,417施設から最大4宿を選び、徒歩の買い出しで荷物を何往復で運べるか、重量と人数から参考計算。"><title>買い出し荷物の徒歩運搬計画｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-grocery-carry-plan.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>買い出し荷物の徒歩運搬計画</h1><p>コテージ・民宿などで買い出しした食材や飲み物を、徒歩で運ぶときの負担を最大4宿で比較できます。</p></div></header><main class="wrap"><section class="panel"><h2>宿泊施設を探す</h2><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：民宿 新潟県" autocomplete="off"><p id="count" class="muted">施設データを読み込み中…</p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>徒歩運搬の条件（最大4宿）</h2><p class="muted">スーパーまでの徒歩時間、購入予定重量、運ぶ人数と一人の上限重量は手入力です。往復回数・歩行時間は単純な目安であり、坂道や荷物の形状は計算しません。</p><div id="cards" class="grid"></div></section><section class="panel"><h2>保存・持ち出し</h2><div class="actions"><button id="csv">CSVを出力</button><button id="json">JSONを出力</button><label class="file">JSONを復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear">比較をすべて解除</button></div><p id="status" role="status" aria-live="polite"></p></section><aside class="notice">注意：宿泊施設やスーパーの設備・営業時間・持ち込みルールを自動取得しません。運搬量・徒歩所要時間は安全性を保証しません。重量物、悪天候、階段、体調に応じて無理のない移動方法を選んでください。</aside></main><script src="assets/stay-grocery-carry-plan.js" defer></script></body></html>
