<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊の重複予約チェック｜STAY SELECT</title><meta name="description" content="複数の宿泊候補の日付と旅行者グループを比較し、重複予約の可能性を端末内で確認。CSV保存に対応。"><link rel="stylesheet" href="stay-booking-overlap-check.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>宿泊の重複予約チェック</h1><p class="note">予約内容を手入力して同じ旅行者グループの宿泊日が重複していないか調べます。チェックアウト日と次のチェックイン日が同じ場合は重複扱いせず、キャンセル済みの候補は重複判定から除外します。入力データは外部送信・自動保存しません。予約状況・決済・キャンセルは各予約サイトで直接確認してください。</p><div class="scroll"><table><thead><tr><th>宿泊施設</th><th>旅行者グループ</th><th>チェックイン</th><th>チェックアウト</th><th>支払状況（手入力）</th><th></th></tr></thead><tbody id="bookings"></tbody></table></div><button type="button" id="add">候補を追加</button><button type="button" id="check">重複を確認</button><button type="button" id="csv">CSVを保存</button><pre id="result" role="status" aria-live="polite">候補を入力して「重複を確認」を押してください。</pre><p>※旅行者グループ名が同じ予約候補だけを比較します。予約サイト上の重複や実際の決済履歴を検証するものではありません。</p></main><script src="stay-booking-overlap-check.js" defer></script></body></html>
