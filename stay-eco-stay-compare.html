<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECT全国10,770施設から最大4宿を比較し、環境配慮の確認項目を自分で記録。宿の環境認証や設備を自動判定しません。"><title>エコ滞在の確認・比較メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-eco-stay-compare.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>エコ滞在の確認・比較メモ</h1><p>宿の環境対応を断定せず、宿に確認したことを最大4件まで記録します。</p></header><main><section><h2>宿を探す</h2><label for="search">施設名検索（全国10,770施設）</label><input id="search" type="search" placeholder="施設名を入力" autocomplete="off"><div id="results" aria-live="polite"></div></section><section><h2>比較メモ</h2><p>以下の8項目はすべて<strong>利用者の手動確認メモ</strong>です。未確認の内容を施設の事実として扱わないでください。</p><div id="selected" aria-live="polite"></div><p id="summary" aria-live="polite"></p><div class="actions"><button id="save">端末に保存</button><button id="exportCsv">CSVを出力</button><button id="exportJson">JSONを出力</button><label class="upload">JSONを復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="clear" class="secondary">選択をクリア</button></div><p id="status" role="status"></p></section><section><h2>確認する前に</h2><p>環境認証、再生可能エネルギー、給水設備、タオル交換、交通手段などは施設ごとに異なります。必ず施設へ直接確認してください。楽天検索URLは個別予約URLではありません。</p></section></main><script src="assets/stay-eco-stay-compare.js" defer></script></body></html>
