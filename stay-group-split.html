<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊費、交通費、追加費用を人数ごとに分ける無料の端末内計算ツール"><title>グループ旅行の費用割り勘｜STAY SELECT</title><link rel="stylesheet" href="stay-group-split.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>グループ旅行の費用割り勘</h1><p>宿泊費・交通費・追加費用を入力して人数で分けます。入力値はこの端末内でのみ計算し、送信・予約・広告リンク生成は行いません。</p></header><main><section><h2>費用と人数</h2><div class="fields"><label>宿泊費の合計（円）<input id="lodging" type="number" min="0" step="1" value="40000"></label><label>交通費の合計（円）<input id="transport" type="number" min="0" step="1" value="8000"></label><label>食費・追加費用の合計（円）<input id="extra" type="number" min="0" step="1" value="2000"></label><label>参加人数（人）<input id="people" type="number" min="1" max="100" step="1" value="4"></label></div><button id="calc" type="button">計算する</button><button id="export" type="button">割り勘CSVを保存</button><button id="copy" type="button">結果をコピー</button><p id="error" role="alert" aria-live="polite"></p></section><section><h2>計算結果</h2><p id="total" aria-live="polite"></p><p id="perperson"></p><p>端数は参加者番号が小さい順に1円ずつ割り当て、全員分の合計が必ず総額と一致します。</p><div id="result"></div></section><section><h2>注意事項</h2><p>これは入力した金額だけの計算です。宿泊施設の実際の料金・税・キャンセル規定・空室・営業を照合しません。割り勘額は請求書や予約の確定額ではありません。</p><a href="stay-confirmation-matrix.html">宿泊条件の比較表へ</a></section></main><script src="stay-group-split.js" defer></script></body></html>
