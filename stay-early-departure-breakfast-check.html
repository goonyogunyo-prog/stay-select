<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="朝早い出発にホテルの朝食が間に合うか、2施設の提供時間・食事時間・移動時間から比較。端末内計算・CSV保存。"><title>早朝出発と朝食の間に合う時間比較｜STAY SELECT</title><link rel="stylesheet" href="stay-early-departure-breakfast-check.css"></head><body><header><a href="index.html">STAY SELECT</a>　<a href="new-arrivals.html">新着施設</a></header><main><h1>早朝出発・朝食時間の2施設比較</h1><p>出発時刻と朝食提供時間を入力し、余裕を持って朝食を取れるか比較します。入力値は仮定値です。朝食予約、提供形態、実際の移動時間は各宿に確認してください。</p><section class="common"><h2>共通条件</h2><label>宿を出発する時刻<input type="time" id="depart" value="07:30"></label><label>朝食に必要な時間（分）<input type="number" id="meal" value="25" min="1" max="180"></label><label>出発前の余裕（分）<input type="number" id="buffer" value="10" min="0" max="180"></label></section><div class="grid"><section><h2>施設A</h2><label>施設名<input id="nameA" value="施設A" maxlength="80"></label><label>朝食開始<input type="time" id="startA" value="06:30"></label><label>朝食終了<input type="time" id="endA" value="09:00"></label><label>食事会場から出発場所まで（分）<input type="number" id="walkA" value="5" min="0" max="180"></label></section><section><h2>施設B</h2><label>施設名<input id="nameB" value="施設B" maxlength="80"></label><label>朝食開始<input type="time" id="startB" value="07:00"></label><label>朝食終了<input type="time" id="endB" value="09:00"></label><label>食事会場から出発場所まで（分）<input type="number" id="walkB" value="8" min="0" max="180"></label></section></div><div class="actions"><button id="calc" type="button">比較する</button><button id="csv" type="button">比較結果をCSV保存</button></div><div id="error" role="alert" aria-live="polite"></div><div id="result" aria-live="polite"></div><p class="note">宿泊施設の朝食営業・提供条件・交通機関の運行・安全な乗り継ぎは保証しません。計算は端末内のみで、予約・決済・外部送信はありません。</p></main><script src="stay-early-departure-breakfast-check.js"></script></body></html>
