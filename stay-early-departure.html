<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="早朝出発・チェックアウト時の鍵返却、朝食、送迎、交通便、忘れ物確認を時刻順に整理する手入力プランナー。"><title>早朝出発・チェックアウト準備｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-early-departure.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>早朝出発・チェックアウト準備</h1><p>鍵返却・朝食・送迎・交通機関・忘れ物を時刻順に整理。宿の規則や交通時刻を自動取得しません。</p></div></header><main class="wrap"><section class="panel"><h2>宿泊先を選ぶ</h2><label>施設名（全国5,383施設）<input id="query" placeholder="宿の名前で検索" autocomplete="off"></label><div id="results" class="results" role="listbox" aria-label="施設検索結果"></div><p id="selected" class="muted">未選択。施設名は手入力も可能です。</p></section><section class="panel"><h2>出発予定を登録</h2><form id="form"><div class="fields"><label>宿泊先<input id="stay" maxlength="140" required placeholder="宿名"></label><label>出発日<input id="day" type="date" required></label><label>出発予定時刻<input id="departure" type="time" required value="07:00"></label><label>鍵返却方法・フロント対応<input id="key" maxlength="200" placeholder="要確認／フロント／ポスト"></label><label>朝食・弁当の対応<input id="breakfast" maxlength="200" placeholder="要確認／不要／早朝弁当の相談"></label><label>送迎・交通便・集合場所<input id="transport" maxlength="200" placeholder="便名・時刻・集合場所など"></label><label>予備時間（分）<input id="buffer" type="number" min="0" max="240" value="30" required></label><label>同行者への共有メモ<input id="memo" maxlength="300" placeholder="連絡先・立会い等"></label></div><fieldset><legend>出発前の確認事項（本人が確認してチェック）</legend><div class="checks"><label><input type="checkbox" id="c0">鍵の返却方法</label><label><input type="checkbox" id="c1">朝食・弁当</label><label><input type="checkbox" id="c2">精算・入湯税</label><label><input type="checkbox" id="c3">送迎・交通時刻</label><label><input type="checkbox" id="c4">充電器・貴重品</label><label><input type="checkbox" id="c5">冷蔵庫・忘れ物</label><label><input type="checkbox" id="c6">ゴミ・室内ルール</label><label><input type="checkbox" id="c7">同行者への共有</label></div></fieldset><button type="submit">出発プランに追加（最大20件）</button></form><p class="muted">予備時間は出発予定時刻から差し引く単純計算です。チェックアウト時間・鍵返却・送迎・交通時刻は必ず施設・交通事業者に確認してください。</p></section><section class="panel"><h2>出発プラン <span id="count"></span></h2><div id="cards" class="cards"></div><div class="buttons"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button">全削除</button></div><p id="status" role="status" class="muted"></p></section><section class="panel"><h2>ご利用上の注意</h2><p>手入力内容を端末内に保存する補助ツールです。交通・宿泊先の公式情報を自動照合せず、予約・連絡・通知を代行しません。未照合施設に予約CTAを設置しません。</p></section></main><script src="assets/stay-early-departure.js" defer></script></body></html>
