<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿の多言語案内・緊急時の意思疎通・チェックイン説明を事前に確認し、最大6宿を比較する利用者入力メモ。"><title>多言語対応・コミュニケーション確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-language-support.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>多言語対応・コミュニケーション確認メモ</h1><p>宿の対応言語、チェックイン、食事案内、緊急時の通訳手段を確認して最大6施設を比較。</p></header><main class="wrap"><p class="notice"><strong>宿の多言語対応を自動判定する機能ではありません。</strong>対応言語や連絡手段は必ず宿へ確認してください。旅券番号、住所、個人の連絡先、予約番号、医療情報などは入力しないでください。入力内容はこの端末内に保存されます。</p><section class="panel"><h2>施設を検索・追加</h2><p id="loaded">施設一覧を読み込み中…</p><label for="query">施設名・都道府県</label><input id="query" class="search" autocomplete="off" placeholder="例：利尻、長崎県"><p id="result-count" class="muted"></p><div id="results" aria-live="polite"></div></section><section class="panel"><h2>比較・保存 <small id="selection-count">0/6施設</small></h2><div class="toolbar"><button type="button" id="csv">CSV出力</button><button type="button" id="json">JSONバックアップ</button><label class="btn" for="import">JSON復元</label><input id="import" type="file" accept=".json,application/json" aria-label="JSONファイルを読み込む"></div><p id="saved" class="muted" aria-live="polite">入力内容はこの端末に保存されます。機器の変更前にはJSONをバックアップしてください。</p></section><div class="cards" id="cards"></div></main><script src="assets/stay-language-support.js" defer></script></body></html>
