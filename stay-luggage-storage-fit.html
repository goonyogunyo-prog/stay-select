<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荷物預かりサイズ比較｜STAY SELECT</title><link rel="stylesheet" href="stay-luggage-storage-fit.css"><main><h1>荷物預かりサイズ比較</h1><p>2施設の預かりスペースの寸法を比較する確認用ツール。実際の預かり可否・料金・安全性は施設に直接確認してください。</p><section><h2>荷物の寸法（cm）</h2><label>高さ<input id="height" type="number" min="0.1" step="0.1" value="65"></label><label>幅<input id="width" type="number" min="0.1" step="0.1" value="45"></label><label>奥行<input id="depth" type="number" min="0.1" step="0.1" value="28"></label><label>必要な余裕（各方向・cm）<input id="margin" type="number" min="0" step="0.1" value="2"></label></section><section id="hotels"><h2>候補施設の預かりスペース（cm）</h2><div class="hotel"><h3>施設A</h3><label>高さ<input id="a-h" type="number" min="0.1" value="80"></label><label>幅<input id="a-w" type="number" min="0.1" value="55"></label><label>奥行<input id="a-d" type="number" min="0.1" value="40"></label></div><div class="hotel"><h3>施設B</h3><label>高さ<input id="b-h" type="number" min="0.1" value="70"></label><label>幅<input id="b-w" type="number" min="0.1" value="45"></label><label>奥行<input id="b-d" type="number" min="0.1" value="35"></label></div></section><button id="calc">比較する</button><button id="download">CSV保存</button><p id="error" role="alert"></p><output id="result" aria-live="polite"></output><p class="note">入力値は端末内のみで計算します。予約・外部送信はありません。寸法が未確認の場合は適合を判定しないでください。</p></main><script src="stay-luggage-storage-fit.js"></script></html>
