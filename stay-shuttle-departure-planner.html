<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>送迎バスの出発準備逆算｜STAY SELECT</title><link rel="stylesheet" href="stay-shuttle-departure-planner.css"><main><h1>送迎バスの出発準備逆算</h1><p>集合時刻から、荷物整理・チェックアウト・移動時間を逆算します。時刻は施設へ確認してください。</p><label>集合時刻 <input id="meet" type="time" value="09:30"></label><label>集合場所までの移動（分） <input id="walk" type="number" min="0" max="600" value="10"></label><label>チェックアウト手続き（分） <input id="checkout" type="number" min="0" max="600" value="10"></label><label>荷造り（分） <input id="pack" type="number" min="0" max="600" value="20"></label><label>予備時間（分） <input id="buffer" type="number" min="0" max="600" value="10"></label><button id="calc">逆算する</button><output id="result" aria-live="polite"></output><button id="copy">結果をコピー</button><p class="note">日付をまたぐ場合は「前日」と表示。送迎の運行・予約・受付締切は保証しません。</p></main><script src="stay-shuttle-departure-planner.js"></script></html>
