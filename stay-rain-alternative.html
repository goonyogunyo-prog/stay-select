<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旅行の雨天・荒天に備える代替行程表。天候・営業・安全は利用者が確認。"><title>雨天・荒天の代替行程プランナー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-rain-alternative.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>☂️ 雨天・荒天の代替行程プランナー</h1><p>予定が雨で崩れたら？ 宿泊先と屋内の代替案を事前に整理</p></div></header><main class="wrap"><section class="card"><h2>1. 宿泊先を選択</h2><label for="query">全国5,231施設から検索</label><input id="query" type="search" placeholder="施設名・県名で検索" autocomplete="off"><div id="results" role="listbox" aria-label="施設検索結果"></div><p id="chosen" aria-live="polite">宿泊先：未選択</p><button id="clear-stay" type="button" class="secondary">宿泊先を解除</button></section><section class="card"><h2>2. 判断条件（手動入力）</h2><label for="weather">確認した天候の状況</label><select id="weather"><option value="未確認">未確認</option><option value="晴れ・曇り">晴れ・曇り</option><option value="雨">雨</option><option value="強風">強風</option><option value="大雨・警報級">大雨・警報級</option><option value="雪・路面凍結">雪・路面凍結</option></select><label for="weather-source">確認した情報源・確認時刻</label><input id="weather-source" placeholder="例：自治体防災情報を前日に確認"><label for="contact">宿・交通機関の連絡先と判断メモ</label><textarea id="contact" rows="3" placeholder="運休・警報・施設休業時は無理に移動しない"></textarea><p class="hint">天気予報や警報、道路規制、営業状況は自動取得しません。安全上の判断は公的機関と現地の案内を優先してください。</p></section><section class="card"><h2>3. 予定と代替案（最大12件）</h2><div id="activities"></div><button id="add" type="button">＋ 予定を追加</button></section><section class="card"><h2>4. 確認・保存・共有</h2><div id="summary" role="status" aria-live="polite"></div><div class="buttons"><button id="save" type="button">ブラウザに保存</button><button id="export-csv" type="button">CSV出力</button><button id="export-json" type="button">JSON出力</button><label class="filebutton" for="import-json">JSON復元<input id="import-json" type="file" accept="application/json,.json"></label><button id="reset" type="button" class="secondary">入力を初期化</button></div><p id="message" role="status" aria-live="polite"></p></section></main><footer>STAY SELECT｜代替案は利用者の計画メモであり、施設の営業・予約可否や気象安全を保証しません。</footer><script src="assets/stay-rain-alternative.js" defer></script></body></html>
