<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楽天照合状況・手動作業キュー｜STAY SELECT</title><meta name="description" content="全施設の楽天トラベル個別URL照合状況を可視化し、未照合施設をCSVに出力。成果リンク自動発行や予約はしません。"><link rel="stylesheet" href="assets/stay-rakuten-coverage.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>楽天トラベル照合状況</h1><p>施設名検索URLと確認済み個別施設URLを区別して管理します。個別施設の同一性や予約可否を自動確認しません。</p></div></header><main class="wrap"><section class="panel"><p id="status" role="status">読み込み中…</p><div id="stats" class="stats"></div><div class="controls"><label>都道府県<select id="pref"><option value="">すべて</option></select></label><label>照合状態<select id="kind"><option value="unmatched">未照合のみ</option><option value="verified">確認済み33件</option><option value="all">全件</option></select></label><label>施設名・ID検索<input id="query" type="search" placeholder="例：stay-016、温泉"></label></div><button type="button" id="download">表示条件の施設を手動照合CSVとして出力</button><p class="note">最大200件を画面表示します。CSVには絞り込みに該当する全件を出力します。</p><div class="scroll"><table><thead><tr><th>施設ID</th><th>施設名</th><th>県</th><th>状態</th><th>確認用リンク</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="note">未照合は楽天トラベル施設名検索URLのみ。個別予約URL・成果URLではありません。既存33件は継承であり今回の再照合なし。画像URLは未設定。成果計測、料金、空室、設備は未検証です。</p></main><script src="assets/stay-rakuten-coverage.js" defer></script></body></html>
