<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国の宿を検索して、館内売店・お土産の購入予算、税込単価、閉店時間を利用者自身が確認して比較。CSV/JSON保存・復元。"><title>館内売店・お土産購入予算メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-souvenir-shop-budget.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>館内売店・お土産購入予算メモ</h1><p>旅館・コテージの売店営業時間と買い忘れを事前確認</p></header><main><p class="notice">売店の有無・営業時間・在庫・商品価格は自動判定しません。宿の公式情報や問い合わせで確認して入力してください。税込単価は利用者の入力値です。宿泊予約・購入は行いません。</p><section class="panel"><h2>比較する宿を追加（最大4宿）</h2><p id="loaded" class="meta">施設データを読み込み中…</p><div class="fields"><label>宿名・県名を検索<input id="search" type="search" autocomplete="off" placeholder="宿の名前を入力"></label><label>候補を選択<select id="candidate"><option value="">読み込み中</option></select></label></div><p id="matches" class="meta"></p><button id="add" type="button">比較に追加</button><p id="feedback" class="status" role="status" aria-live="polite"></p></section><section class="panel"><div class="row"><h2>比較メモ <span id="counter">0 / 4宿</span></h2><div class="toolbar"><button type="button" id="export-csv">CSV出力</button><button type="button" id="export-json">JSON出力</button><button type="button" id="print" class="secondary">印刷</button></div></div><label>JSONを復元<input id="import" type="file" accept="application/json,.json"></label><p class="meta">内容はこのブラウザのlocalStorageに保存されます。別端末へ移す際はJSONを出力してください。</p><div id="cards" class="cards"></div></section><p><a href="new-arrivals.html">新着38施設</a> ／ <a href="index.html">宿を探す</a></p></main><script src="assets/stay-souvenir-shop-budget.js" defer></script></body></html>
