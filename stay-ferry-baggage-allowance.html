<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="船会社の規約を利用者が確認し、宿泊旅行のフェリー持込荷物の個数・重量・サイズを比較するメモ。"><title>フェリー持込荷物チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-ferry-baggage-allowance.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>フェリー持込荷物チェック</h1><p>公式制限値は自動取得しません。利用者が船会社の規約を確認して入力する計画メモです。</p></header><main><section class="panel"><h2>1. 宿泊先を選ぶ</h2><p id="loaded" class="muted">施設データを読み込み中</p><label>施設名を検索<input id="query" placeholder="宿名の一部を入力"></label><div id="candidates"></div><p class="muted" id="selected">未選択</p></section><section class="panel"><h2>2. 航路・持込条件を記録</h2><div class="fields"><label>船会社・航路名<input id="route" placeholder="例：○○航路（自分で確認）"></label><label>確認元の公式URL<input id="source" type="url" placeholder="https://"></label><label>荷物の個数<input id="pieces" type="number" min="0" max="100" value="2"></label><label>規約上の持込個数上限（合計）<input id="maxpieces" type="number" min="0" max="100" placeholder="未確認なら空欄"></label><label>荷物の合計重量 kg<input id="weight" type="number" min="0" max="1000" step="0.1" value="15"></label><label>規約上の重量上限 kg<input id="maxweight" type="number" min="0" max="1000" step="0.1" placeholder="未確認なら空欄"></label><label>最大荷物の3辺合計 cm<input id="size" type="number" min="0" max="1000" value="140"></label><label>規約上の3辺合計上限 cm<input id="maxsize" type="number" min="0" max="1000" placeholder="未確認なら空欄"></label><label>確認日<input id="checked" type="date" value="2026-10-28"></label><label>船会社への問い合わせ状況<select id="confirmed"><option>未問い合わせ</option><option>問い合わせ中</option><option>確認済み（利用者記録）</option></select></label></div><label>手荷物・超過料金などのメモ<textarea id="memo" rows="3" placeholder="例：大型荷物は別途予約、など（自分で確認）"></textarea></label><p><button id="add">計画を追加（最大4件）</button><button id="clear" class="secondary">入力をクリア</button></p><p id="status" role="status"></p></section><section class="panel"><h2>3. 比較・出力</h2><p class="muted">超過表示は入力した制限値との単純比較です。実際の乗船可否・超過料金・手続は船会社へ確認してください。</p><div id="results" class="results"></div><p><button id="csv">CSV出力</button><button id="json">JSON出力</button><button id="print" class="secondary">印刷</button></p><label>JSONを復元<input type="file" id="import" accept="application/json,.json"></label></section></main><script src="assets/stay-ferry-baggage-allowance.js" defer></script></body></html>
