<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設公開前安全監査｜STAY SELECT</title><meta name="description" content="公式掲載・施設名重複・楽天成果URL・確認日を公開前に安全点検"><link rel="stylesheet" href="assets/stay-listing-readiness.css"></head><body><main><p><a href="index.html">← STAY SELECT</a></p><h1>施設公開前安全監査</h1><p class="notice">公開・予約・成果URL発行は一切しません。全施設のローカルデータと既存楽天照合JSONを照合する編集者用ツールです。警告は要確認候補であり、営業・料金・空室・設備の保証ではありません。</p><div class="stats" id="stats" aria-live="polite">データを読み込み中…</div><section class="panel"><div class="controls"><label>都道府県<select id="pref"><option value="">すべて</option></select></label><label>問題種別<select id="issue"><option value="">全施設</option><option value="problem">警告あり</option><option value="source">公式掲載URL</option><option value="date">確認日</option><option value="duplicate">重複</option><option value="rakuten">楽天リンク</option></select></label><label>施設名・ID<input id="query" type="search" placeholder="施設名やstay-IDで検索"></label></div><button id="download" type="button" disabled>現在の絞込をCSV出力</button><p id="status" aria-live="polite"></p><div class="tablewrap"><table><thead><tr><th>ID</th><th>施設</th><th>県</th><th>警告</th><th>掲載元</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">表示は先頭150件まで。CSVは絞り込み結果を全件出力します。既存33件の楽天照合は原文継承であり再照合ではありません。</p></section></main><script defer src="assets/stay-listing-readiness.js"></script></body></html>
