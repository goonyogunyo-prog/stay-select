<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>船と飛行機の移動費比較｜STAY SELECT</title><meta name="description" content="船と飛行機の人数・乗継費・予備費を入力し、旅行の移動費総額を端末内で比較。"><link rel="stylesheet" href="stay-ferry-flight-compare.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><h1>船と飛行機の移動費を比較</h1><p class="lead">運賃だけでなく、乗継・日数に応じた費用・予備費を含めて比較できます。料金はすべて利用者が入力します。</p><form id="compareForm"><div class="grid"><label>旅行人数<input type="number" name="persons" min="1" max="100" step="1" value="2" required></label><label>比較対象の日数<input type="number" name="days" min="1" max="30" step="1" value="2" required></label></div><fieldset><legend>船を利用する場合</legend><div class="grid"><label>往復運賃（1人・円）<input name="ferry" type="number" min="0" step="1" value="8000" required></label><label>乗継交通費（1人・円）<input name="ferryTransfers" type="number" min="0" step="1" value="1000" required></label><label>日数に応じた追加費用（1日合計・円）<input name="ferryExtra" type="number" min="0" step="1" value="0" required></label><label>欠航等に備える予備費（合計・円）<input name="ferryBuffer" type="number" min="0" step="1" value="0" required></label></div></fieldset><fieldset><legend>飛行機を利用する場合</legend><div class="grid"><label>往復運賃（1人・円）<input name="flight" type="number" min="0" step="1" value="22000" required></label><label>乗継交通費（1人・円）<input name="flightTransfers" type="number" min="0" step="1" value="2000" required></label><label>日数に応じた追加費用（1日合計・円）<input name="flightExtra" type="number" min="0" step="1" value="0" required></label><label>遅延等に備える予備費（合計・円）<input name="flightBuffer" type="number" min="0" step="1" value="0" required></label></div></fieldset><button type="submit">費用を比較する</button> <button type="button" id="save" disabled>CSV保存</button></form><p id="output" aria-live="polite">入力後に比較結果を表示します。</p><p class="note">運航・空席・実際の運賃・遅延確率は取得しません。比較は金額の目安のみで、予約・決済・外部送信はありません。日数に応じた追加費用は旅行全体の1日合計です。</p></main><footer>STAY SELECT｜端末内の計算機能</footer><script src="stay-ferry-flight-compare.js" defer></script></body></html>
