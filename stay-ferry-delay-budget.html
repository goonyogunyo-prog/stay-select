<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>欠航・遅延時の追加費用試算｜STAY SELECT</title><link rel="stylesheet" href="stay-ferry-delay-budget.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><p class="eyebrow">TRAVEL CONTINGENCY TOOL</p><h1>欠航・遅延時の追加費用を試算</h1><p>船・飛行機の欠航などで延泊や交通費の差額が発生する場合に、<strong>自分で確認した金額</strong>を入力して追加費用を整理します。返金・振替・欠航補償は交通会社や宿の規約により異なります。</p><form id="budget-form"><label>追加宿泊日数（0～14泊）<input id="nights" type="number" min="0" max="14" step="1" value="1" required></label><label>追加する部屋数（1～20室）<input id="rooms" type="number" min="1" max="20" step="1" value="1" required></label><label>1室1泊あたり追加宿泊費（円）<input id="roomPrice" type="number" min="0" max="1000000" step="1" value="12000" required></label><label>交通費の追加差額（円）<input id="transport" type="number" min="0" max="10000000" step="1" value="0" required></label><label>追加の食費（全員合計・円）<input id="meals" type="number" min="0" max="10000000" step="1" value="4000" required></label><label>その他追加費用（円）<input id="other" type="number" min="0" max="10000000" step="1" value="0" required></label><label>確定済み返金・補償額（円）<input id="refund" type="number" min="0" max="10000000" step="1" value="0" required></label><button type="submit">追加費用を計算</button></form><p id="message" role="status" aria-live="polite"></p><section id="result" aria-live="polite" aria-label="計算結果"></section><div class="actions"><button id="copy" type="button" disabled>結果をコピー</button><button id="download" type="button" disabled>CSVを保存</button></div><p class="foot">交通機関の運航・代替便・宿の空室・実際の返金条件は取得しません。返金額は確定したものだけ入力してください。入力値はこの端末内で計算し、外部へ送信しません。予約・キャンセル・返金請求は行いません。</p></main><script src="stay-ferry-delay-budget.js" defer></script></body></html>
