<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>施設名の重複候補チェック｜STAY SELECT</title><link rel="stylesheet" href="stay-duplicate-screen.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><p class="eyebrow">QUALITY CONTROL</p><h1>宿泊施設の重複候補をチェック</h1><p>新しい宿を掲載する前に、既存データから同一県の似た名称を探すための確認ツールです。自動で「別施設」とは判定しません。所在地・電話・運営元を必ず公式情報で再確認してください。</p><form id="form"><label>候補施設名<input id="name" required maxlength="100" placeholder="例：苗場金六"></label><label>都道府県<select id="pref" required><option value="">選択してください</option></select></label><button type="submit">重複候補を検索</button></form><p id="status" role="status" aria-live="polite">施設データを読み込み中です。</p><section id="results" aria-label="候補一覧"></section><button type="button" id="csv" disabled>結果をCSV保存</button><p class="small">この画面は端末内で比較するだけです。予約・広告リンク発行・GitHubへの書き込み・外部送信は行いません。</p></main><script src="stay-duplicate-screen.js" defer></script></body></html>
