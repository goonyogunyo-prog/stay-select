<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊キャンセル期限確認メモ | STAY SELECT</title><link rel="stylesheet" href="stay-cancellation-deadline-helper.css"></head><body><main><h1>宿泊キャンセル期限確認メモ</h1><p>施設・予約サイトのキャンセル規定を確認し、期限を入力して整理するツールです。期限や返金条件を自動取得・保証するものではありません。</p><label>施設名<input id="hotel" maxlength="100" placeholder="宿泊施設名"></label><label>チェックイン日<input id="arrival" type="date"></label><label>無料キャンセル期限（現地時刻）<input id="deadline" type="datetime-local"></label><label>確認した規定・注意事項<textarea id="notes" rows="4" placeholder="例：期限を過ぎると宿泊料金の一部が発生。必ず予約画面を再確認"></textarea></label><button id="check">確認メモを作成</button><button id="download">CSV保存</button><output id="result" aria-live="polite"></output><p class="warning">予約サイトと宿泊施設の公式条件が優先されます。日付と時刻は施設所在地の現地時刻として入力してください。</p></main><script src="stay-cancellation-deadline-helper.js"></script></body></html>
