<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>団体宿泊の客室鍵受け渡し台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-room-key-handoff.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>団体宿泊の客室鍵受け渡し台帳</h1><p>受領・返却を部屋単位で記録。宿の実際の鍵管理や利用規約を自動確認する機能ではありません。</p></header><main><section class="panel"><h2>宿を選ぶ</h2><label for="search">施設名・都道府県を検索</label><input id="search" placeholder="施設名を入力" autocomplete="off"><div id="results" role="status" aria-live="polite"></div><p id="picked">未選択</p></section><section class="panel"><h2>部屋の鍵を登録</h2><div class="fields"><label>部屋番号・呼称<input id="room" maxlength="50" placeholder="例：203号室"></label><label>担当者（氏名・班名）<input id="holder" maxlength="60" placeholder="例：A班代表"></label><label>鍵の本数<input id="keys" type="number" min="1" max="30" value="1"></label><label>受領予定時刻<input id="issuedAt" type="time" value="15:00"></label><label>返却予定時刻<input id="dueAt" type="time" value="10:00"></label><label>備考<input id="memo" maxlength="160" placeholder="例：フロントへ返却"></label></div><button id="add">台帳に追加</button><p class="muted">利用者が確認して入力してください。氏名等は端末内に保存されるため共有端末では使用後に削除してください。</p></section><section class="panel"><h2>受け渡し状況</h2><div id="summary" aria-live="polite"></div><div id="entries"></div><div class="actions"><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="import">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear">全件削除</button><button id="print">印刷</button></div><p id="notice" role="status" aria-live="polite"></p></section><footer><p>施設の鍵本数、紛失時費用、受領方法、返却時刻は宿への直接確認が必要です。宿泊予約や空室確認は行いません。</p></footer></main><script src="assets/stay-room-key-handoff.js" defer></script></body></html>
