<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海外宿泊チェックイン時差メモ｜STAY SELECT</title><link rel="stylesheet" href="stay-checkin-timezone-planner.css"><main><h1>海外宿泊チェックイン時差メモ</h1><p>出発地と宿泊先のUTC時差を指定し、現地チェックイン時刻を出発地の時刻に換算します。夏時間は手動で反映してください。</p><label>現地チェックイン日 <input id="date" type="date" value="2026-11-04"></label><label>現地チェックイン時刻 <input id="time" type="time" value="15:00"></label><label>宿泊先 UTCオフセット（時間） <input id="destination" type="number" min="-12" max="14" step="0.25" value="9"></label><label>出発地 UTCオフセット（時間） <input id="origin" type="number" min="-12" max="14" step="0.25" value="9"></label><button id="calc">時刻を換算</button><output id="result" aria-live="polite"></output><button id="copy">結果をコピー</button><p>現地の予約条件・チェックイン受付時間・夏時間の適用は施設や公的情報で確認してください。入力は端末内で処理し送信しません。</p></main><script src="stay-checkin-timezone-planner.js"></script></html>
