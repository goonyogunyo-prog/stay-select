<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先でのオンライン会議の通信量とモバイル回線予備容量を2案比較。端末内計算のみ。"><title>宿泊先の通信量・予備データ比較｜STAY SELECT</title><link rel="stylesheet" href="stay-remote-work-data-budget.css"></head><body><header><a href="index.html">STAY SELECT</a>　<a href="new-arrivals.html">新着施設</a></header><main><h1>リモートワーク通信量・予備データ比較</h1><p>Wi-Fiが使えない場合に備えて、オンライン会議・通常作業で使う想定モバイル通信量を2案で比較します。数値は自分で設定する仮定値で、実測値ではありません。</p><div class="grid"><section><h2>共通の利用条件</h2><label>滞在日数<input id="days" type="number" min="1" max="60" value="3"></label><label>1日あたりオンライン会議時間（時間）<input id="calls" type="number" min="0" max="24" step="0.25" value="2"></label><label>会議通信量（GB/時間）<input id="rate" type="number" min="0" max="10" step="0.01" value="0.8"></label><label>その他作業の通信量（GB/日）<input id="other" type="number" min="0" max="30" step="0.01" value="0.5"></label><label>余裕率（%）<input id="margin" type="number" min="0" max="300" value="20"></label></section><section><h2>候補A</h2><label>候補名<input id="nameA" value="候補A"></label><label>使用可能な予備モバイルデータ（GB）<input id="capA" type="number" min="0" max="10000" step="0.1" value="10"></label><label>Wi-Fi不調を想定する日数<input id="riskA" type="number" min="0" max="60" value="3"></label></section><section><h2>候補B</h2><label>候補名<input id="nameB" value="候補B"></label><label>使用可能な予備モバイルデータ（GB）<input id="capB" type="number" min="0" max="10000" step="0.1" value="5"></label><label>Wi-Fi不調を想定する日数<input id="riskB" type="number" min="0" max="60" value="1"></label></section></div><div class="actions"><button id="calculate" type="button">比較計算</button><button id="download" type="button">結果をCSV保存</button></div><div id="result" aria-live="polite"></div><p class="note">実際の通信量は画質・アプリ・接続状況で変わります。施設のWi-Fi品質、携帯回線の電波、料金プランの制限は未確認です。入力値は端末内で計算し、予約・決済・外部送信しません。</p></main><script src="stay-remote-work-data-budget.js"></script></body></html>
