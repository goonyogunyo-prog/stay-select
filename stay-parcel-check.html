<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先の宅配便受取、チェックイン前・チェックアウト後の荷物預かり、発送条件を宿に確認して比較する手入力メモ。"><title>荷物の配送・預かり条件を比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-parcel-check.css"><script src="assets/stay-parcel-check.js" defer></script></head><body><header><a href="index.html">← STAY SELECT</a><h1>荷物の配送・預かり条件を比較</h1><p>宅配便の事前受取、チェックイン前・アウト後の預かり、宿からの発送を確認する</p></header><main><div class="notice"><strong>確認メモです。宿の対応可否は自動取得・保証しません。</strong><p>宿泊前に各施設へ確認し、回答を入力してください。配送会社の受付条件・料金も別途確認してください。氏名、住所、電話番号、予約番号、伝票番号などの個人情報は入力しないでください。データは利用中のブラウザに保存されます。</p></div><section><h2>宿泊施設を検索</h2><p>対象：<strong id="count">読み込み中</strong></p><label>施設名・都道府県<input id="query" type="search" placeholder="宿名・県名を入力"></label><div id="results" aria-live="polite"></div></section><section><h2>確認メモ（最大4施設）</h2><p><strong id="chosenCount">0</strong>/4施設を比較</p><div id="chosen"></div></section><section><h2>保存・出力・復元</h2><div class="actions"><button id="exportCsv" type="button">CSV出力</button><button id="exportJson" type="button">JSONバックアップ</button><label class="import">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="danger">比較をクリア</button></div><p id="status" role="status" aria-live="polite"></p></section><p><a href="new-arrivals.html">新着38施設を見る</a> ｜ <a href="stay-trip-cost-estimator.html">宿泊費総額の比較</a></p></main></body></html>
