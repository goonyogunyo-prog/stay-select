<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿の夜間出入口・門限・鍵・貴重品保管などを自分で確認し最大8宿で比較するSTAY SELECTの無料メモ。設備自動判定ではありません。"><link rel="stylesheet" href="assets/stay-night-entry.css"><title>夜間の出入り・鍵の確認メモ｜STAY SELECT</title></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT トップ</a><h1>🔑 夜間の出入り・鍵の確認メモ</h1><p>全国5,687施設から候補を選び、門限・夜間入口・鍵・緊急連絡を確認して比較</p></div></header><main class="wrap"><section class="notice"><strong>利用者の確認内容を記録する機能です。</strong> 夜間の出入り可否や安全性を自動判定しません。宿泊施設の公式案内・スタッフに確認し、緊急時は現地の指示を優先してください。楽天個別予約URL・成果リンクの未照合CTAはありません。</section><section class="panel"><h2>比較する宿を追加（最大8件）</h2><label for="search">宿泊施設名・都道府県で検索</label><input id="search" type="search" placeholder="例：田代別館 / 鹿児島県" autocomplete="off"><div id="resultInfo" role="status"></div><div id="results" class="results"></div></section><section class="panel"><div class="toolbar"><h2>確認メモ <span id="count">0 / 8</span></h2><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="import" for="import">JSON復元</label><input type="file" id="import" accept="application/json,.json" hidden><button id="clear" type="button" class="muted">全件削除</button></div></div><p class="hint">入力内容はこの端末のブラウザ内に保存します。端末・ブラウザを変えると引き継がれません。共有する場合はJSONを出力してください。</p><div id="cards" class="cards"></div><p id="status" role="status"></p></section></main><script src="assets/stay-night-entry.js" defer></script></body></html>
