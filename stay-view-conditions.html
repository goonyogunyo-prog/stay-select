<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECT全国5,649施設から候補を選び、海・山・夜景・庭など客室眺望の条件と確認根拠を手入力で最大4宿比較。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/stay-select/stay-view-conditions.html"><title>客室の眺望・写真条件比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-view-conditions.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>客室の眺望・写真条件比較</h1><p>「オーシャンビュー」の言葉だけで決めず、どの部屋で何が見えるか確認するための手入力メモ。</p></div></header><main class="wrap"><p class="notice"><strong>確認事項：</strong>眺望・階数・写真・追加料金は自動取得・保証しません。写真と実際の客室が一致するか、客室指定の可否を宿泊施設に確認してください。楽天個別掲載未照合の予約CTAはありません。</p><section class="panel"><h2>1. 宿と確認した眺望条件</h2><div class="grid"><label class="wide">施設名・都道府県で検索<input id="search" type="search" placeholder="例：兵庫、旅館" autocomplete="off"></label><label class="wide">宿を選択<select id="hotel"><option value="">検索して選択</option></select></label><label>眺望タイプ<select id="view"><option>海</option><option>山</option><option>庭園</option><option>夜景</option><option>川・湖</option><option>街並み</option><option>未確認</option><option>その他</option></select></label><label>眺望の確約<select id="guarantee"><option>未確認</option><option>客室・プランで確約と記載</option><option>リクエストのみ</option><option>確約なし</option></select></label><label>確認した部屋・プラン名<input id="room" maxlength="100" placeholder="例：海側ツイン（要確認）"></label><label>確認した階数・方角<input id="direction" maxlength="60" placeholder="例：3階・南向き"></label><label>眺望の追加料金（円・手入力）<input id="surcharge" type="number" min="0" max="1000000" value="0" step="1"></label><label>確認日<input id="checked" type="date"></label><label class="wide">参照した公式・写真URL（任意）<input id="evidence" type="url" maxlength="500" placeholder="https://..."></label><label class="wide">遮蔽物・写真の撮影位置・気になる点<textarea id="memo" maxlength="400" placeholder="例：写真は最上階のみ／目の前に建物／天候で見え方が変わる"></textarea></label></div><button id="add" type="button">比較表に追加（最大4宿）</button><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>2. 眺望の比較表</h2><div class="table-wrap"><table><thead><tr><th>宿</th><th>眺望</th><th>確約</th><th>部屋・プラン</th><th>階数・方角</th><th>追加料金</th><th>確認日</th><th>根拠URL</th><th>メモ</th><th>操作</th></tr></thead><tbody id="results"></tbody></table></div><p id="summary" aria-live="polite"></p><div class="actions"><button id="export-csv" type="button">CSV出力</button><button id="export-json" type="button">JSON出力</button><label class="import">JSONを復元<input id="import-json" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="secondary">全件削除</button></div></section><p class="foot"><a href="new-arrivals.html">今回の新着38施設</a> · <a href="index.html">STAY SELECTトップ</a></p></main><script src="assets/stay-view-conditions.js" defer></script></body></html>
