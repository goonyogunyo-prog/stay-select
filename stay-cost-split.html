<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊料金・食費・清掃費・駐車場代・クーポンを手入力し、人数割りの予算を最大4宿で比較。予約や料金取得は行いません。"><title>宿泊費・割り勘シミュレーター｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-cost-split.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿泊費・割り勘シミュレーター</h1><p>複数の宿の総額・1人当たり負担を同じ条件で比べる。</p></header><main><section class="panel"><h2>施設を検索・選択</h2><p>全国 <b id="total">—</b> 施設。最大4宿を比較。</p><label for="search">宿名・都道府県で検索</label><input id="search" type="search" placeholder="例：岐阜県 温泉"><div id="results" class="results"></div></section><section class="panel"><h2>共通条件</h2><div class="fields"><label>宿泊人数<input id="people" type="number" min="1" max="100" value="2"></label><label>泊数<input id="nights" type="number" min="1" max="30" value="1"></label></div><p class="hint">金額はすべて利用者が税込額を確認して入力してください。宿泊料金・税・クーポン適用条件は自動取得しません。</p></section><section class="panel"><h2>宿ごとの費用</h2><div id="selected" class="cards"></div><div id="summary" role="status" aria-live="polite"></div><div class="actions"><button id="save">ブラウザ保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="filelabel">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="reset" class="secondary">入力を消去</button></div><p id="status" role="status" aria-live="polite">読み込み中</p></section></main><footer><a href="index.html">トップへ戻る</a>｜<a href="new-arrivals.html">新着施設</a><p>計算結果は概算。宿泊施設への問い合わせ・予約・決済・楽天トラベルの料金照合は行いません。</p></footer><script src="assets/stay-cost-split.js" defer></script></body></html>
