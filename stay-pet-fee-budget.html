<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペット同伴宿泊費用シミュレーター | STAY SELECT</title><link rel="stylesheet" href="stay-pet-fee-budget.css"></head><body><main><p>STAY SELECT / 宿泊計画</p><h1>ペット同伴宿泊費用シミュレーター</h1><p>宿泊料金にペット同伴料金・清掃料金・頭数ごとの費用を加算します。ペット可否や料金は必ず宿泊施設の公式情報で確認してください。</p><form id="f"><label>宿泊料金（滞在合計・円）<input id="base" type="number" min="0" value="30000" required></label><label>宿泊日数<input id="nights" type="number" min="1" max="365" value="2" required></label><label>ペット頭数<input id="pets" type="number" min="0" max="20" value="1" required></label><label>ペット1頭1泊料金（円）<input id="petNight" type="number" min="0" value="3000" required></label><label>ペット1頭1滞在料金（円）<input id="petStay" type="number" min="0" value="0" required></label><label>清掃等の一括追加料金（円）<input id="clean" type="number" min="0" value="2000" required></label><button>総額を計算</button></form><section aria-live="polite" id="out"></section><button type="button" id="copy">結果をコピー</button><p class="note">金額は税込・税別の入力条件を統一してください。ペットの種類・大きさ・頭数制限や追加料金は施設により異なります。データ送信・保存はしません。</p></main><script src="stay-pet-fee-budget.js"></script></body></html>
