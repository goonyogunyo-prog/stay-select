<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>ペット同伴旅行の総費用比較｜STAY SELECT</title><meta name="description" content="ペット同伴の宿泊代・追加料金・清掃料・預り金・移動費を手入力し2施設を比較。予約・外部送信なし。"><link rel="stylesheet" href="stay-pet-trip-cost-compare.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><h1>ペット同伴旅行の総費用を比較</h1><p class="lead">2つの宿について、宿泊費だけでなくペット追加料金・清掃料・移動費・返金予定の預り金を分けて比較します。<strong>料金・ペット可否・規定は自動取得しません。</strong></p><form id="petCostForm"><section class="shared"><h2>共通条件</h2><div class="grid"><label>泊数<input name="nights" type="number" min="1" max="90" step="1" value="2" required></label><label>人数<input name="people" type="number" min="1" max="30" step="1" value="2" required></label><label>ペット数<input name="pets" type="number" min="0" max="20" step="1" value="1" required></label></div></section><div class="options"><fieldset><legend>候補A</legend><div class="grid"><label>施設名<input name="a_name" maxlength="80" value="候補A"></label><label>1室1泊の宿泊代（円）<input name="a_room" type="number" min="0" step="1" value="18000" required></label><label>部屋数<input name="a_rooms" type="number" min="1" max="30" step="1" value="1" required></label><label>ペット1匹1泊の追加料金（円）<input name="a_petNight" type="number" min="0" step="1" value="2200" required></label><label>清掃料など1回の固定費（円）<input name="a_cleaning" type="number" min="0" step="1" value="3300" required></label><label>ペット移動費など合計（円）<input name="a_transport" type="number" min="0" step="1" value="0" required></label><label>返金予定の預り金（円）<input name="a_deposit" type="number" min="0" step="1" value="10000" required></label></div></fieldset><fieldset><legend>候補B</legend><div class="grid"><label>施設名<input name="b_name" maxlength="80" value="候補B"></label><label>1室1泊の宿泊代（円）<input name="b_room" type="number" min="0" step="1" value="22000" required></label><label>部屋数<input name="b_rooms" type="number" min="1" max="30" step="1" value="1" required></label><label>ペット1匹1泊の追加料金（円）<input name="b_petNight" type="number" min="0" step="1" value="0" required></label><label>清掃料など1回の固定費（円）<input name="b_cleaning" type="number" min="0" step="1" value="0" required></label><label>ペット移動費など合計（円）<input name="b_transport" type="number" min="0" step="1" value="0" required></label><label>返金予定の預り金（円）<input name="b_deposit" type="number" min="0" step="1" value="0" required></label></div></fieldset></div><div class="actions"><button type="submit">比較する</button><button id="csv" type="button" disabled>比較結果CSV</button></div></form><section id="result" class="result" aria-live="polite"><p>条件を入力して比較してください。</p></section><aside><h2>利用前の確認</h2><p>ペットの受入条件、犬種・体重・頭数、予防接種証明、追加清掃費、預り金の返金条件は必ず宿の公式規定で確認してください。計算結果は入力値による試算であり、宿泊予約や決済は行いません。情報は外部送信せず、端末内で処理します。</p></aside></main><script src="stay-pet-trip-cost-compare.js" defer></script></body></html>
