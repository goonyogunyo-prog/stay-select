<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊先の朝食時間・出発余裕比較 | STAY SELECT</title><link rel="stylesheet" href="stay-morning-departure-buffer.css"><main><h1>朝食時間と出発の余裕を比較</h1><p>朝食開始、食事時間、チェックアウト準備、出発希望時刻を入力して余裕を確認できます。実際の提供時間は施設に確認してください。</p><label>朝食開始 <input id="start" type="time" value="07:00"></label><label>朝食所要時間（分） <input id="meal" type="number" min="0" max="300" value="40"></label><label>準備・移動時間（分） <input id="prep" type="number" min="0" max="300" value="30"></label><label>希望出発時刻 <input id="leave" type="time" value="09:00"></label><button id="calc">計算する</button><button id="export">CSV保存</button><output id="result" aria-live="polite"></output><p class="note">同日内の計算のみ。予約・外部通信は行いません。</p></main><script src="stay-morning-departure-buffer.js"></script></html>
