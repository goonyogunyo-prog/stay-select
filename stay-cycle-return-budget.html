<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レンタサイクル返却余裕・費用計画｜STAY SELECT</title><meta name="description" content="宿泊先でのレンタサイクル貸出・返却予定と移動余裕、概算費用を利用者自身が確認するメモ"><link rel="stylesheet" href="assets/stay-cycle-return-budget.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>レンタサイクル返却余裕・費用計画</h1><p>借りる前に返却締切・周遊時間・予備時間を整理</p></header><main><section class="panel"><p class="notice"><strong>重要：</strong>自転車貸出の有無、料金、貸出・返却時刻、ヘルメット、補償、交通規則は施設・貸出事業者へ直接確認してください。ここは<strong>利用者入力メモ</strong>であり、予約・貸出申請・位置追跡・通知はしません。</p><div class="fields"><label>宿泊施設名・県で検索<input id="q" placeholder="施設名で検索" autocomplete="off"></label><label>検索結果（最大50件）<select id="stay"><option value="">施設を検索してください</option></select></label><label>利用日<input id="date" type="date"></label><label>貸出開始時刻<input id="start" type="time" value="09:00"></label><label>返却締切時刻（施設確認値）<input id="deadline" type="time" value="17:00"></label><label>走行予定（分）<input id="ride" type="number" min="0" max="1440" value="120"></label><label>休憩・観光予定（分）<input id="break" type="number" min="0" max="1440" value="60"></label><label>返却前の予備時間（分）<input id="buffer" type="number" min="0" max="360" value="30"></label><label>仮の1時間単価（円・未確認なら空欄）<input id="rate" type="number" min="0" max="100000" placeholder="未確認"></label><label>貸出条件・ヘルメット・保険メモ<input id="note" maxlength="220" placeholder="事業者への確認日、返却場所など"></label></div><div class="actions"><button id="add">計画を追加</button><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSON保存</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json" hidden></label><button id="clear" class="danger">全件削除</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>返却余裕・概算費用</h2><p id="summary">まだ計画がありません。</p><div id="list"></div></section><p><a href="new-arrivals.html">今回の新着38施設</a> ／ <a href="index.html">トップへ</a></p></main><script src="assets/stay-cycle-return-budget.js" defer></script></body></html>
