<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>宿泊旅行の総額・追加費用シミュレーター｜STAY SELECT</title><link rel="stylesheet" href="stay-total-cost.css"></head><body><header><a href="index.html">← STAY SELECT</a></header><main><h1>宿泊旅行の総額・追加費用シミュレーター</h1><p class="lead">宿泊料金だけでなく、人数・泊数・宿泊税等・食事・清掃料・交通費を手入力して旅行総額を試算できます。税率や宿の規定は自動取得しません。</p><section class="panel"><div class="inputs"><label for="nights">泊数<input id="nights" type="number" inputmode="numeric" min="0" step="1" value="2"></label><label for="persons">人数<input id="persons" type="number" inputmode="numeric" min="0" step="1" value="2"></label><label for="rooms">部屋数<input id="rooms" type="number" inputmode="numeric" min="0" step="1" value="1"></label><label for="room">1室1泊の宿泊料金（円）<input id="room" type="number" inputmode="numeric" min="0" step="1" value="15000"></label><label for="tax">1人1泊の宿泊税等（円・手入力）<input id="tax" type="number" inputmode="numeric" min="0" step="1" value="0"></label><label for="meal">1人1泊の食事代（円）<input id="meal" type="number" inputmode="numeric" min="0" step="1" value="0"></label><label for="clean">清掃料合計（円）<input id="clean" type="number" inputmode="numeric" min="0" step="1" value="0"></label><label for="transport">交通費合計（円）<input id="transport" type="number" inputmode="numeric" min="0" step="1" value="0"></label><label for="other">その他追加費用合計（円）<input id="other" type="number" inputmode="numeric" min="0" step="1" value="0"></label></div></section><section class="panel" aria-live="polite"><p id="error" role="alert"></p><p id="result"></p><p id="breakdown"></p><button type="button" id="export">内訳をCSV保存</button></section><small>計算は端末内のみ。入力情報の送信、予約・決済・成果計測は行いません。宿泊税・サービス料・食事代・キャンセル規定は必ず宿泊施設の公式案内で確認してください。1人あたりの金額は整数円で切り捨て、余りを別表示します。</small></main><script src="stay-total-cost.js" defer></script></body></html>
