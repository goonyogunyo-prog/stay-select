<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊費の割り勘・精算プランナー｜STAY SELECT</title><link rel="stylesheet" href="stay-group-expense-settlement.css"></head><body><main><a href="index.html">STAY SELECT</a><h1>宿泊費の割り勘・精算プランナー</h1><p>宿泊費、交通費、食費、その他をまとめ、人数別の負担額を試算します。入力は端末内で処理され、送信・保存されません。</p><label>人数 <input id="people" type="number" min="1" max="50" value="4"></label><label>宿泊費（円）<input id="stay" type="number" min="0" value="40000"></label><label>交通費（円）<input id="transport" type="number" min="0" value="8000"></label><label>食費（円）<input id="food" type="number" min="0" value="12000"></label><label>その他（円）<input id="other" type="number" min="0" value="0"></label><button id="calculate">計算する</button><button id="export">CSV保存</button><div id="result" role="status" aria-live="polite"></div><p class="note">人数で均等割りし、端数は先頭の参加者から1円ずつ配分します。実際の請求額・予約条件は必ず確認してください。</p></main><script src="stay-group-expense-settlement.js"></script></body></html>
