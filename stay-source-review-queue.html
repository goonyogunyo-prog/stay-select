<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式掲載の再確認キュー｜STAY SELECT</title><meta name="description" content="公式掲載URLと確認日をもとに施設の再確認作業を整理する端末内ツール。"><link rel="stylesheet" href="assets/stay-source-review-queue.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>公式掲載の再確認キュー</h1><p>出典未設定・確認日が古い施設から、手動確認の優先順位を整理します。</p></div></header><main class="wrap"><section class="panel"><h2>施設を探す</h2><p id="status" role="status">施設データ読み込み中…</p><div class="stats" id="stats"></div><div class="filters"><label>施設名・県・出典URL・掲載元<input id="search" type="search" placeholder="例：福島県、旅館、観光協会"></label><label>確認優先度<select id="priority"><option value="all">すべて</option><option value="missing">出典URL未設定</option><option value="old">確認日30日超・未設定</option><option value="pending">未着手・要確認のみ</option></select></label><label>表示順<select id="sort"><option value="oldest">確認日が古い順</option><option value="name">施設名順</option></select></label></div><div class="actions"><button id="export" type="button">表示結果CSV</button><button id="notes" type="button">作業状態JSON</button><label class="import">作業状態JSON復元<input id="restore" type="file" accept="application/json,.json"></label></div><p class="hint">画面は最大100件ずつ表示。作業状態は最大500施設分をこの端末に保存します。出典や営業の正確性を自動確認する機能ではありません。</p><div id="list" class="list"></div><div class="pager"><button id="prev" type="button">前へ</button><span id="page"></span><button id="next" type="button">次へ</button></div></section><p class="hint">「確認済み」は利用者の作業メモであり、サイトの施設情報・確認日を更新しません。料金・空室・設備は未検証。予約CTA・成果リンク・自動公開はありません。</p></main><script src="assets/stay-source-review-queue.js" defer></script></body></html>
