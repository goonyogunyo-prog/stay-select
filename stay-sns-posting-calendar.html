<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="STAY SELECTのInstagram・TikTok投稿を施設別・日付別に整理。投稿自動実行や未確認の施設情報の断定はしません。"><title>SNS投稿カレンダー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-sns-posting-calendar.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>SNS投稿カレンダー</h1><p>投稿予定・公開済みを整理し、施設名・都道府県・公式掲載元を確認するための手動管理ツール</p></header><main><section><h2>投稿を登録</h2><div class="form"><label>宿を検索<input id="query" type="search" placeholder="施設名を入力" autocomplete="off"></label><label>施設<select id="hotel" size="5" aria-label="施設検索結果"></select></label><label>投稿日<input id="day" type="date"></label><label>媒体<select id="platform"><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select></label><label>状態<select id="state"><option value="planned">予定</option><option value="draft">下書き</option><option value="published">公開済み（手動記録）</option></select></label><label>投稿メモ<textarea id="memo" maxlength="500" rows="3" placeholder="撮影素材、企画の切り口、未確認事項など。個人情報は入力しないでください。"></textarea></label></div><div class="actions"><button id="add" type="button">予定に追加</button><button id="export-csv" type="button">CSV出力</button><button id="export-json" type="button">JSON出力</button><label class="upload">JSON復元<input id="import-json" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="secondary">全履歴を削除</button></div><p id="message" role="status" aria-live="polite"></p></section><section><h2>投稿一覧 <span id="count">0件</span></h2><div class="filters"><label>状態で絞り込み<select id="filter"><option value="all">すべて</option><option value="planned">予定</option><option value="draft">下書き</option><option value="published">公開済み</option></select></label></div><div id="rows" class="cards"></div></section><section><h2>ご利用前の注意</h2><p>投稿予定はこの端末のブラウザに保存されます。SNSへの自動投稿、予約、楽天アフィリエイトリンク発行、実際の閲覧・成果計測は行いません。料金・空室・設備・宿泊体験など未確認の情報を投稿文に断定しないでください。データの共有端末での利用にはご注意ください。</p></section></main><script src="assets/stay-sns-posting-calendar.js" defer></script></body></html>
