<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿を移動する日のチェックアウトから次のチェックインまでの空き時間を計算。移動・荷物・余裕・観光時間を記録してCSV/JSON出力。"><title>宿と宿の間の空き時間プランナー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-between-hotels-gap.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿と宿の間の空き時間プランナー</h1><p>連泊・宿替え当日の移動時間、荷物、立ち寄り予定をまとめて計算</p></header><main><p class="notice">チェックアウト・チェックイン時刻、移動所要時間、荷物預かり可否は自動取得しません。宿や交通機関の公式情報を確認して入力してください。予約操作・空室確認は行いません。</p><section class="panel"><h2>2つの宿を選ぶ</h2><p id="loaded" class="meta">施設データを読み込み中…</p><div class="fields"><label>前泊の宿を検索<input id="searchFrom" type="search" placeholder="前泊の宿名・県名" autocomplete="off"></label><label>前泊の宿<select id="from" aria-label="前泊の宿"><option value="">候補を選択</option></select></label><label>次泊の宿を検索<input id="searchTo" type="search" placeholder="次泊の宿名・県名" autocomplete="off"></label><label>次泊の宿<select id="to" aria-label="次泊の宿"><option value="">候補を選択</option></select></label></div></section><section class="panel"><h2>移動日の条件</h2><div class="fields"><label>前泊のチェックアウト日<input id="outDate" type="date"></label><label>前泊のチェックアウト時刻<input id="outTime" type="time" value="10:00"></label><label>次泊のチェックイン日<input id="inDate" type="date"></label><label>次泊のチェックイン可能時刻<input id="inTime" type="time" value="15:00"></label><label>宿間の移動時間（分）<input id="travel" type="number" min="0" max="2880" value="60"></label><label>荷物の預け入れ・受け取り（分）<input id="baggage" type="number" min="0" max="240" value="20"></label><label>余裕時間（分）<input id="buffer" type="number" min="0" max="240" value="30"></label><label>途中の観光・食事予定（分）<input id="visit" type="number" min="0" max="2880" value="90"></label><label>メモ<textarea id="note" rows="2" maxlength="400" placeholder="次の宿の荷物預かり条件など"></textarea></label></div><div class="actions"><button id="calc">空き時間を計算</button><button id="save" class="secondary">計画を保存（最大30件）</button></div><div id="result" class="result" role="status">宿と日付を選んで計算してください。</div></section><section class="panel"><h2>保存した宿替え計画</h2><p class="meta">この端末のlocalStorageに保存します。共有端末では保存内容にご注意ください。</p><div class="actions"><button id="csv" class="secondary">CSV出力</button><button id="json" class="secondary">JSON出力</button><label>JSONから復元<input id="import" type="file" accept="application/json,.json"></label></div><div id="saved" aria-live="polite"></div></section><p><a href="new-arrivals.html">新着38施設を見る</a> ／ <a href="index.html">トップへ戻る</a></p></main><script src="assets/stay-between-hotels-gap.js" defer></script></body></html>
