<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊先の夕食手配・ラストオーダー・近隣飲食店・買い出し代替案を手入力で比較。STAY SELECTの無料メモ。"><link rel="stylesheet" href="assets/stay-dinner-backup.css"><title>夕食・買い出しの代替案メモ｜STAY SELECT</title></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT トップ</a><h1>🍽️ 夕食・買い出しの代替案メモ</h1><p>全国5,725施設から宿を選び、到着が遅れたときの食事プランを最大8宿で比較</p></div></header><main class="wrap"><section class="notice"><strong>宿・店舗の営業時間や提供可否は自動取得しません。</strong> 記載内容は利用者の手入力です。宿泊先や店舗の最新案内を確認してください。楽天未照合施設の予約CTAはありません。</section><section class="panel"><h2>候補の宿を追加（最大8件）</h2><label for="search">宿泊施設名・都道府県で検索</label><input id="search" type="search" placeholder="例：白川郷の湯 / 岐阜県" autocomplete="off"><div id="resultInfo" role="status"></div><div id="results" class="results"></div></section><section class="panel"><div class="toolbar"><h2>食事の確保メモ <span id="count">0 / 8</span></h2><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="import" for="import">JSON復元</label><input type="file" id="import" accept="application/json,.json" hidden><button id="clear" type="button" class="muted">全件削除</button></div></div><p class="hint">入力は端末のブラウザに保存されます。保存できない場合はJSON出力を利用してください。飲食店や個人の連絡先などの機微情報は入力しないでください。</p><div id="cards" class="cards"></div><p id="status" role="status"></p></section></main><script src="assets/stay-dinner-backup.js" defer></script></body></html>
