<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国10621施設検索、ペット同伴旅行の準備と散歩・食事時刻の手動記録。最大4宿比較、CSV/JSON出力復元。"><title>ペット同伴・散歩と食事の準備メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-pet-daily-care.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>ペット同伴・散歩と食事の準備メモ</h1><p>宿ごとの受入条件と、ペットの1日の予定を整理</p></header><main><section class="panel"><h2>宿を選ぶ（最大4施設）</h2><label>全国10,621施設から検索<input id="search" autocomplete="off" placeholder="施設名・都道府県"></label><div id="results"></div><p id="notice" role="status"></p></section><section class="panel"><h2>ペットと宿の確認事項</h2><p class="muted">利用者自身の確認メモです。受入可否・犬種・頭数制限・追加料金・共用部ルールは必ず宿へ直接確認してください。</p><div class="fields"><label>ペットの呼び名<input id="petName" maxlength="60" placeholder="例：ココ"></label><label>頭数<input id="petCount" type="number" min="1" max="10" value="1"></label><label>宿の連絡先・公式案内<input id="contact" maxlength="180" placeholder="宿の電話や公式案内URL"></label><label>追加料金の確認メモ<input id="fee" maxlength="100" placeholder="例：宿に要確認"></label><label>朝の散歩<input id="walkAM" type="time" value="07:00"></label><label>朝の食事<input id="feedAM" type="time" value="08:00"></label><label>夕方の散歩<input id="walkPM" type="time" value="17:00"></label><label>夜の食事<input id="feedPM" type="time" value="18:00"></label></div><fieldset><legend>準備・受入チェック（手動記録）</legend><label><input type="checkbox" id="allowed"> 同伴条件・犬種・頭数を宿に確認</label><label><input type="checkbox" id="vaccination"> 必要な証明書・予防接種条件を確認</label><label><input type="checkbox" id="food"> 普段のフード・水・食器を準備</label><label><input type="checkbox" id="leash"> リード・トイレ用品・寝具を準備</label><label><input type="checkbox" id="common"> 共用部・散歩・留守番ルールを確認</label></fieldset><label>散歩ルート・注意事項<textarea id="memo" maxlength="600" placeholder="例：近隣の散歩場所は宿に確認"></textarea></label><div class="actions"><button id="preview">1日の予定を並べる</button><button id="save">選択した宿へ保存</button></div><div id="estimate" class="result" aria-live="polite"></div></section><section class="panel"><h2>宿ごとの準備状況（最大4件）</h2><div id="cards" class="cards"></div><div class="actions"><button id="exportCsv">CSV出力</button><button id="exportJson">JSON出力</button><label class="file">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="print">印刷</button><button id="clear" class="danger">全削除</button></div><p class="muted small">本機能は予約・設備・ペット同伴可否を自動判定しません。時刻は利用者入力を並べるだけで健康助言ではありません。個人情報・決済情報は入力しないでください。保存は端末内のみです。</p></section></main><script defer src="assets/stay-pet-daily-care.js"></script></body></html>
