<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レイトチェックアウト問い合わせ文作成｜STAY SELECT</title><link rel="stylesheet" href="stay-late-checkout-inquiry.css"></head><body><main><h1>レイトチェックアウト問い合わせ文作成</h1><p>宿への確認用メッセージを端末内で作成します。延長の可否・料金・予約は保証しません。送信は行いません。</p><label>宿泊施設名<input id="hotel" maxlength="120"></label><label>宿泊日<input id="date" type="date"></label><label>希望退出時刻<input id="time" type="time"></label><label>人数<input id="people" type="number" min="1" max="100" value="2"></label><button id="make">問い合わせ文を作成</button><label>作成結果<textarea id="result" rows="9" readonly></textarea></label><button id="copy">文章をコピー</button><p id="status" role="status"></p></main><script src="stay-late-checkout-inquiry.js"></script></body></html>
