<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="暖炉・薪ストーブの利用可否、薪代、消火時刻、換気、一酸化炭素警報器、子どもやペットの安全対策を宿泊候補ごとに手入力で比較。"><title>暖炉・薪ストーブ利用と安全確認メモ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-fireplace-safety.css"></head><body><header class="top"><a href="index.html">← STAY SELECT</a><h1>🔥 暖炉・薪ストーブ利用と安全確認メモ</h1><p>全国6,067施設から最大6宿を比較。薪代・利用ルール・消火・換気などを宿へ確認して記録できます。</p></header><main><section class="panel"><h2>宿泊候補を追加</h2><label for="query">施設名・都道府県で検索</label><input id="query" type="search" placeholder="例：山梨県 / コテージ" autocomplete="off"><p id="result-count" aria-live="polite"></p><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><div class="row"><h2>火の取り扱い・利用条件（最大6宿）</h2><span id="saved" role="status" aria-live="polite"></span></div><p class="notice"><strong>安全上の注意：</strong>暖炉や薪ストーブが実在するか、利用できるか、警報器や換気設備があるかを自動判定しません。必ず宿へ直接確認し、宿の指示と安全ルールを優先してください。保存先はこのブラウザ内のみです。</p><p class="progress-tip">進捗は「利用可否・着火消火手順・換気・最終消火」の4欄の記入状況であり、安全性の保証ではありません。</p><div id="cards" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを書き出す</button><button id="json" type="button">JSONを書き出す</button><label class="upload">JSONを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">全メモを削除</button></div></section><p><a href="new-arrivals.html">新着38施設を見る</a></p></main><script src="assets/stay-fireplace-safety.js" defer></script></body></html>
