<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊証明書・領収書・インボイスの発行依頼と受領状況を宿ごとに記録。宿泊施設の発行可否は利用者が確認する管理ツール。"><title>宿泊証明書・領収書依頼トラッカー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-stay-certificate-tracker.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿泊証明書・領収書依頼トラッカー</h1><p>旅行後の精算・出張報告に必要な書類の依頼状況を整理。発行可否、適格請求書対応、金額や期限は宿の公式案内で確認してください。</p></header><main><section class="panel"><h2>1. 宿泊施設を選ぶ</h2><p id="loaded" class="muted">施設データを読み込み中…</p><label for="query">宿名検索</label><input id="query" autocomplete="off" placeholder="施設名の一部を入力"><div id="candidates" aria-live="polite"></div><p id="selected" class="muted">施設未選択</p></section><section class="panel"><h2>2. 発行依頼の内容</h2><div class="fields"><label>書類種別<select id="docType"><option>宿泊証明書</option><option>領収書</option><option>適格請求書（インボイス）</option><option>宿泊税明細</option><option>その他</option></select></label><label>宿泊者名（任意）<input id="guest" maxlength="80" autocomplete="off"></label><label>チェックイン日<input id="checkin" type="date"></label><label>チェックアウト日<input id="checkout" type="date"></label><label>発行宛名（任意）<input id="addressee" maxlength="100"></label><label>提出期限（任意）<input id="deadline" type="date"></label><label>依頼状況<select id="status"><option>未依頼</option><option>依頼済</option><option>受領済</option><option>要修正</option><option>発行不可・要確認</option></select></label><label>確認日（任意）<input id="checked" type="date"></label><label>確認元URL（任意）<input id="source" type="url" placeholder="https://"></label><label>問い合わせ先（任意）<input id="contact" maxlength="160"></label></div><label>依頼・受領メモ<textarea id="memo" rows="3" maxlength="1000" placeholder="例：チェックアウト時にフロントへ依頼、電子領収書のダウンロード先を確認"></textarea></label><div class="actions"><button id="add">記録を追加（最大20件）</button><button id="clear" class="secondary">入力クリア</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>3. 依頼・受領の管理</h2><p class="muted">端末内保存（localStorage）。この端末以外には同期しません。個人情報を含むCSV/JSONの取り扱いに注意してください。</p><div id="summary" class="summary"></div><div id="records" class="records"></div><div class="actions"><button id="exportCsv">CSV出力</button><button id="exportJson">JSON出力</button><button id="print" class="secondary">印刷</button></div><label>JSON復元<input id="importJson" type="file" accept=".json,application/json"></label></section><footer><a href="index.html">STAY SELECTに戻る</a> ／ <a href="new-arrivals.html">新着施設</a></footer></main><script defer src="assets/stay-stay-certificate-tracker.js"></script></body></html>
