<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミニバー・有料備品の精算チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-minibar-settlement.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>ミニバー・有料備品の精算チェック</h1><p>宿の有料飲料・備品を利用者が記録し、チェックアウト時の請求と照合するためのメモです。</p></header><main><p class="notice">掲載施設のミニバー有無、販売価格、税込区分、利用規約、請求額は自動取得・検証しません。価格はご自身で宿に確認してください。記録はこの端末内にのみ保存されます。</p><section class="panel"><h2>宿を検索して明細を登録</h2><label>施設名検索<input id="query" type="search" placeholder="宿名を入力" autocomplete="off"></label><label>宿泊施設<select id="stay" aria-label="施設を選択"><option value="">宿を検索してください</option></select></label><div class="fields"><label>利用品目<input id="item" maxlength="90" placeholder="例：冷蔵庫の飲料" required></label><label>数量<input id="qty" type="number" min="1" max="100" value="1"></label><label>確認した税込単価（円）<input id="unit" type="number" min="0" max="1000000" value="0"></label><label>宿の請求額（円・任意）<input id="billed" type="number" min="0" max="1000000" placeholder="未確認は空欄"></label><label>照合状況<select id="status"><option value="未照合">未照合</option><option value="照合済み">照合済み</option><option value="要確認">要確認</option></select></label><label>確認メモ<input id="memo" maxlength="220" placeholder="例：料金表を撮影、受付へ確認"></label></div><button id="add">明細を追加</button><p id="feedback" role="status"></p></section><section class="panel"><h2>明細と差額</h2><p id="summary">登録0件</p><div class="tablewrap"><table><thead><tr><th>施設</th><th>品目</th><th>数量</th><th>税込見込</th><th>請求</th><th>差額</th><th>状況</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="filelabel">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="print">印刷</button></div></section><p><a href="new-arrivals.html">新着38施設を見る</a> ／ <a href="index.html">トップへ</a></p></main><script src="assets/stay-minibar-settlement.js" defer></script></body></html>
