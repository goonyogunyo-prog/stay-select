<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>忘れ物の問い合わせ・返送確認メモ｜STAY SELECT</title><meta name="description" content="宿泊先の忘れ物に関する問い合わせ・返送確認を自分で記録する。宿の対応を保証する機能ではありません。"><link rel="stylesheet" href="assets/stay-lost-item-followup.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>忘れ物の問い合わせ・返送確認メモ</h1><p>宿に確認した内容を自分で記録するための個人用メモ。宿泊施設の忘れ物保管や返送サービスを自動判定しません。</p></header><main><section class="box"><h2>施設を探す</h2><p>検索対象 <strong id="total">読込中</strong> 件</p><label>施設名・県名で検索<input id="q" type="search" placeholder="例：旅館、北海道"></label><div id="results" class="results" aria-live="polite"></div></section><section class="box"><h2>確認メモ <span id="count">0</span>/100</h2><p class="notice">個人情報・予約番号・住所・追跡番号・貴重品の詳細は記録しないでください。データはこのブラウザに保存されます。共有端末では利用しないでください。</p><div class="actions"><button id="csv">CSV出力</button><button id="json">JSON出力</button><label class="import">JSON復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear" class="danger">全件削除</button></div><div id="items"></div><p id="message" role="status"></p></section><p><a href="new-arrivals.html">新着施設一覧</a> ／ <a href="index.html">トップに戻る</a></p></main><script src="assets/stay-lost-item-followup.js" defer></script></body></html>
