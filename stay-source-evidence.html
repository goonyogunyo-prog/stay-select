<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>公式出典の再確認キュー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-source-evidence.css"><script defer src="assets/stay-source-evidence.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a> ／ <a href="new-arrivals.html">新着施設</a></nav><h1>公式出典の再確認キュー</h1><p class="intro">宿泊施設の公式掲載元を探し、確認が必要なデータを整理できます。<strong>掲載記録は現在の営業・空室・料金・設備・予約可否を保証しません。</strong> 楽天検索URLは予約URLではありません。入力内容は外部送信しません。</p><div class="controls"><input id="search" aria-label="施設名・出典・IDを検索" placeholder="施設名・出典・IDで検索"><select id="pref" aria-label="都道府県"><option value="">全国</option></select><select id="mode" aria-label="確認条件"><option value="all">すべて</option><option value="missing">公式掲載URLなし</option><option value="own">宿独自公式本文未取得</option><option value="date">確認日2026年9月以前・未記載</option></select><button type="button" id="export">絞込結果CSVを保存</button></div><p id="summary" class="summary" aria-live="polite">読み込み中…</p><section id="results" class="list" aria-label="宿泊施設一覧"></section><p class="foot">端末内検索・CSV出力専用。GitHub書込・自動公開・予約CTA・成果URL発行なし。CSVは公式掲載情報の再確認用です。</p></main></body></html>
