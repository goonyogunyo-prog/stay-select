<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊施設ごとに清掃・片付けの担当者と完了状況を記録する利用者入力のチェック表。"><title>清掃・片付け担当表｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-chore-rota.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>滞在中の清掃・片付け担当表</h1><p>一棟貸し・コテージ・グループ旅行で、誰が何を片付けるかを見える化。</p></header><main><section class="panel"><h2>施設を選択</h2><p>全国 <strong id="total">—</strong> 施設から最大4宿を比較できます。</p><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：長崎県 民宿"><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>担当・完了状況</h2><p class="hint">下記8項目は一般的な例です。実際の清掃義務やルールは宿ごとに異なります。必ず施設の公式案内・問い合わせで確認し、不要な項目は担当欄を空にしてください。担当や完了状況は自動判定しません。</p><div id="cards" class="cards" aria-live="polite"></div></section><section class="panel"><h2>データ保存・共有</h2><p>入力はこのブラウザ内に保存されます。個人名を入力する場合は共有端末にご注意ください。CSVやJSONに書き出せます。</p><div class="actions"><button id="save">保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="secondary">全件消去</button></div><p id="status" role="status"></p></section><p><a href="index.html">トップに戻る</a></p></main><script src="assets/stay-chore-rota.js" defer></script></body></html>
