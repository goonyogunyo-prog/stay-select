<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>チェックイン締切までの移動余裕を計算｜STAY SELECT</title><meta name="description" content="宿のチェックイン締切と交通機関の到着予定から、移動時間と遅延を見込んだ余裕を計算。端末内で試算しCSV保存できます。"><link rel="stylesheet" href="stay-checkin-buffer.css"></head><body><main><a href="index.html">← STAY SELECT</a><h1>チェックイン締切までの移動余裕を計算</h1><p>宿の受付締切に間に合うか、到着予定・宿までの移動・遅延想定から2つの経路を比較できます。</p><p class="notice">このページは手入力による試算です。交通機関の運行情報、施設の実際の受付時間、道路事情は取得しません。遅れる可能性がある場合は宿へ直接ご連絡ください。予約・外部送信は行いません。</p><label>宿のチェックイン締切（宿の案内を確認して入力）<input id="deadline" type="datetime-local" value="2026-11-14T21:00"></label><div class="grid"><section><h2>経路A</h2><label>駅・港・空港などへの到着予定<input id="a-arrive" type="datetime-local" value="2026-11-14T18:00"></label><label>宿までの移動時間（分）<input id="a-transfer" type="number" min="0" max="1440" step="1" value="90"></label><label>想定遅延（分）<input id="a-delay" type="number" min="0" max="1440" step="1" value="30"></label></section><section><h2>経路B</h2><label>駅・港・空港などへの到着予定<input id="b-arrive" type="datetime-local" value="2026-11-14T19:00"></label><label>宿までの移動時間（分）<input id="b-transfer" type="number" min="0" max="1440" step="1" value="45"></label><label>想定遅延（分）<input id="b-delay" type="number" min="0" max="1440" step="1" value="30"></label></section></div><div class="actions"><button id="calculate" type="button">余裕を計算</button><button id="download" type="button">CSV保存</button></div><div id="result" role="status" aria-live="polite"></div><p class="fine">余裕が0分以下なら締切に間に合わない試算です。余裕があっても運休・渋滞・受付変更を保証するものではありません。宿の連絡先やチェックイン締切は予約確認書などの一次情報を優先してください。</p></main><script src="stay-checkin-buffer.js" defer></script></body></html>
