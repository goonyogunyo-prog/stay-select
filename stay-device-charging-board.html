<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旅行先のスマホ・カメラなどの充電予定を、宿泊施設とコンセント番号別に整理する利用者入力ボード。設備情報は自動判定しません。"><title>機器充電・コンセント順番ボード｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-device-charging-board.css"></head><body>
<header><a href="index.html">← STAY SELECT</a><h1>機器充電・コンセント順番ボード</h1><p>グループ旅行でスマホ・カメラ・モバイルバッテリーの充電時間を整理。コンセントの取り合いを減らそう。</p></header>
<main><section class="panel"><h2>宿泊先を選ぶ</h2><label>施設名・都道府県で検索<input id="stay-search" placeholder="例：民宿、三重県、四万十"></label><label>候補（先頭100件）<select id="stay-select" aria-label="宿泊施設候補"></select></label><button id="stay-add" type="button">この宿を設定</button><p id="stay-chosen" aria-live="polite">宿泊先：未設定</p><p id="stay-count" class="hint"></p></section>
<section class="panel"><h2>充電枠を登録</h2><form id="charge-form"><div class="fields"><label>機器・持ち主（必須）<input id="device-name" maxlength="90" required placeholder="例：Aさんのスマホ"></label><label>充電開始（予定）<input id="charge-start" type="datetime-local" required></label><label>必要時間（分）<input id="charge-minutes" type="number" min="1" max="1440" value="90" required></label><label>コンセント番号（利用者が仮に割り当て）<input id="socket-number" type="number" min="1" max="12" value="1" required></label><label>優先度<select id="charge-priority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></label></div><label>備考（必要な充電器、コンセント形状など）<textarea id="charge-note" maxlength="400"></textarea></label><button type="submit">充電枠を追加</button></form></section>
<section class="panel"><h2>充電スケジュール</h2><p id="summary" aria-live="polite">読み込み中</p><div class="actions"><button id="csv-export" type="button">CSV出力</button><button id="json-export" type="button">JSONバックアップ</button><label class="import-label">JSON復元<input id="json-import" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="danger">全件削除</button></div><div id="charge-list" class="list"></div></section>
<section class="panel caution"><h2>注意事項</h2><p>コンセントの個数、利用可否、電圧・電流、充電速度、延長コードの使用可否は自動判定しません。宿泊施設の案内・電気製品の定格を必ず確認してください。たこ足配線、過負荷、発熱、濡れた場所での使用は避けてください。重複警告は入力した開始時刻と所要時間に基づく計算のみです。</p></section></main><script src="assets/stay-device-charging-board.js" defer></script></body></html>
