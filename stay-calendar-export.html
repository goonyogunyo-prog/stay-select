<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="description" content="宿泊予定をiCalendar形式で端末内生成。予約・外部送信なし。"><title>宿泊予定をカレンダーへ｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-calendar-export.css"></head><body><main><a href="index.html" class="back">← STAY SELECT</a><p class="eyebrow">OFFLINE TRIP TOOL</p><h1>宿泊予定をカレンダーへ</h1><p>予約済みの宿泊内容を自分で入力し、カレンダーに取り込める .ics ファイルを端末内で作成します。宿泊予約・空室確認・外部送信は行いません。</p><form id="stayForm"><label>施設名<input id="hotel" required maxlength="120" placeholder="宿泊施設名"></label><div class="pair"><label>チェックイン日<input id="inDate" type="date" required></label><label>チェックイン時刻<input id="inTime" type="time" value="15:00" required></label></div><div class="pair"><label>チェックアウト日<input id="outDate" type="date" required></label><label>チェックアウト時刻<input id="outTime" type="time" value="10:00" required></label></div><label>予約番号・メモ（任意）<textarea id="memo" rows="3" maxlength="1000" placeholder="予約番号など。機密情報の入力は避けてください"></textarea></label><button type="submit">.icsファイルを作成</button></form><p id="status" role="status" aria-live="polite"></p><p class="caution">日時は日本標準時（JST）としてUTCに変換します。端末やカレンダーの設定により表示が異なる場合があります。宿の公式予約確認メールと必ず照合してください。</p></main><script src="assets/stay-calendar-export.js" defer></script></body></html>
