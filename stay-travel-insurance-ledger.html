<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊旅行の保険や補償の適用条件を、利用者が公式約款で確認して記録する台帳"><title>旅行保険・補償条件の確認台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-travel-insurance-ledger.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>旅行保険・補償条件の確認台帳</h1><p>宿泊旅行の補償条件・確認日時・問い合わせ先を自分で記録する。</p></div></header><main class="wrap"><p class="notice"><strong>保険の加入・適用・支払可否を判定する機能ではありません。</strong> 必ず保険会社・予約先の最新約款と公式案内を確認してください。証券番号・住所・健康情報などの個人情報は入力しないでください。データは利用中のブラウザに保存します。</p><section class="panel"><h2>確認記録を追加</h2><form id="entry"><label>宿泊先を検索<input id="stay-search" type="search" autocomplete="off" placeholder="施設名・都道府県" required></label><div id="search-results" class="results" aria-live="polite"></div><p id="selected" class="selected">宿泊先未選択</p><div class="fields"><label>旅行開始日<input id="trip-date" type="date" required></label><label>確認先（保険会社・予約先など）<input id="provider" maxlength="100" required placeholder="例：加入済み保険の窓口"></label><label>確認日<input id="confirmed-date" type="date" required></label><label>約款・公式案内URL（任意）<input id="source-url" type="url" maxlength="500" placeholder="https://..."></label><label>補償範囲（利用者による確認結果）<select id="coverage"><option value="未確認">未確認</option><option value="対象の可能性・要照会">対象の可能性・要照会</option><option value="対象外と案内">対象外と案内</option><option value="対象と案内・要条件確認">対象と案内・要条件確認</option></select></label><label>連絡方法メモ（個人情報は不可）<input id="contact" maxlength="120" placeholder="例：公式問い合わせフォーム"></label></div><h2>約款で確認した項目</h2><div class="checks"><label><input type="checkbox" value="cancel">旅行取消の補償</label><label><input type="checkbox" value="delay">交通遅延・欠航</label><label><input type="checkbox" value="baggage">手荷物の損害</label><label><input type="checkbox" value="medical">旅行中の治療費</label><label><input type="checkbox" value="disaster">自然災害時の扱い</label><label><input type="checkbox" value="exclusion">免責・対象外条件</label><label><input type="checkbox" value="claim">請求期限・必要書類</label><label><input type="checkbox" value="contact">事故時の連絡先</label></div><label>確認メモ（個人情報は不可）<textarea id="memo" rows="3" maxlength="600" placeholder="確認した条件・問い合わせ事項のみ"></textarea></label><button type="submit">確認記録を保存</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><div class="toolbar"><h2>記録 <span id="count">0</span>/30件</h2><div><button type="button" id="csv">CSV出力</button><button type="button" id="json">JSON出力</button><label class="file-label">JSON復元<input type="file" id="import" accept=".json,application/json"></label></div></div><p class="muted">チェックは利用者が公式約款等を確認した記録であり、補償が有効であることを示しません。</p><div id="plans" class="cards" aria-live="polite"></div></section></main><script src="assets/stay-travel-insurance-ledger.js" defer></script></body></html>
