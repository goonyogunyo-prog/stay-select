<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿までの路線バス・フェリー・タクシーなどの交通系IC利用可否と現金準備額を、利用者自身の確認情報から整理する無料ノート。"><title>現地交通の支払い準備｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-local-fare-payment.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>現地交通の支払い準備ノート</h1><p>バス・フェリー・タクシーの「ICが使える？」「現金はいくら？」を整理</p></header><main><section class="panel"><h2>宿泊先を検索</h2><label>施設名・都道府県 <input id="staySearch" type="search" placeholder="例：八雲・温泉・宿名"></label><select id="staySelect" aria-label="宿泊先"><option value="">宿泊先を選択</option></select><p id="stayCount" role="status">読み込み中…</p><p class="note">交通機関の運賃・IC対応は自動取得しません。運行会社・自治体等の公式案内で確認し、結果を入力してください。カード番号や個人情報は記録しないでください。</p></section><section class="panel"><h2>移動区間を追加</h2><form id="legForm"><div class="formgrid"><label>移動区間・交通手段 <input id="legName" required maxlength="100" placeholder="例：駅→宿の路線バス"></label><label>確認した支払方法 <select id="payType"><option value="未確認">未確認</option><option value="現金のみと確認">現金のみと確認</option><option value="交通系IC対応を確認">交通系IC対応を確認</option><option value="その他決済を確認">その他決済を確認</option></select></label><label>用意する現金（円） <input id="cashYen" type="number" min="0" max="1000000" value="0" step="1"></label><label>確認先・確認日 <input id="checkedSource" maxlength="180" placeholder="例：運行会社公式 10/27"></label><label class="wide">メモ <input id="legNote" maxlength="250" placeholder="小銭が必要／最終便など"></label></div><button type="submit">区間を追加</button></form></section><section class="panel"><h2>確認状況</h2><p id="summary" class="summary" role="status">区間 0件</p><div class="actions"><button id="exportCSV" type="button">CSV出力</button><button id="exportJSON" type="button">JSONバックアップ</button><label class="filebutton">JSON復元 <input id="importJSON" type="file" accept=".json,application/json"></label><button id="clearAll" type="button" class="subtle">一覧を消去</button></div><div id="legList" class="list"></div></section><p class="note">このツールは旅行準備のための自己記録です。決済方法や料金、運行状況を保証せず、予約・決済は行いません。ブラウザのデータ削除で記録が消えるため、必要に応じてJSONを保存してください。</p></main><script src="assets/stay-local-fare-payment.js" defer></script></body></html>
