<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>到着時刻・チェックイン余裕時間メモ | STAY SELECT</title><link rel="stylesheet" href="stay-arrival-buffer-check.css"></head><body><main><h1>到着時刻・チェックイン余裕時間メモ</h1><p>施設の受付終了時刻と移動予定から、到着までの余裕を計算します。実際の受付規定は宿泊施設に確認してください。</p><label>宿泊日 <input id="day" type="date"></label><label>予定到着時刻 <input id="arrival" type="time" value="18:00"></label><label>受付終了時刻 <input id="cutoff" type="time" value="21:00"></label><label>移動遅延の見込み（分） <input id="delay" type="number" min="0" max="1440" value="30"></label><label>希望する余裕（分） <input id="margin" type="number" min="0" max="1440" value="30"></label><button id="calc">確認する</button><output id="result" aria-live="polite"></output><button id="csv">結果をCSV保存</button><p class="note">同一宿泊日の時刻のみ比較します。日付をまたぐ到着や翌朝受付には対応していません。入力内容は送信しません。</p></main><script src="stay-arrival-buffer-check.js"></script></body></html>
