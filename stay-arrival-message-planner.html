<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国10,659施設から宿を検索。到着予定時刻、交通手段、人数、事前確認事項を整理し、宿への連絡文を作成。自動送信はしません。"><title>宿への到着予定・事前連絡文作成｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-arrival-message-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿への到着予定・事前連絡文作成</h1><p>到着時間や確認事項を整理して、宿に送る文章を作る</p></header><main><section class="panel"><h2>宿を選ぶ（最大4施設）</h2><label>全国10,659施設から検索<input id="search" autocomplete="off" placeholder="宿の名前・都道府県"></label><div id="results"></div><p id="notice" role="status"></p></section><section class="panel"><h2>連絡する内容</h2><p class="muted">施設の連絡先・チェックイン規定・サービスを自動判定しません。予約済みかどうかも自動判定しません。文面を確認してから、利用者が宿へ送信してください。</p><div class="fields"><label>宿泊予定日<input id="date" type="date"></label><label>到着予定時刻<input id="arrival" type="time" value="17:00"></label><label>宿泊人数<input id="guests" type="number" min="1" max="30" value="2"></label><label>交通手段<select id="transport"><option value="電車">電車</option><option value="車">車</option><option value="バス">バス</option><option value="徒歩・その他">徒歩・その他</option></select></label><label>宿への連絡先・確認済みURL<input id="contact" maxlength="180" placeholder="宿の公式連絡先を自分で確認"></label><label>差出人の名前（任意）<input id="sender" maxlength="60" placeholder="例：山田"></label></div><fieldset><legend>事前に確認したい内容（複数可）</legend><label><input id="late" type="checkbox"> 到着遅延時の連絡方法</label><label><input id="parking" type="checkbox"> 駐車場・車の乗り入れ</label><label><input id="luggage" type="checkbox"> チェックイン前の荷物預かり</label><label><input id="dinner" type="checkbox"> 夕食の最終受付時刻</label><label><input id="pickup" type="checkbox"> 駅からの送迎の有無</label></fieldset><label>その他の確認事項<textarea id="memo" maxlength="500" placeholder="例：食事の時間を事前に確認したい"></textarea></label><div class="actions"><button id="preview" type="button">連絡文を作成</button><button id="save" type="button">この宿のメモを保存</button><button id="copy" type="button">連絡文をコピー</button></div><label>連絡文プレビュー<textarea id="message" readonly rows="9" aria-label="連絡文プレビュー"></textarea></label></section><section class="panel"><h2>保存した宿の連絡メモ</h2><div class="actions"><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSON出力</button><label class="file">JSON復元<input id="import" type="file" accept="application/json,.json"></label></div><div id="cards" class="cards"></div></section><p class="muted small">入力内容は利用者の端末内にのみ保存されます（ブラウザの保存設定に依存）。施設への送信や予約は実行しません。料金・営業・空室・設備・楽天トラベル個別掲載は未確認。</p></main><script src="assets/stay-arrival-message-planner.js" defer></script></body></html>
