<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="雪道・冬期の宿アクセスを公式案内で確認し、冬タイヤ、チェーン、送迎、通行止めなどを宿ごとに整理するチェックツール。"><title>雪道・冬期アクセス確認ボード｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-winter-road-check.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>雪道・冬期アクセス確認ボード</h1><p>宿への冬期移動で確認すべき項目を整理。積雪・道路規制・送迎の可否を自動判定するものではありません。必ず宿・道路管理者・交通機関の最新公式情報を確認してください。</p></header><main><section class="panel"><h2>1. 宿泊施設を選ぶ</h2><p id="loaded" class="muted">全施設データを読み込み中…</p><label for="query">宿名検索</label><input id="query" autocomplete="off" placeholder="施設名の一部"><div id="candidates" aria-live="polite"></div><p id="selected" class="muted">施設未選択</p></section><section class="panel"><h2>2. 冬期アクセス確認メモ</h2><div class="fields"><label>訪問予定日<input id="visit" type="date"></label><label>道路の積雪・凍結<select id="road"><option>未確認</option><option>注意が必要</option><option>問題なしと確認</option><option>通行困難・要再検討</option></select></label><label>冬タイヤの必要性<select id="tires"><option>未確認</option><option>必要と案内あり</option><option>不要と案内あり</option><option>利用者が確認予定</option></select></label><label>チェーンの必要性<select id="chains"><option>未確認</option><option>必要と案内あり</option><option>不要と案内あり</option><option>利用者が確認予定</option></select></label><label>通行止め・冬期閉鎖<select id="closure"><option>未確認</option><option>規制あり</option><option>規制なしと確認</option><option>代替経路を要確認</option></select></label><label>駐車場の除雪<select id="parking"><option>未確認</option><option>要問い合わせ</option><option>対応を確認</option><option>車利用なし</option></select></label><label>駅・バス停からの送迎<select id="shuttle"><option>未確認</option><option>要予約</option><option>利用可能と確認</option><option>利用不可と確認</option><option>利用しない</option></select></label><label>公共交通の運休可能性<select id="transit"><option>未確認</option><option>注意が必要</option><option>運行を確認</option><option>車利用</option></select></label><label>最終確認日<input id="checked" type="date"></label><label>公式確認元URL<input id="source" type="url" placeholder="https://"></label></div><label>代替ルート・問い合わせメモ<textarea id="memo" maxlength="1000" rows="3" placeholder="例：出発前に道路情報・送迎時刻を再確認"></textarea></label><div class="actions"><button id="add">比較リストに追加（最大4宿）</button><button id="clear" class="secondary">入力クリア</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>3. 最大4宿の確認状況</h2><p class="muted">記録はこの端末のlocalStorageに保存されます。道路状況のリアルタイム情報ではありません。CSV/JSONは自分で保管してください。</p><div id="summary" class="summary"></div><div id="records"></div><div class="actions"><button id="exportCsv">CSV出力</button><button id="exportJson">JSON出力</button><button id="print" class="secondary">印刷</button></div><label for="importJson">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label></section><footer><a href="index.html">STAY SELECTに戻る</a> ／ <a href="new-arrivals.html">新着38施設</a></footer></main><script defer src="assets/stay-winter-road-check.js"></script></body></html>
