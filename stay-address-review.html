<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設所在地の差分レビュー｜STAY SELECT</title><meta name="description" content="公式観光協会と宿運営元の住所・名称の一致や保留理由を整理する確認ツール"><link rel="stylesheet" href="stay-address-review.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿泊施設の所在地・名称 差分レビュー</h1><p>公式観光協会と宿運営元の掲載を比較。名称変更・別館・住所違いを確認し、未確定施設の二重登録を防ぐためのチェックです。営業・空室・料金は確認しません。</p></header><main><section><div class="filters"><label>施設名で検索<input id="search" type="search" placeholder="例：こうじや"></label><label>状態<select id="status"><option value="">すべて</option><option>掲載採用</option><option>保留・所在地表記差</option><option>保留・掲載鮮度</option></select></label></div><p id="count" aria-live="polite"></p><button id="csv" type="button">表示中をCSV出力</button><div id="rows" aria-live="polite"></div></section><p class="warning">「掲載採用」は予約可能を意味しません。保留は自動登録しません。端末内の確認チェックはGitHubにも外部サーバーにも送信されません。</p><a href="stay-official-crosscheck.html">既存の公式出典照合ツール</a></main><script src="stay-address-review.js" defer></script></body></html>
