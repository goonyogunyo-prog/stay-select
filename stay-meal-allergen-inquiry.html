<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿泊施設の食事に関するアレルゲン・調理環境の確認事項を2施設分整理。端末内で文章とCSVを生成。"><title>宿の食事・アレルゲン確認メモ｜STAY SELECT</title><link rel="stylesheet" href="stay-meal-allergen-inquiry.css"></head><body><header><a href="index.html">STAY SELECT</a><a href="new-arrivals.html">新着施設</a></header><main><h1>宿の食事・アレルゲン確認メモ</h1><p>食事を予約する前に施設へ確認したい項目を、2候補分の問い合わせメモに整理します。施設へ自動送信しません。<strong>このツールはアレルギー対応可否や食事の安全性を判定しません。</strong></p><form id="memo-form"><section><h2>確認したいこと</h2><label>対象の食材・成分（任意、個人名や医療情報は入力しない）<input id="ingredient" maxlength="100" placeholder="例：卵・乳・小麦"></label><label>確認する食事<select id="meal"><option value="朝食">朝食</option><option value="夕食">夕食</option><option value="朝夕食">朝夕食</option></select></label><label><input id="utensils" type="checkbox" checked> 調理器具・油・盛り付け器具の共用を確認</label><label><input id="ingredients" type="checkbox" checked> 原材料・調味料・仕入れ変更の可能性を確認</label><label><input id="alternatives" type="checkbox" checked> 代替食・食事持ち込みの可否を確認</label><label><input id="deadline" type="checkbox" checked> 事前連絡期限と当日の対応窓口を確認</label></section><div class="grid"><section><h2>施設A</h2><label>施設名<input id="nameA" maxlength="80" value="施設A"></label><label>回答メモ（端末内・任意）<textarea id="replyA" maxlength="300" rows="3"></textarea></label></section><section><h2>施設B</h2><label>施設名<input id="nameB" maxlength="80" value="施設B"></label><label>回答メモ（端末内・任意）<textarea id="replyB" maxlength="300" rows="3"></textarea></label></section></div><button type="submit">確認メモを作成</button><button type="button" id="csv">CSV保存</button><button type="button" id="copy">文章をコピー</button></form><div id="error" role="alert" aria-live="assertive"></div><section><h2>問い合わせ用メモ</h2><pre id="result" aria-live="polite">項目を入力して「確認メモを作成」を押してください。</pre></section><p class="note">重要：重篤なアレルギー等の判断は施設の担当者と医療専門家へ直接確認してください。食材の不使用・交差接触防止は保証されません。個人名・診断情報は入力しないでください。入力内容はこの端末内のみで処理し、予約・決済・外部送信をしません。</p></main><script src="stay-meal-allergen-inquiry.js"></script></body></html>
