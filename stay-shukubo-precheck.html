<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿坊予約前の確認カード｜STAY SELECT</title><meta name="description" content="宿坊の宿泊可否、食事、朝勤行、門限、浴室など未確認事項を整理して問い合わせ文とCSVを作る。"><link rel="stylesheet" href="assets/stay-shukubo-precheck.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>宿坊予約前の確認カード</h1><p>公式掲載は予約受付・営業・設備の保証ではありません。確認したい項目を選び、問い合わせ文を作成します。</p></header><main><section class="panel"><label for="search">宿坊・施設名を検索</label><input id="search" type="search" placeholder="例：報恩院 / 高野山"><select id="stay" aria-label="施設を選択"><option value="">施設データ読み込み中…</option></select><p id="status" role="status"></p></section><section class="panel"><h2>確認する項目</h2><div id="questions" class="questions"></div><label for="date">宿泊希望日（任意）</label><input id="date" type="date"><label for="people">人数（任意）</label><input id="people" type="number" min="1" max="99" value="2"><label for="memo">追加の質問（任意）</label><textarea id="memo" rows="3" placeholder="例：車椅子での利用について"></textarea><button id="generate">問い合わせ文を作成</button></section><section class="panel"><h2>問い合わせ文（送信は手動）</h2><textarea id="output" rows="10" readonly></textarea><div class="actions"><button id="copy">文章をコピー</button><button id="save">確認カードを端末保存</button><button id="export">保存済みCSV出力</button></div><p id="savedStatus"></p></section><section class="panel"><h2>保存済みの確認カード</h2><div id="savedList"></div><p>端末内に最大300件保存します。施設への自動送信・予約・料金照合・成果URL発行は行いません。</p></section></main><script src="assets/stay-shukubo-precheck.js" defer></script></body></html>
