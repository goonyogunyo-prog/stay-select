<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>到着・チェックイン余裕時間プランナー｜STAY SELECT</title><link rel="stylesheet" href="stay-checkin-buffer-planner.css"></head><body><header><a href="index.html">STAY SELECT</a></header><main><h1>到着・チェックイン余裕時間プランナー</h1><p>2つの宿泊候補について、移動・休憩・遅延の余裕を含めた到着見込みを比較します。時刻は同日内の簡易試算です。施設のチェックイン条件は必ず直接確認してください。</p><form id="plan"><label>出発時刻 <input id="departure" type="time" value="14:00" required></label><label>予備時間（分） <input id="buffer" type="number" min="0" max="600" value="30" required></label><section><h2>候補A</h2><label>名称 <input id="nameA" maxlength="80" value="候補A"></label><label>移動時間（分） <input id="travelA" type="number" min="0" max="1440" value="120" required></label><label>途中休憩（分） <input id="restA" type="number" min="0" max="600" value="15" required></label><label>最終チェックイン時刻 <input id="limitA" type="time" value="18:00" required></label></section><section><h2>候補B</h2><label>名称 <input id="nameB" maxlength="80" value="候補B"></label><label>移動時間（分） <input id="travelB" type="number" min="0" max="1440" value="150" required></label><label>途中休憩（分） <input id="restB" type="number" min="0" max="600" value="20" required></label><label>最終チェックイン時刻 <input id="limitB" type="time" value="18:00" required></label></section><button type="submit">比較する</button><button type="button" id="download">結果CSVを保存</button></form><div id="result" aria-live="polite"></div><p class="note">交通状況、施設の実際の受付締切、日付をまたぐ移動には対応しません。計算・CSV作成は端末内で行い、予約・外部送信はしません。</p></main><script src="stay-checkin-buffer-planner.js" defer></script></body></html>
