<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>離島の乗り継ぎ・送迎メモ｜STAY SELECT</title><meta name="description" content="フェリー・飛行機・送迎の時刻と乗り継ぎ余裕を自分で確認し比較。運行情報・空席は自動取得しません。"><link rel="stylesheet" href="assets/stay-island-transfer-planner.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>離島の乗り継ぎ・送迎メモ</h1><p>飛行機・フェリー・港から宿への送迎を、公式情報を確認しながら整理するための個人用ツールです。</p></header><main><section class="panel"><h2>宿泊先を探す</h2><label>施設名・都道府県 <input id="stay-search" placeholder="例：種子島、民宿、北海道"></label><select id="stay-select" aria-label="施設候補"></select><button id="stay-add">この宿を旅程に設定</button><p id="stay-chosen" aria-live="polite">宿泊先未設定</p><small>掲載9,025施設を検索。設備や送迎の有無を自動判定しません。</small></section><section class="panel"><h2>乗り継ぎ区間を登録</h2><form id="leg-form"><div class="grid"><label>交通手段<select name="mode"><option>フェリー</option><option>飛行機</option><option>バス</option><option>送迎車</option><option>レンタカー</option><option>その他</option></select></label><label>出発地<input name="from" required maxlength="90" placeholder="例：鹿児島港"></label><label>到着地<input name="to" required maxlength="90" placeholder="例：西之表港"></label><label>出発日時<input type="datetime-local" name="departure" required></label><label>到着日時<input type="datetime-local" name="arrival" required></label><label>予約・確認状況<select name="status"><option>未確認</option><option>時刻確認済み</option><option>予約手続き済み</option></select></label><label>必要な乗り継ぎ余裕（分）<input type="number" name="buffer" min="0" max="1440" value="60" required></label><label>確認元・メモ<input name="note" maxlength="180" placeholder="例：運航会社の公式時刻表を確認"></label></div><button type="submit">区間を追加（最大12）</button></form><p class="warning">※便の時刻、運休、送迎、空席、予約の成立は自動確認しません。予約前に運航会社と宿へ直接確認してください。</p></section><section class="panel"><h2>乗り継ぎチェック</h2><p id="summary" aria-live="polite">区間を追加すると乗り継ぎ余裕を計算します。</p><div class="scroll"><table><thead><tr><th>区間</th><th>日時</th><th>状態</th><th>次区間まで</th><th>操作</th></tr></thead><tbody id="legs"></tbody></table></div></section><section class="panel"><h2>データ保存・持ち出し</h2><div class="actions"><button id="save" type="button">ブラウザに保存</button><button id="export-csv" type="button">CSV出力</button><button id="export-json" type="button">JSONバックアップ</button><label>JSON復元 <input type="file" id="import-json" accept=".json,application/json"></label><button id="clear" type="button">入力を消去</button></div><p id="message" role="status"></p><small>このブラウザ内の保存領域を利用します。共用端末では入力を消去してください。</small></section></main><script src="assets/stay-island-transfer-planner.js" defer></script></body></html>
