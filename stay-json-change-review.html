<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設JSON安全差分レビュー｜STAY SELECT</title><meta name="description" content="STAY SELECT施設JSONの旧版・新版を端末内で比較。施設削除、出典変更、楽天成果URLの変更、重複を確認してCSV出力。"><link rel="stylesheet" href="assets/stay-json-change-review.css"></head><body><main><p><a href="index.html">STAY SELECT トップ</a></p><h1>施設JSON安全差分レビュー</h1><p>旧版・新版の <code>data/stays.json</code> を選んで比較。ファイルは端末内で処理し、サーバーには送信しません。</p><section class="inputs"><label>旧版JSON<input id="oldFile" type="file" accept=".json,application/json"></label><label>新版JSON<input id="newFile" type="file" accept=".json,application/json"></label><button id="compare">安全差分を検査</button><button id="download" disabled>差分CSVを保存</button></section><p id="status" role="status" aria-live="polite">未検査</p><section id="summary" aria-label="比較結果"></section><div class="scroll"><table><thead><tr><th>重要度</th><th>施設ID</th><th>施設名</th><th>変更区分</th><th>変更項目</th><th>内容</th></tr></thead><tbody id="rows"></tbody></table></div><p class="notice">施設削除、ID重複、既存施設の楽天成果リンク変更、公式掲載URLの変更を重点確認します。検査結果は公開許可・営業確認・予約可否の証明ではありません。自動公開・予約CTA作成はありません。</p></main><script src="assets/stay-json-change-review.js" defer></script></body></html>
