<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="未成年者のみでの宿泊について、保護者同意書・本人確認・提出期限などの確認状況を最大4施設で比較する手入力メモ。"><title>未成年者のみの宿泊・同意書チェック｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-minor-consent-check.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>未成年者のみの宿泊・同意書チェック</h1><p>受入年齢、保護者同意書、本人確認書類、提出期限を施設ごとに整理できます。</p></div></header><main class="wrap"><section class="panel"><h2>全国8,569施設から検索</h2><label for="search">宿名・都道府県</label><input id="search" type="search" placeholder="例：民宿、熊本県"><p id="status" aria-live="polite">読み込み中</p><div id="results" class="results"></div></section><section class="panel"><h2>受入条件の確認メモ（最大4施設）</h2><p class="notice">施設によって受入条件・必要書類・提出方法が異なります。必ず施設に直接確認してください。法律上の可否を自動判定しません。保護者や未成年者の氏名、生年月日、連絡先、本人確認書類画像などの個人情報は入力しないでください。入力内容は端末のブラウザ内に保存されます。</p><div id="selected" class="cards"></div><div class="actions"><button id="save" type="button">ブラウザ保存</button><button id="csv" type="button">CSV出力</button><button id="json" type="button">JSONバックアップ</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button" class="light">全解除</button></div><p id="message" role="status"></p></section></main><script src="assets/stay-minor-consent-check.js" defer></script></body></html>
