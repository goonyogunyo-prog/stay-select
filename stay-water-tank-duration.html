<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="コテージ・キャンプ場の生活用水タンク容量、利用人数、一日使用量、予備量から利用可能日数を端末内で試算します。"><title>生活用水タンクの利用日数試算｜STAY SELECT</title><link rel="stylesheet" href="stay-water-tank-duration.css"><script defer src="stay-water-tank-duration.js"></script></head><body><header><a href="index.html">STAY SELECT トップ</a><h1>生活用水タンクの利用日数試算</h1><p>貸別荘・キャンプ・山小屋の生活用水計画に</p></header><main><section><h2>条件を入力</h2><label for="tank">タンク容量（L）</label><input id="tank" type="number" min="0.1" step="0.1" value="120"><label for="people">利用人数</label><input id="people" type="number" min="1" step="1" value="4"><label for="liters">1人1日の想定使用量（L）</label><input id="liters" type="number" min="0.1" step="0.1" value="8"><label for="reserve">残しておく予備量（L）</label><input id="reserve" type="number" min="0" step="0.1" value="20"><button id="calculate" type="button">試算する</button><button id="download" type="button" disabled>結果をCSV保存</button><p id="errors" role="alert"></p><output id="result" aria-live="polite"></output></section><section><h2>利用上の注意</h2><p class="warn">この数値は入力した仮定に基づく算術試算です。飲用可否・水質・法令適合・安全な備蓄量・補給可能性は保証しません。施設の実際の給水設備・制限・飲料水の安全性を必ず確認してください。</p><p class="muted">入力・計算・CSV作成は端末内のみ。予約・決済・外部送信はありません。料金・空室・営業・設備の情報は自動取得しません。</p></section><p><a href="new-arrivals.html">新着施設・公式出典を見る</a></p></main></body></html>
