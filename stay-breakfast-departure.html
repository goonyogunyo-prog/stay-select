<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="朝食の提供時間と出発時刻・退室準備時間を利用者が入力し、宿ごとの時間の余裕を比較します。"><title>朝食・出発時刻チェッカー｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-breakfast-departure.css"></head><body><header><a href="index.html">STAY SELECT</a><h1>朝食・出発時刻チェッカー</h1><p>朝食を食べてから予定どおり宿を出られるか、最大4宿で比較。</p></header><main><section class="panel"><h2>宿を探す</h2><p>全国 <strong id="total">—</strong> 施設から検索できます。</p><label for="search">施設名・都道府県</label><input id="search" type="search" placeholder="例：新潟県 温泉"><div id="results" class="results" aria-live="polite"></div></section><section class="panel"><h2>朝食・出発時間の確認</h2><p class="hint">すべて利用者が公式案内・施設への問い合わせで確認し、入力してください。未入力は「要確認」とし、宿の提供時間を自動推測しません。午前0時をまたぐ予定はこの計算の対象外です。</p><div id="cards" class="cards"></div></section><section class="panel"><h2>保存と持ち出し</h2><div class="actions"><button id="save">ブラウザに保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="upload">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="secondary">全消去</button></div><p id="status" role="status"></p><p class="hint">共有端末では個人情報や予約番号を入力しないでください。保存はこの端末内のみです。</p></section><a href="index.html">トップへ戻る</a></main><script src="assets/stay-breakfast-departure.js" defer></script></body></html>
