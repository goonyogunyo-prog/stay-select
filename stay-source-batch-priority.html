<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>公式掲載URL別・再確認優先順位｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-source-batch-priority.css"><script defer src="assets/stay-source-batch-priority.js"></script></head><body><main><nav><a href="index.html">← STAY SELECT</a> ／ <a href="new-arrivals.html">新着38施設</a></nav><h1>公式掲載URL別・再確認優先順位</h1><p>同じ公式掲載URLに紐づく施設を束ね、出典不足・確認日・件数から再確認の優先度を計算します。確認の代行や予約可否の保証ではありません。自動公開・GitHub書込・予約CTA・成果URL発行なし。</p><section class="controls"><label>施設名・県・団体・出典URLで絞込 <input id="q" placeholder="例：熊野本宮" autocomplete="off"></label><label>優先度 <select id="level"><option value="all">すべて</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label><button id="export" type="button">全絞込結果CSV出力</button></section><p id="status" role="status">施設データ読込中…</p><p id="summary"></p><div class="tablewrap"><table><thead><tr><th>優先度</th><th>施設数</th><th>公式掲載URL / 団体</th><th>県</th><th>最古確認日</th><th>例示施設</th></tr></thead><tbody id="results"></tbody></table></div><p>表示は先頭200グループ。CSVは絞込結果の全グループを出力。出典URLはリンク先を閲覧して確認するためのもので、機械的に現在の営業を保証しません。</p></main></body></html>
