<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿への事前荷物発送、受取条件と返送ルールを最大4宿で確認・比較する手入力メモ。"><title>宿への荷物発送・受取確認｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-parcel-receipt.css"></head><body><header><div class="wrap"><a href="index.html">← STAY SELECT</a><h1>宿への荷物発送・受取確認</h1><p>荷物の事前発送・保管・返送の条件を、宿に問い合わせるためのメモです。</p></div></header><main class="wrap"><section class="panel"><h2>全国8,531施設から検索</h2><label for="search">宿名・都道府県</label><input id="search" type="search" placeholder="例：民宿、沖縄県"><p id="status" aria-live="polite">施設データを読み込み中</p><div id="results" class="results"></div></section><section class="panel"><h2>発送前に確認する項目（最大4宿）</h2><p class="note">受取可否・保管期間・発送先表記・料金・宅配便の対応は宿の公式案内や直接問い合わせで確認してください。入力内容は宿の設備やサービスを証明しません。送信・予約は行いません。</p><div id="selected" class="cards"></div><div class="actions"><button id="save">ブラウザ保存</button><button id="csv">CSV出力</button><button id="json">JSONバックアップ</button><label class="file">JSON復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" class="light">全解除</button></div><p id="message" role="status"></p></section></main><script src="assets/stay-parcel-receipt.js" defer></script></body></html>
