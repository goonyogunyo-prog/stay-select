<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="スキー・スノーボード旅行のブーツ乾燥設備について、2施設の同時処理枠と夜間利用時間から必要サイクル数を比較する端末内計算ツール。"><title>ブーツ乾燥枠と夜間時間の比較｜STAY SELECT</title><link rel="stylesheet" href="stay-ski-boot-drying-plan.css"></head>
<body><header><a href="index.html">STAY SELECT</a><a href="new-arrivals.html">新着施設</a></header><main><h1>ブーツ乾燥枠・夜間時間の2施設比較</h1><p>グループのブーツ組数と、各宿で仮定する乾燥機の同時処理枠・1サイクルの時間・利用可能時間を比較します。乾燥完了や設備の存在を保証するものではありません。</p><section><h2>共通条件</h2><label>乾燥したいブーツの組数<input id="pairs" type="number" min="1" max="100" step="1" value="8"></label></section><div class="grid"><section><h2>施設A</h2><label>施設名<input id="nameA" maxlength="80" value="施設A"></label><label>1回に乾燥できる組数<input id="slotsA" type="number" min="1" max="100" step="1" value="4"></label><label>仮定する1サイクル（分）<input id="cycleA" type="number" min="1" max="1440" step="1" value="90"></label><label>夜間に使える時間（分）<input id="windowA" type="number" min="0" max="1440" step="1" value="240"></label></section><section><h2>施設B</h2><label>施設名<input id="nameB" maxlength="80" value="施設B"></label><label>1回に乾燥できる組数<input id="slotsB" type="number" min="1" max="100" step="1" value="2"></label><label>仮定する1サイクル（分）<input id="cycleB" type="number" min="1" max="1440" step="1" value="90"></label><label>夜間に使える時間（分）<input id="windowB" type="number" min="0" max="1440" step="1" value="240"></label></section></div><div class="actions"><button id="calculate" type="button">比較する</button><button id="download" type="button">結果をCSV保存</button></div><p id="error" role="alert" aria-live="assertive"></p><div id="results" aria-live="polite"></div><p class="note">このツールは入力した仮定値による算術試算です。実際の乾燥機・電源・利用ルール・乾燥性能・安全性は施設へ確認してください。乾燥機器の持ち込みや無断使用はしないでください。入力値は端末内だけで処理し、予約・外部送信・成果リンクはありません。</p></main><script src="stay-ski-boot-drying-plan.js" defer></script></body></html>
