<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="宿のチェックアウト延長と荷物預かりの概算費用を比較。入力は端末内で処理し、予約・送信なし。"><title>チェックアウト延長と荷物預かり費用の比較｜STAY SELECT</title><link rel="stylesheet" href="stay-late-checkout-cost-planner.css"></head><body><header><a href="index.html">STAY SELECT</a><span>旅の段取りツール</span></header><main><h1>チェックアウト延長 vs 荷物預かり</h1><p>希望出発時刻まで部屋を延長する費用と、通常チェックアウト後に荷物を預ける費用を2施設で試算します。料金・延長可能時間・預かり可否は<strong>必ず施設に確認</strong>してください。</p><form id="form"><section><h2>共通条件</h2><div class="fields"><label>希望出発時刻<input type="time" id="departure" value="13:30" required></label><label>旅行人数<input type="number" id="people" value="2" min="1" max="50" step="1" required></label></div></section><section><h2>候補A</h2><div class="fields"><label>通常チェックアウト<input type="time" id="a-out" value="10:00" required></label><label>延長可能上限（分）<input type="number" id="a-limit" value="240" min="0" max="720" step="30" required></label><label>延長30分あたり（円／室）<input type="number" id="a-rate" value="700" min="0" max="50000" step="1" required></label><label>荷物預かり費用（円／人）<input type="number" id="a-storage" value="0" min="0" max="10000" step="1" required></label><label><input type="checkbox" id="a-canstore" checked> 荷物預かりが利用可能と仮定</label></div></section><section><h2>候補B</h2><div class="fields"><label>通常チェックアウト<input type="time" id="b-out" value="11:00" required></label><label>延長可能上限（分）<input type="number" id="b-limit" value="180" min="0" max="720" step="30" required></label><label>延長30分あたり（円／室）<input type="number" id="b-rate" value="1000" min="0" max="50000" step="1" required></label><label>荷物預かり費用（円／人）<input type="number" id="b-storage" value="300" min="0" max="10000" step="1" required></label><label><input type="checkbox" id="b-canstore" checked> 荷物預かりが利用可能と仮定</label></div></section><button type="submit">2施設を比較する</button><button type="button" id="download">結果をCSV保存</button></form><div id="result" role="status" aria-live="polite"></div><p class="note">※このツールは料金表ではありません。延長料金の単位、清掃・チェックアウト締切、荷物預かりの営業時間・サイズ制限・貴重品の扱いは施設ごとに異なります。日付をまたぐ希望出発には対応していません。予約・決済・外部送信なし。</p></main><script src="stay-late-checkout-cost-planner.js"></script></body></html>
