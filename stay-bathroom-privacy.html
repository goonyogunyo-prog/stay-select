<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国6,599宿から最大6宿を選び、トイレ・シャワー・洗面所の共用条件を確認・比較する個人用メモ。"><title>トイレ・シャワー共用条件の比較｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-bathroom-privacy.css"></head><body><header><a href="index.html">← STAY SELECT</a><h1>トイレ・シャワー・洗面所の共用条件を比較</h1><p>旅館・民宿・ゲストハウスで気になる「客室専用／共用」を、宿に確認して整理できます。</p></header><main><section class="notice"><strong>宿の設備を自動判定しません。</strong> すべての入力欄は利用者の確認メモです。施設の掲載元・独自公式サイトで最新条件を確認してください。未照合施設に楽天予約CTAはありません。氏名・予約番号・住所・暗証番号などの個人情報は入力しないでください。</section><section class="panel"><h2>施設検索</h2><label for="query">宿泊施設名</label><input id="query" type="search" placeholder="施設名で検索"><label for="pref">都道府県</label><select id="pref"><option value="">すべて</option></select><p id="status" aria-live="polite">読み込み中…</p><div id="results" class="cards"></div></section><section class="panel"><h2>比較メモ <span id="selectedCount">0/6</span></h2><p>最大6宿。入力はこのブラウザ内に保存します。CSV/JSON出力・JSON復元が可能です。</p><div id="selected" class="cards"></div><div class="actions"><button id="csv" type="button">CSVを保存</button><button id="json" type="button">JSONを保存</button><label class="upload">JSONを復元<input id="import" type="file" accept="application/json,.json"></label><button id="clear" type="button" class="secondary">すべて消去</button></div></section></main><script defer src="assets/stay-bathroom-privacy.js"></script></body></html>
