<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="全国5,763施設から宿を選び、大浴場・貸切風呂の利用時間、清掃時間、男女入替、最終受付を手入力して比較。施設の実情報は自動判定しません。"><link rel="stylesheet" href="assets/stay-bath-time-planner.css"><title>大浴場の利用時間メモ｜STAY SELECT</title></head><body><header><a href="index.html">← STAY SELECT</a><h1>大浴場の利用時間メモ</h1><p>到着後の入浴計画を宿ごとに比較</p></header><main><section class="panel"><p>宿の公式案内・スタッフに確認した入浴時間を<strong>自分で記録</strong>するためのツールです。大浴場の実際の営業、男女入替、予約枠、設備は自動判定しません。</p><label for="search">宿泊施設を検索（全5,763件）</label><input id="search" type="search" placeholder="宿名・都道府県を入力"><select id="stay" aria-label="宿泊施設候補"><option value="">検索中...</option></select><button id="add" type="button">この宿を比較に追加</button><p id="notice" role="status" aria-live="polite"></p></section><section class="panel"><h2>入浴条件の比較（最大6宿）</h2><div id="cards" class="cards"></div><div class="buttons"><button id="csv" type="button">CSVを出力</button><button id="json" type="button">JSONを出力</button><label class="upload">JSONを復元<input id="import" type="file" accept=".json,application/json"></label><button id="clear" type="button">全件削除</button></div><p class="hint">このブラウザ内に保存されます。共有端末では情報の取り扱いに注意してください。日付・料金・空室・設備の自動照合や予約は行いません。</p></section></main><script src="assets/stay-bath-time-planner.js" defer></script></body></html>
