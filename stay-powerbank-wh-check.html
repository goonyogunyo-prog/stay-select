<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊旅行のモバイルバッテリー容量メモ | STAY SELECT</title><link rel="stylesheet" href="stay-powerbank-wh-check.css"></head><body><main><h1>モバイルバッテリー容量メモ</h1><p>旅行前に2台の定格Whを計算し、持ち込み条件を航空会社に確認するためのメモを作れます。<strong>持ち込み可否を判定・保証する機能ではありません。</strong></p><section id="items"><fieldset><legend>候補A</legend><label>名称 <input id="nameA" value="候補A" maxlength="100"></label><label>容量(mAh) <input id="mahA" type="number" min="1" max="1000000" value="10000"></label><label>公称電圧(V) <input id="voltA" type="number" min="0.01" max="100" step="any" value="3.7"></label></fieldset><fieldset><legend>候補B</legend><label>名称 <input id="nameB" value="候補B" maxlength="100"></label><label>容量(mAh) <input id="mahB" type="number" min="1" max="1000000" value="20000"></label><label>公称電圧(V) <input id="voltB" type="number" min="0.01" max="100" step="any" value="3.7"></label></fieldset></section><button id="calc">計算</button><button id="csv">CSV保存</button><div id="result" role="status" aria-live="polite"></div><p>Wh = mAh × V ÷ 1000。ラベル表記・予備電池の取扱い・個数制限・機内持ち込みの規定は航空会社と出発地の最新規則を直接確認してください。計算は端末内で完結し、予約や外部送信はありません。</p><a href="index.html">トップに戻る</a></main><script src="stay-powerbank-wh-check.js"></script></body></html>
