<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊の荷物重量・預け入れ比較｜STAY SELECT</title><link rel="stylesheet" href="stay-luggage-weight.css"><main><h1>宿泊の荷物重量・預け入れ比較</h1><p>荷物ごとの重量を合算し、手荷物の上限との差を確認。航空会社や交通機関の規定は必ず公式情報を確認してください。</p><label>重量上限（kg）<input id="limit" type="number" min="0" step="0.1" value="7"></label><div id="items"></div><button id="add">荷物を追加</button><button id="calc">計算する</button><button id="copy">結果をコピー</button><output id="result" aria-live="polite"></output><p class="note">入力内容はこのページ内でのみ計算し、保存・送信しません。個数・サイズ制限や預け入れ可否は判定対象外です。</p></main><script src="stay-luggage-weight.js"></script></html>
