<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿への問い合わせ回答・根拠台帳｜STAY SELECT</title><link rel="stylesheet" href="assets/stay-reply-evidence-ledger.css" defer></head><body><header><a href="index.html">← STAY SELECT</a><h1>宿への問い合わせ回答・根拠台帳</h1><p>施設からの回答を手動記録し、比較・再確認できます。自動問い合わせ・設備判定・予約は行いません。</p></header><main><section class="panel"><label>施設名を検索<input id="query" type="search" placeholder="宿名を入力" autocomplete="off"></label><div id="results" role="listbox" aria-label="施設候補"></div><p id="selected">施設未選択</p><div class="formgrid"><label>問い合わせ日<input id="asked" type="date"></label><label>回答日<input id="replied" type="date"></label><label>確認項目<select id="topic"><option>料金・追加費用</option><option>キャンセル条件</option><option>食事・アレルギー</option><option>駐車場・交通</option><option>客室・設備</option><option>チェックイン・アウト</option><option>その他</option></select></label><label>確認状況<select id="status"><option>回答待ち</option><option>回答あり（要再確認）</option><option>回答あり（記録済）</option><option>確認できず</option></select></label></div><label>宿からの回答内容（利用者が入力）<textarea id="answer" rows="3" placeholder="電話やメールで聞いた内容を記録。未確認情報を断定しない"></textarea></label><label>根拠・連絡方法（メール件名・日時など）<input id="evidence" placeholder="例：10/29 15:00 電話確認。個人情報は入力しない"></label><button id="add" type="button">この回答を台帳に追加</button><p id="message" role="status"></p></section><section class="panel"><h2>回答台帳 <span id="count">0</span>件</h2><label>状態で絞り込み<select id="filter"><option value="">すべて</option><option>回答待ち</option><option>回答あり（要再確認）</option><option>回答あり（記録済）</option><option>確認できず</option></select></label><div id="entries"></div><div class="actions"><button id="exportCsv" type="button">CSV出力</button><button id="exportJson" type="button">JSON出力</button><label class="filelabel">JSON復元<input id="importJson" type="file" accept=".json,application/json"></label></div></section><p class="note">保存先はこの端末のブラウザのみ。宿への連絡・予約は自動実行されません。施設データの設備・料金・営業・空室・楽天個別URLは未検証です。</p></main><script src="assets/stay-reply-evidence-ledger.js" defer></script></body></html>
