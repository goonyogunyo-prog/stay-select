<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客室の広さ・人数・料金を2候補比較｜STAY SELECT</title><meta name="description" content="2候補の床面積・荷物置き場・人数・料金から、使える面積と一人あたりの広さを端末内で試算。CSV保存対応。"><link rel="stylesheet" href="stay-room-space-per-person.css"></head><body><main><p><a href="index.html">STAY SELECT ホーム</a></p><h1>客室の広さ・人数・料金を2候補比較</h1><p>公式サイト等で確認した<strong>客室の床面積（㎡）</strong>、荷物が占める面積の目安、宿泊人数、部屋料金を入力し、<strong>一人あたりの使える広さ</strong>と費用を比べます。面積は利用者の推定であり、実際の寝具配置や通路幅・バリアフリー性を保証しません。</p><form id="spaceForm"><div class="rooms"><fieldset><legend>候補A</legend><label>床面積（㎡）<input name="areaA" type="number" min="1" max="10000" step="0.1" value="32" required></label><label>荷物などで使えない面積（㎡）<input name="luggageA" type="number" min="0" max="10000" step="0.1" value="4" required></label><label>人数<input name="peopleA" type="number" min="1" max="100" step="1" value="4" required></label><label>宿泊料金合計（円）<input name="priceA" type="number" min="0" max="100000000" step="1" value="48000" required></label></fieldset><fieldset><legend>候補B</legend><label>床面積（㎡）<input name="areaB" type="number" min="1" max="10000" step="0.1" value="42" required></label><label>荷物などで使えない面積（㎡）<input name="luggageB" type="number" min="0" max="10000" step="0.1" value="6" required></label><label>人数<input name="peopleB" type="number" min="1" max="100" step="1" value="4" required></label><label>宿泊料金合計（円）<input name="priceB" type="number" min="0" max="100000000" step="1" value="62000" required></label></fieldset></div><button type="submit">比較する</button><button type="button" id="downloadCsv" disabled>結果をCSV保存</button></form><p id="error" role="alert"></p><section id="result" aria-live="polite"></section><p class="notice">人数は予約プランの定員・添い寝条件を優先してください。料金・面積・設備は自動取得しません。予約・決済・外部送信は行いません。</p></main><script src="stay-room-space-per-person.js"></script></body></html>
