<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿泊施設のバリアフリー確認メモ | STAY SELECT</title><link rel="stylesheet" href="stay-accessibility-confirmation.css"></head><body><main><h1>宿泊施設のバリアフリー確認メモ</h1><p>予約前に施設へ確認したい事項を整理します。施設の対応を保証するものではありません。</p><label>施設名<input id="hotel" placeholder="施設名"></label><label>宿泊日<input id="date" type="date"></label><fieldset><legend>確認したい設備・サービス</legend><label><input type="checkbox" value="入口の段差・スロープ">入口の段差・スロープ</label><label><input type="checkbox" value="エレベーターの有無・寸法">エレベーターの有無・寸法</label><label><input type="checkbox" value="客室・浴室・トイレの段差と手すり">客室・浴室・トイレの段差と手すり</label><label><input type="checkbox" value="車いす対応客室の空き">車いす対応客室の空き</label><label><input type="checkbox" value="館内移動と駐車場からの経路">館内移動と駐車場からの経路</label><label><input type="checkbox" value="食事・アレルギー等の個別相談">食事・アレルギー等の個別相談</label></fieldset><label>追加の確認事項<textarea id="notes" rows="4" placeholder="必要な寸法や配慮事項など"></textarea></label><button id="build">確認文を作成</button><button id="copy" type="button">結果をコピー</button><label>確認文<textarea id="result" rows="10" readonly></textarea></label><p role="status" id="status"></p><small>入力内容はこのページ内で処理し、外部送信・保存しません。予約前に必ず宿泊施設へ直接確認してください。</small></main><script src="stay-accessibility-confirmation.js"></script></body></html>
